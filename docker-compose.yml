services:
  mysql:
    image: mysql:8.0
    container_name: caquick-mysql
    # MySQL 8 기본 caching_sha2_password 는 비TLS·콜드 캐시 첫 연결에서 RSA 공개키
    # 조회를 요구하는데 mariadb 드라이버(Prisma 7 어댑터)가 기본적으로 이를 차단해
    # 연결이 실패한다. 로컬은 mysql_native_password 로 통일해 우회한다(TLS 정책은
    # 홈서버 compose 때 함께 결정). 새로 생성되는 사용자도 동일 plugin.
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: CaQuick
      MYSQL_USER: caquick
      MYSQL_PASSWORD: caquick
    ports:
      - '3306:3306'
    volumes:
      - caquick-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caquick-redis
    # GraphQL subscription PubSub 백엔드. 영속화 불필요(휘발성 이벤트 브로커).
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caquick-mysql-data:
