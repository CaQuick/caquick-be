name: CI

on:
  push:
    branches: [main, develop, develop-msa]
  pull_request:
    branches: [main, develop, develop-msa]

permissions:
  contents: read

concurrency:
  # PR push: 같은 PR의 이전 실행을 취소
  # main/develop push: 커밋별로 독립 실행 (base 커버리지 업로드 유실 방지)
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js (24.x) & Yarn cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: GraphQL codegen
        run: yarn graphql:codegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: DTO ↔ SDL sync check (warning during migration)
        run: yarn dto:check --warning

      # SDL description 커버리지 게이트. 임계치는 현재 달성치로 고정돼 있어
      # 회귀만 차단한다 — 설명 없는 필드를 새로 추가하면 여기서 걸린다.
      - name: SDL description coverage check
        run: yarn docs:check

      - name: Script unit tests
        run: yarn test:scripts

      # 아키텍처 의존 규칙 게이트(순환·Prisma-ban·레이어). 로컬 pre-push(validate:push)뿐 아니라
      # 보호된 check status에서도 강제해야 --no-verify/Husky 미설치 환경의 우회를 막는다.
      - name: Architecture check (dependency-cruiser)
        run: yarn arch:check

      # 전체 회귀·커버리지 임계는 CI(check·coverage-report)가 맡는다 — 로컬 pre-push는 변경에 닿는 spec만 돌린다.
      - name: Test with coverage
        run: yarn test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          # disable_search: 지정한 파일만 업로드 (자동 탐색 결과와 섞이지 않도록)
          disable_search: true
          name: backend-lcov
          # 업로드 실패 시 조용히 넘어가지 않고 CI 실패로 가시화 (진단/운영 모두 권장).
          fail_ci_if_error: true
          verbose: true

      - name: Build (연속 2회 — 증분 캐시 오염 회귀 검출)
        run: |
          yarn graphql:docs
          yarn build
          # 왜 2회인가: deleteOutDir이 dist를 지우는데 tsbuildinfo가 dist 밖에 있으면
          # 캐시만 살아남아 tsc가 "전부 최신"으로 오판, emit을 건너뛰고 dist가 빈 채로
          # 남는다. clean 체크아웃 1회 빌드로는 이 상태가 재현되지 않아 PR #259 회귀가
          # 8일간 CI를 그대로 통과했다. 2회차가 그 상태를 만들어 준다.
          yarn build
          test -f dist/main.js

  # arm64 앱 이미지(홈서버 맥미니). check와 나란히 돌려 배포까지 걸리는 시간을 줄인다 — Deploy는 이 워크플로(CI) 전체가
  # 성공해야 시작하므로, check가 실패한 커밋은 이미지가 올라가도 배포되지 않는다.
  # PR은 빌드만(Dockerfile 게이트), main push만 GHCR에 :<sha>로 푸시한다. 가변 태그(:main)는 늦게 끝난 옛 빌드가 덮어쓸 수 있어
  # 두지 않는다 — 배포·롤백은 항상 sha. 공개 레포라 셀프호스트가 아닌 GitHub 호스트 arm64 러너(QEMU 없이 네이티브)를 쓴다.
  image:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR (main만)
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/caquick/caquick-be
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Build (main이면 push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  coverage-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js (24.x) & Yarn cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Coverage Report (jest-coverage-report)
        uses: ArtiomTr/jest-coverage-report-action@7f750dd50f5585533321eb7ebc482b936b49a5d4 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          test-script: yarn jest --coverage --ci
          skip-step: install
          annotations: failed-tests

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          subjectPattern: ^.+$
          subjectPatternError: |
            PR 제목이 Conventional Commits 형식이 아닙니다.
            예: "feat: 새 기능 추가", "fix: 버그 수정"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
