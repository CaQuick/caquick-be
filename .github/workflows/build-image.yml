name: Build Image

# 앱 이미지(P2-07, M5). main push → arm64 빌드 → GHCR(:<sha>·:main). PR은 빌드만(푸시 없음) — Dockerfile 게이트.
# 홈서버(맥미니, arm64)에 맞춰 arm64만 만든다. 공개 레포라 GitHub 호스트 arm64 러너를 쓴다(QEMU 없이 네이티브).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop, develop-msa]

permissions:
  contents: read
  packages: write

# main 빌드는 그룹 하나 — 앞선 빌드를 취소해 늦게 끝난 옛 커밋이 새 커밋 뒤에 배포되지 않게(취소된 run은 배포가 건너뛴다)
concurrency:
  group: ${{ github.event_name == 'push' && 'build-image-main' || format('build-image-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR (main push만)
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/caquick/caquick-be
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build (main이면 push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
