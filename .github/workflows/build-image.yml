name: Build Image

# 앱 이미지(P2-07, M5). main은 **CI(pr-check)가 같은 커밋에서 성공한 뒤** arm64 빌드 → GHCR(:<sha>만 — 가변 태그 :main은 늦게 끝난 옛 빌드가
# 덮어쓸 수 있어 두지 않는다. 배포·롤백은 항상 sha) → Deploy.
# 이미지 빌드는 lint·테스트를 돌리지 않으므로 push 직후가 아니라 CI 성공(workflow_run)에 건다 — 두 PR이 각각 통과해도 합친 main이
# 깨질 수 있어서(strict_required_status_checks_policy=false). PR은 빌드만(푸시 없음) — Dockerfile 게이트.
# 홈서버(맥미니, arm64)에 맞춰 arm64만 만든다. 공개 레포라 GitHub 호스트 arm64 러너를 쓴다(QEMU 없이 네이티브).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main, develop, develop-msa]

permissions:
  contents: read
  packages: write

# 그룹은 커밋(sha)별 — 옛 커밋의 늦은 CI 완료가 지금 main 끝의 빌드를 취소하지 않게. 순서 보호는 아래 job의
# head_sha == github.sha(빌드)와 Deploy의 같은 검사가 맡는다(옛 커밋은 빌드도 배포도 건너뛴다)
concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('build-image-main-{0}', github.event.workflow_run.head_sha) || format('build-image-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  build:
    # main: 이 레포 main에 대한 push의 CI가 성공했고, 그 커밋이 아직 main 끝일 때만(옛 커밋의 늦은 CI는 건너뜀)
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR (main만)
        if: github.event_name == 'workflow_run'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/caquick/caquick-be
          tags: |
            type=raw,value=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build (main이면 push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'workflow_run' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
