# 09에서 경보 규칙·exporter(mysqld·redis)를 더한다. 앱 /metrics는 Bearer 토큰 — compose secret(.env의 METRICS_ACCESS_TOKEN)이 /run/secrets/metrics_token으로 들어온다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: caquick-app
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['api:4000']
        labels: { role: api }
      - targets: ['worker:4000']
        labels: { role: worker }

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
