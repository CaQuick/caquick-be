extend type Query {
  """내 매장 FAQ 목록을 조회한다."""
  sellerFaqTopics: [SellerFaqTopic!]!
  """내 매장 배너 목록을 조회한다."""
  sellerBanners(input: SellerCursorInput): SellerBannerConnection!
  """내 매장 감사 로그 목록을 조회한다."""
  sellerAuditLogs(input: SellerAuditLogListInput): SellerAuditLogConnection!
}

extend type Mutation {
  """FAQ 항목을 생성한다."""
  sellerCreateFaqTopic(input: SellerCreateFaqTopicInput!): SellerFaqTopic!
  """FAQ 항목을 수정한다."""
  sellerUpdateFaqTopic(input: SellerUpdateFaqTopicInput!): SellerFaqTopic!
  """FAQ 항목을 삭제한다."""
  sellerDeleteFaqTopic(topicId: ID!): Boolean!

  """배너를 생성한다."""
  sellerCreateBanner(input: SellerCreateBannerInput!): SellerBanner!
  """배너를 수정한다."""
  sellerUpdateBanner(input: SellerUpdateBannerInput!): SellerBanner!
  """배너를 삭제한다."""
  sellerDeleteBanner(bannerId: ID!): Boolean!
}

type SellerFaqTopic {
  id: ID!
  storeId: ID!
  title: String!
  answerHtml: String!
  sortOrder: Int!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""SellerCreateFaqTopicInput 입력 타입"""
input SellerCreateFaqTopicInput {
  title: String!
  answerHtml: String!
  sortOrder: Int
  isActive: Boolean = true
}

"""SellerUpdateFaqTopicInput 입력 타입"""
input SellerUpdateFaqTopicInput {
  topicId: ID!
  title: String
  answerHtml: String
  sortOrder: Int
  isActive: Boolean
}

"""SellerBannerPlacement 열거형"""
enum SellerBannerPlacement {
  """홈 상단 메인 배너 슬롯."""
  HOME_MAIN
  """홈 하위 섹션 배너 슬롯."""
  HOME_SUB
  """카테고리 진입 화면 배너 슬롯."""
  CATEGORY
  """매장 상세 배너 슬롯."""
  STORE
  """검색 진입 화면 배너 슬롯"""
  SEARCH
}

"""SellerBanner 타입"""
type SellerBanner {
  id: ID!
  placement: SellerBannerPlacement!
  title: String
  imageUrl: String!
  linkType: BannerLinkType!
  linkUrl: String
  linkProductId: ID
  linkStoreId: ID
  linkCategoryId: ID
  startsAt: DateTime
  endsAt: DateTime
  sortOrder: Int!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""SellerBannerConnection 타입"""
type SellerBannerConnection {
  items: [SellerBanner!]!
  nextCursor: ID
}

"""SellerCreateBannerInput 입력 타입"""
input SellerCreateBannerInput {
  placement: SellerBannerPlacement!
  title: String
  imageUrl: String!
  linkType: BannerLinkType = NONE
  linkUrl: String
  linkProductId: ID
  linkStoreId: ID
  linkCategoryId: ID
  startsAt: DateTime
  endsAt: DateTime
  sortOrder: Int
  isActive: Boolean = true
}

"""SellerUpdateBannerInput 입력 타입"""
input SellerUpdateBannerInput {
  bannerId: ID!
  placement: SellerBannerPlacement
  title: String
  imageUrl: String
  linkType: BannerLinkType
  linkUrl: String
  linkProductId: ID
  linkStoreId: ID
  linkCategoryId: ID
  startsAt: DateTime
  endsAt: DateTime
  sortOrder: Int
  isActive: Boolean
}

"""감사 로그가 가리키는 대상 종류."""
enum SellerAuditTargetType {
  """매장 정보·영업시간·픽업 정책 등 매장 설정."""
  STORE
  """상품과 그 하위(이미지·옵션·커스텀 템플릿)."""
  PRODUCT
  """주문. 주로 상태 변경이 기록된다."""
  ORDER
  """구매자 문의 대화."""
  CONVERSATION
  """판매자 비밀번호 변경. targetId에는 비밀번호를 바꾼 판매자 본인의 계정 ID가 들어간다."""
  CHANGE_PASSWORD
}

"""감사 로그에 기록된 행위 종류."""
enum SellerAuditActionType {
  """생성."""
  CREATE
  """수정."""
  UPDATE
  """삭제(soft-delete 포함)."""
  DELETE
  """상태 전이. 주문 상태 변경·노출 여부 전환이 여기 해당한다."""
  STATUS_CHANGE
}

"""SellerAuditLog 타입"""
type SellerAuditLog {
  id: ID!
  actorAccountId: ID!
  storeId: ID
  targetType: SellerAuditTargetType!
  targetId: ID!
  action: SellerAuditActionType!
  beforeJson: String
  afterJson: String
  ipAddress: String
  userAgent: String
  createdAt: DateTime!
}

"""SellerAuditLogConnection 타입"""
type SellerAuditLogConnection {
  items: [SellerAuditLog!]!
  nextCursor: ID
}

"""SellerAuditLogListInput 입력 타입"""
input SellerAuditLogListInput {
  limit: Int = 20
  cursor: ID
  targetType: SellerAuditTargetType
}
