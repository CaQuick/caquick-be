extend type Query {
  """내 매장 주문 목록을 조회한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerOrderList(input: SellerOrderListInput): SellerOrderConnection!
  """내 매장 주문 상세를 조회한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerOrder(orderId: ID!): SellerOrderDetail!
}

extend type Mutation {
  """주문 상태를 변경한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerUpdateOrderStatus(input: SellerUpdateOrderStatusInput!): SellerOrderSummary!
}

"""주문 목록 카드. 상세는 sellerOrder로 재조회한다."""
type SellerOrderSummary {
  id: ID!
  """주문번호. 구매자에게 노출되는 식별자이며 검색(search) 대상이다."""
  orderNumber: String!
  """현재 주문 상태."""
  status: OrderStatusType!
  """픽업 예정 일시."""
  pickupAt: DateTime!
  """주문자 이름. 구매자가 주문 시 입력했거나 프로필 닉네임에서 온 값."""
  buyerName: String!
  """주문자 연락처."""
  buyerPhone: String!
  """할인 반영 후 최종 결제 금액(원)."""
  totalPrice: Int!
  """주문 생성 시각. 목록 정렬 기준이다."""
  createdAt: DateTime!
}

"""주문 목록 페이지. 최신 주문이 먼저 온다."""
type SellerOrderConnection {
  """주문 카드. 최신 주문이 먼저 온다."""
  items: [SellerOrderSummary!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다. 불투명 토큰이라 값의 형식에 의존하지 않는다."""
  nextCursor: ID
}

"""
주문 목록 조회 조건. 모든 필터는 AND로 결합되고, 미지정 필터는 적용되지 않는다.
"""
input SellerOrderListInput {
  """한 번에 가져올 개수. 기본 20, 1~100으로 보정된다."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: ID
  """주문 상태 필터. 미지정 시 전체 상태."""
  status: OrderStatusType
  """주문 생성 시각 하한(이상)."""
  fromCreatedAt: DateTime
  """주문 생성 시각 상한(이하)."""
  toCreatedAt: DateTime
  """픽업 일시 하한(이상)."""
  fromPickupAt: DateTime
  """픽업 일시 상한(이하)."""
  toPickupAt: DateTime
  """주문번호·주문자 이름·연락처 부분일치 검색. 셋 중 하나라도 맞으면 포함된다."""
  search: String
}

"""주문 상태 변경 이력 1건. 최신 변경이 먼저 온다."""
type SellerOrderStatusHistory {
  id: ID!
  """변경 전 상태. 최초 생성 이력이면 null."""
  fromStatus: OrderStatusType
  """변경 후 상태."""
  toStatus: OrderStatusType!
  """변경 시각."""
  changedAt: DateTime!
  """변경 사유 메모. 취소(CANCELED) 전이에는 필수로 기록된다."""
  note: String
}

"""
주문 시점의 옵션 스냅샷. 판매자가 이후 옵션을 수정·삭제해도 주문 내용은 변하지 않도록
주문 당시 값을 그대로 복사해 둔 것이다.
"""
type SellerOrderItemOptionSnapshot {
  id: ID!
  """옵션 그룹명(주문 당시)."""
  groupNameSnapshot: String!
  """선택한 옵션명(주문 당시)."""
  optionTitleSnapshot: String!
  """옵션 추가금(원, 주문 당시). 음수일 수 있다."""
  optionPriceDeltaSnapshot: Int!
}

"""주문 시점의 커스텀 문구 스냅샷."""
type SellerOrderItemCustomTextSnapshot {
  id: ID!
  """문구 토큰 키(주문 당시). 예: 케이크판 문구 슬롯 식별자."""
  tokenKeySnapshot: String!
  """토큰의 기본 문구(주문 당시)."""
  defaultTextSnapshot: String!
  """구매자가 실제로 입력한 문구."""
  valueText: String!
  """입력 화면 노출 순서. 오름차순."""
  sortOrder: Int!
}

"""자유 편집 요청에 구매자가 첨부한 참고 이미지."""
type SellerOrderItemCustomFreeEditAttachment {
  id: ID!
  """첨부 이미지 URL."""
  imageUrl: String!
  """첨부 순서. 오름차순."""
  sortOrder: Int!
}

"""주문 시점의 자유 편집 요청 스냅샷. 구매자가 이미지 위에 영역을 지정해 요청한 내용이다."""
type SellerOrderItemCustomFreeEditSnapshot {
  id: ID!
  """구매자가 지정한 편집 영역을 잘라낸 이미지 URL."""
  cropImageUrl: String!
  """해당 영역에 대한 요청 문구."""
  descriptionText: String!
  """요청 순서. 오름차순."""
  sortOrder: Int!
  """구매자가 참고로 붙인 이미지. 없으면 빈 배열."""
  attachments: [SellerOrderItemCustomFreeEditAttachment!]!
}

"""주문 품목 1건. 가격·옵션은 전부 주문 당시 스냅샷이다."""
type SellerOrderItemDetail {
  id: ID!
  storeId: ID!
  productId: ID!
  """상품명(주문 당시). 이후 상품명이 바뀌어도 이 값은 유지된다."""
  productNameSnapshot: String!
  """정가(원, 주문 당시)."""
  regularPriceSnapshot: Int!
  """할인가(원, 주문 당시). 할인이 없었으면 null이고 정가가 적용된다."""
  salePriceSnapshot: Int
  """주문 수량."""
  quantity: Int!
  """이 품목의 합계 금액(원). 옵션 추가금과 수량이 반영된 값이다."""
  itemSubtotalPrice: Int!
  """선택된 옵션(주문 당시 스냅샷)."""
  optionItems: [SellerOrderItemOptionSnapshot!]!
  """입력된 커스텀 문구(주문 당시 스냅샷)."""
  customTexts: [SellerOrderItemCustomTextSnapshot!]!
  """자유 편집 요청(주문 당시 스냅샷)."""
  freeEdits: [SellerOrderItemCustomFreeEditSnapshot!]!
}

"""주문 상세. items에는 내 매장 품목만 담긴다."""
type SellerOrderDetail {
  id: ID!
  """주문번호."""
  orderNumber: String!
  """주문한 구매자 계정 ID."""
  accountId: ID!
  """현재 주문 상태."""
  status: OrderStatusType!
  """픽업 예정 일시."""
  pickupAt: DateTime!
  """주문자 이름."""
  buyerName: String!
  """주문자 연락처."""
  buyerPhone: String!
  """할인 전 품목 합계(원)."""
  subtotalPrice: Int!
  """할인 금액(원). 할인이 없으면 0."""
  discountPrice: Int!
  """최종 결제 금액(원) = subtotalPrice - discountPrice."""
  totalPrice: Int!
  """각 상태에 도달한 시각. 아직 그 상태를 거치지 않았으면 null이다."""
  submittedAt: DateTime
  """CONFIRMED 도달 시각. 미도달 시 null."""
  confirmedAt: DateTime
  """MADE(제작 완료) 도달 시각. 미도달 시 null."""
  madeAt: DateTime
  """PICKED_UP 도달 시각. 미도달 시 null."""
  pickedUpAt: DateTime
  """CANCELED 도달 시각. 취소되지 않았으면 null."""
  canceledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  """내 매장에 속한 주문 품목만 포함된다. 다른 매장 품목은 내려오지 않는다."""
  items: [SellerOrderItemDetail!]!
  """상태 변경 이력. 최신순."""
  statusHistories: [SellerOrderStatusHistory!]!
}

"""
주문 상태 변경 입력. 전이 규칙은 OrderStatusType 설명을 따르며, 규칙에 어긋나면
BAD_REQUEST로 거절된다.
"""
input SellerUpdateOrderStatusInput {
  orderId: ID!
  """변경할 상태. 현재 상태에서 진입 가능한 값이어야 한다."""
  toStatus: OrderStatusType!
  """변경 사유 메모. toStatus가 CANCELED면 필수이고, 없으면 BAD_REQUEST."""
  note: String
}
