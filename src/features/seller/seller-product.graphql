extend type Query {
  """내 매장 상품 목록을 조회한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerProducts(input: SellerProductListInput): SellerProductConnection!
  """내 매장 상품 상세를 조회한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerProduct(productId: ID!): SellerProduct!
}

extend type Mutation {
  """내 매장 상품을 생성한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerCreateProduct(input: SellerCreateProductInput!): SellerProduct!
  """내 매장 상품을 수정한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerUpdateProduct(input: SellerUpdateProductInput!): SellerProduct!
  """내 매장 상품을 삭제한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerDeleteProduct(productId: ID!): Boolean!
  """내 매장 상품 활성 상태를 변경한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerSetProductActive(input: SellerSetProductActiveInput!): SellerProduct!

  """상품 이미지를 추가한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerAddProductImage(input: SellerAddProductImageInput!): SellerProductImage!
  """상품 이미지를 삭제한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerDeleteProductImage(imageId: ID!): Boolean!
  """상품 이미지 순서를 변경한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerReorderProductImages(input: SellerReorderProductImagesInput!): [SellerProductImage!]!

  """상품 카테고리 연결을 설정한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerSetProductCategories(input: SellerSetProductCategoriesInput!): SellerProduct!
  """상품 태그 연결을 설정한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerSetProductTags(input: SellerSetProductTagsInput!): SellerProduct!

  """상품 옵션 그룹을 생성한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerCreateOptionGroup(input: SellerCreateOptionGroupInput!): SellerOptionGroup!
  """상품 옵션 그룹을 수정한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerUpdateOptionGroup(input: SellerUpdateOptionGroupInput!): SellerOptionGroup!
  """상품 옵션 그룹을 삭제한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerDeleteOptionGroup(optionGroupId: ID!): Boolean!
  """상품 옵션 그룹 순서를 변경한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerReorderOptionGroups(input: SellerReorderOptionGroupsInput!): [SellerOptionGroup!]!

  """상품 옵션 아이템을 생성한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerCreateOptionItem(input: SellerCreateOptionItemInput!): SellerOptionItem!
  """상품 옵션 아이템을 수정한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerUpdateOptionItem(input: SellerUpdateOptionItemInput!): SellerOptionItem!
  """상품 옵션 아이템을 삭제한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerDeleteOptionItem(optionItemId: ID!): Boolean!
  """상품 옵션 아이템 순서를 변경한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerReorderOptionItems(input: SellerReorderOptionItemsInput!): [SellerOptionItem!]!

  """상품 커스텀 템플릿을 등록 또는 수정한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerUpsertProductCustomTemplate(input: SellerUpsertProductCustomTemplateInput!): SellerCustomTemplate!
  """상품 커스텀 템플릿 활성 상태를 변경한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerSetProductCustomTemplateActive(input: SellerSetProductCustomTemplateActiveInput!): SellerCustomTemplate!
  """커스텀 텍스트 토큰을 등록 또는 수정한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerUpsertProductCustomTextToken(input: SellerUpsertProductCustomTextTokenInput!): SellerCustomTextToken!
  """커스텀 텍스트 토큰을 삭제한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerDeleteProductCustomTextToken(tokenId: ID!): Boolean!
  """커스텀 텍스트 토큰 순서를 변경한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND."""
  sellerReorderProductCustomTextTokens(input: SellerReorderProductCustomTextTokensInput!): [SellerCustomTextToken!]!
}

"""상품에 연결된 카테고리."""
type SellerCategory {
  id: ID!
  """카테고리명."""
  name: String!
}

"""상품에 연결된 태그."""
type SellerTag {
  id: ID!
  """태그명."""
  name: String!
}

"""상품 이미지 1장."""
type SellerProductImage {
  id: ID!
  """이미지 URL."""
  imageUrl: String!
  """노출 순서. 오름차순이고 가장 앞이 대표 이미지다."""
  sortOrder: Int!
}

"""옵션 그룹에 속한 선택지 1개."""
type SellerOptionItem {
  id: ID!
  optionGroupId: ID!
  """선택지 이름."""
  title: String!
  """선택지 설명. 미등록 시 null."""
  description: String
  """선택지 이미지 URL. 미등록 시 null."""
  imageUrl: String
  """이 선택지를 고를 때 더해지는 금액(원). 음수면 할인으로 동작하되 주문 합계가 0원 미만이면 거절된다."""
  priceDelta: Int!
  """그룹 안에서의 노출 순서. 오름차순."""
  sortOrder: Int!
  """노출 여부. false면 구매자가 고를 수 없다."""
  isActive: Boolean!
}

"""
상품 옵션 그룹. 구매자는 이 그룹 단위로 선택지를 고르고, 주문 생성 시 서버가
필수·최소·최대 선택 규칙을 재검증한다. 필수 그룹에 활성 선택지가 없으면 주문할 수 없다.
"""
type SellerOptionGroup {
  id: ID!
  productId: ID!
  """그룹명(상품 상세의 옵션 섹션 제목)."""
  name: String!
  """그룹 안내 문구(상품 상세 옵션 섹션 인트로)."""
  description: String
  """필수 선택 여부. true면 선택 개수가 minSelect~maxSelect 범위 안이어야 하고, false면 0개 선택도 허용된다."""
  isRequired: Boolean!
  """최소 선택 개수."""
  minSelect: Int!
  """최대 선택 개수. minSelect와 함께 허용 개수를 정한다(둘 다 1이면 단일 선택)."""
  maxSelect: Int!
  """
  선택지에 구매자 커스텀 입력(설명)이 필요한 그룹인지.
  현재는 커스텀 체크아웃이 확장되기 전이라, 이 값이 true인 그룹의 옵션을 고르면
  주문이 거절된다(잠정 가드). 켜기 전에 주문 가능 여부를 확인해야 한다.
  """
  optionRequiresDescription: Boolean!
  """
  선택지에 구매자 커스텀 입력(이미지)이 필요한 그룹인지.
  optionRequiresDescription과 마찬가지로 현재는 true인 그룹의 옵션 선택이 거절된다.
  """
  optionRequiresImage: Boolean!
  """상품 안에서의 그룹 노출 순서. 오름차순."""
  sortOrder: Int!
  """노출 여부. false면 구매자에게 그룹 자체가 보이지 않는다."""
  isActive: Boolean!
  """이 그룹의 선택지. sortOrder 오름차순."""
  optionItems: [SellerOptionItem!]!
}

"""커스텀 케이크 문구 슬롯 1개. 구매자가 이 자리에 문구를 입력한다."""
type SellerCustomTextToken {
  id: ID!
  templateId: ID!
  """슬롯 식별 키. 주문 시 스냅샷으로 남아 어느 자리 문구인지 구분한다."""
  tokenKey: String!
  """구매자가 입력하지 않았을 때 쓸 기본 문구."""
  defaultText: String!
  """입력 가능한 최대 글자 수."""
  maxLength: Int!
  """입력 화면에서의 노출 순서. 오름차순."""
  sortOrder: Int!
  """필수 입력 여부."""
  isRequired: Boolean!
  """
  베이스 이미지 위에서 문구가 놓일 가로 위치. 미지정 시 null이고 배치는 클라이언트가 정한다.
  """
  posX: Int
  """베이스 이미지 위에서 문구가 놓일 세로 위치. 미지정 시 null."""
  posY: Int
  """문구 영역 너비. 미지정 시 null."""
  width: Int
  """문구 영역 높이. 미지정 시 null."""
  height: Int
}

"""
상품 커스텀 템플릿. 베이스 이미지 위에 문구 슬롯을 올려 구매자가 문구를 넣게 한다.
상품당 1개다.
"""
type SellerCustomTemplate {
  id: ID!
  productId: ID!
  """문구를 올릴 바탕 이미지 URL."""
  baseImageUrl: String!
  """활성 여부. false면 구매자 화면에 커스텀 입력이 열리지 않는다."""
  isActive: Boolean!
  """문구 슬롯. sortOrder 오름차순."""
  textTokens: [SellerCustomTextToken!]!
}

"""내 매장 상품. 목록·상세 모두 이 타입으로 내려온다."""
type SellerProduct {
  id: ID!
  storeId: ID!
  """상품명."""
  name: String!
  """상품 설명."""
  description: String
  """구매 전 안내 문구(주의사항 등)."""
  purchaseNotice: String
  """정가(원)."""
  regularPrice: Int!
  """할인가(원). null이면 할인이 없고 정가가 표시가다."""
  salePrice: Int
  """통화 코드(ISO 4217, 대문자 3자). KRW만 주문 가능하다."""
  currency: String!
  """커스텀 도안의 바탕 이미지 URL. 커스텀을 쓰지 않으면 null."""
  baseDesignImageUrl: String
  """제작 소요 시간(분). 픽업 가능 시각 계산의 리드타임에 반영된다."""
  preparationTimeMinutes: Int!
  """노출 여부. false면 구매자 화면에 나오지 않는다."""
  isActive: Boolean!
  """상품 이미지. sortOrder 오름차순이고 첫 장이 대표 이미지다."""
  images: [SellerProductImage!]!
  """연결된 카테고리. 없으면 빈 배열."""
  categories: [SellerCategory!]!
  """연결된 태그. 없으면 빈 배열."""
  tags: [SellerTag!]!
  """옵션 그룹. sortOrder 오름차순이며 비활성 그룹도 포함된다."""
  optionGroups: [SellerOptionGroup!]!
  """커스텀 템플릿. 등록하지 않았으면 null."""
  customTemplate: SellerCustomTemplate
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""상품 목록 페이지. 최신 등록이 먼저 온다."""
type SellerProductConnection {
  """상품. 최신 등록이 먼저 온다."""
  items: [SellerProduct!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: ID
}

"""상품 목록 조회 조건. 필터는 AND로 결합되고 미지정 필터는 적용되지 않는다."""
input SellerProductListInput {
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: ID
  """노출 여부 필터. 생략하면 서버가 활성 상품만 반환한다(SDL 기본값이 아니라 서비스 기본 동작)."""
  isActive: Boolean
  """카테고리 필터. 해당 카테고리가 연결된 상품만."""
  categoryId: ID
  """상품명 또는 연결된 태그명 부분일치 검색. 둘 중 하나만 맞아도 포함된다."""
  search: String
}

"""
상품 생성 입력. 이미지·옵션·카테고리는 생성 후 각 전용 mutation으로 붙인다
(대표 이미지 1장만 여기서 함께 등록한다).
"""
input SellerCreateProductInput {
  """상품명."""
  name: String!
  """대표 이미지 URL. 상품 생성과 함께 첫 이미지로 등록된다."""
  initialImageUrl: String!
  """상품 설명."""
  description: String
  """구매 전 안내 문구."""
  purchaseNotice: String
  """정가(원)."""
  regularPrice: Int!
  """할인가(원). 생략하면 할인 없음."""
  salePrice: Int
  """통화 코드(ISO 4217, 대문자 3자). 기본 KRW. 다른 코드도 저장은 되지만 구매자 주문이 거절된다."""
  currency: String = "KRW"
  """커스텀 도안의 바탕 이미지 URL."""
  baseDesignImageUrl: String
  """제작 소요 시간(분). 기본 180."""
  preparationTimeMinutes: Int = 180
  """노출 여부. 기본 true."""
  isActive: Boolean = true
}

"""상품 수정 입력. 전달한 필드만 변경된다(부분 수정). 노출 여부는 별도 mutation을 쓴다."""
input SellerUpdateProductInput {
  productId: ID!
  """상품명."""
  name: String
  """상품 설명."""
  description: String
  """구매 전 안내 문구."""
  purchaseNotice: String
  """정가(원)."""
  regularPrice: Int
  """할인가(원)."""
  salePrice: Int
  """통화 코드(ISO 4217, 대문자 3자). KRW 외에는 구매자 주문이 거절된다."""
  currency: String
  """커스텀 도안의 바탕 이미지 URL."""
  baseDesignImageUrl: String
  """제작 소요 시간(분)."""
  preparationTimeMinutes: Int
}

"""상품 노출 여부 변경 입력."""
input SellerSetProductActiveInput {
  productId: ID!
  """true면 구매자 화면에 노출한다."""
  isActive: Boolean!
}

"""상품 이미지 추가 입력."""
input SellerAddProductImageInput {
  productId: ID!
  """추가할 이미지 URL."""
  imageUrl: String!
  """노출 순서. 미지정 시 맨 뒤에 붙는다."""
  sortOrder: Int
}

"""
상품 이미지 순서 변경 입력. 배열 순서가 곧 새 노출 순서다.
현재 이미지 전부를 빠짐없이 담아야 하며, 개수가 다르거나 남의 이미지 ID가 섞이면 BAD_USER_INPUT.
"""
input SellerReorderProductImagesInput {
  productId: ID!
  """새 순서대로 나열한 이미지 ID 전체."""
  imageIds: [ID!]!
}

"""
상품 카테고리 연결 설정 입력. 전달한 목록으로 통째로 교체한다
(빈 배열이면 연결을 모두 끊는다).
"""
input SellerSetProductCategoriesInput {
  productId: ID!
  """연결할 카테고리 ID 전체."""
  categoryIds: [ID!]!
}

