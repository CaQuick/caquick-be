extend type Query {
  """
  상품 공개 리뷰 목록(커서). 사진 필터·정렬 지원. 비로그인 접근 가능.
  """
  productReviews(input: ProductReviewsInput!): ProductReviewConnection!

  """
  매장 공개 리뷰 목록(최신순, 커서 기반). 비로그인 접근 가능.
  """
  storeReviews(input: StoreReviewsInput!): StoreReviewConnection!
}

"""
상품 리뷰 목록 조회 조건.
"""
input ProductReviewsInput {
  productId: ID!
  """
  true면 사진(미디어) 있는 리뷰만(사진후기 그리드/사진후기 상세).
  """
  photoOnly: Boolean = false
  """
  정렬 기준. 기본 최신순. 정렬을 바꾸면 기존 cursor는 무효다.
  """
  sort: ReviewSort = LATEST
  """
  이전 페이지의 nextCursor 값(불투명 토큰). 동일 sort에서만 유효.
  """
  cursor: String
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
}

"""
매장 리뷰 목록 조회 조건.
"""
input StoreReviewsInput {
  storeId: ID!
  """
  true면 사진(미디어) 있는 리뷰만(사진후기 그리드).
  """
  photoOnly: Boolean = false
  """
  정렬 기준. 기본 최신순. 정렬을 바꾸면 기존 cursor는 무효다.
  """
  sort: ReviewSort = LATEST
  """
  이전 페이지의 nextCursor 값(불투명 토큰). 동일 sort에서만 유효.
  """
  cursor: String
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
}

"""
상품 리뷰 목록(커서 기반).
"""
type ProductReviewConnection {
  """
  리뷰. 요청한 sort 순서로 온다.
  """
  items: [ProductReview!]!
  """
  전체 리뷰 수(후기 탭 카운트). 0이면 빈 상태.
  """
  totalCount: Int!
  """
  사진 리뷰 수(사진후기 카운트).
  """
  photoTotalCount: Int!
  """
  다음 페이지 존재 여부.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다. 정렬을 바꾸면 기존 커서는 무효다.
  """
  nextCursor: String
}

"""
상품 공개 리뷰.
"""
type ProductReview {
  id: ID!
  """
  평점(0.0~5.0).
  """
  rating: Float!
  """
  리뷰 본문. 없으면 null.
  """
  content: String
  """
  첨부 미디어. 없으면 빈 배열.
  """
  media: [ReviewMedia!]!
  """
  좋아요 수.
  """
  likeCount: Int!
  """
  로그인 사용자의 좋아요 여부(비로그인 시 false).
  """
  isLiked: Boolean!
  """
  댓글 수.
  """
  commentCount: Int!
  """
  작성자 닉네임(탈퇴 시 null).
  """
  authorNickname: String
  """
  작성자 프로필 이미지(탈퇴/미설정 시 null).
  """
  authorProfileImageUrl: String
  """
  주문 시 선택 옵션 스냅샷(커스텀 정보: 모양/크기/맛 등).
  """
  customOptions: [ReviewCustomOption!]!
  """
  작성 시각. 최신순 정렬 기준이다.
  """
  createdAt: DateTime!
}

"""
리뷰의 주문 옵션 스냅샷(커스텀 정보 행).
"""
type ReviewCustomOption {
  """
  옵션 그룹명 스냅샷(예: 모양/크기/맛).
  """
  groupName: String!
  """
  선택 옵션명 스냅샷(예: (기본) 동그라미).
  """
  optionTitle: String!
}

"""
매장 리뷰 목록(커서 기반).
"""
type StoreReviewConnection {
  """
  리뷰. 요청한 sort 순서로 온다.
  """
  items: [StoreReview!]!
  """
  전체 리뷰 수(후기 탭 카운트). 0이면 빈 상태.
  """
  totalCount: Int!
  """
  사진 리뷰 수(사진후기 카운트).
  """
  photoTotalCount: Int!
  """
  다음 페이지 존재 여부.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다. 정렬을 바꾸면 기존 커서는 무효다.
  """
  nextCursor: String
}

"""
매장 공개 리뷰.
"""
type StoreReview {
  id: ID!
  """
  평점(0.0~5.0).
  """
  rating: Float!
  """
  리뷰 본문. 없으면 null.
  """
  content: String
  """
  첨부 미디어. 없으면 빈 배열.
  """
  media: [ReviewMedia!]!
  """
  좋아요 수.
  """
  likeCount: Int!
  """
  로그인 사용자의 좋아요 여부(비로그인 시 false).
  """
  isLiked: Boolean!
  """
  작성자 닉네임.
  """
  authorNickname: String
  """
  연결 상품명(주문 시점 스냅샷).
  """
  productName: String!
  """
  작성 시각. 최신순 정렬 기준이다.
  """
  createdAt: DateTime!
}
