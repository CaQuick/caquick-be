"""
감사 로그가 가리키는 대상 종류. 판매자 화면(sellerAuditLogs)은 STORE·PRODUCT·ORDER·CONVERSATION·CHANGE_PASSWORD만 노출하고 필터 입력도 그 범위만 받는다.
"""
enum AuditTargetType {
  """
  매장 설정·콘텐츠.
  """
  STORE
  """
  상품과 그 하위.
  """
  PRODUCT
  """
  주문 상태 변경.
  """
  ORDER
  """
  구매자 문의 대화.
  """
  CONVERSATION
  """
  비밀번호 변경. targetId는 바꾼 계정 ID.
  """
  CHANGE_PASSWORD
  """
  계정(관리자·판매자 생성, 정지/복구, 비밀번호 초기화).
  """
  ACCOUNT
  """
  플랫폼 배너.
  """
  BANNER
  """
  카테고리 마스터.
  """
  CATEGORY
  """
  태그 마스터.
  """
  TAG
  """
  지역 마스터.
  """
  REGION
  """
  리뷰 강제 삭제.
  """
  REVIEW
  """
  리뷰 댓글 강제 삭제.
  """
  REVIEW_COMMENT
  """
  신고 처리.
  """
  REVIEW_REPORT
  """
  관리자 알림 발송.
  """
  NOTIFICATION
}

"""
감사 로그에 기록된 행위 종류.
"""
enum AuditActionType {
  """
  생성.
  """
  CREATE
  """
  수정.
  """
  UPDATE
  """
  삭제(soft-delete 포함).
  """
  DELETE
  """
  상태 전이.
  """
  STATUS_CHANGE
}
