"""
알림 분류. 알림센터 목록의 그룹 기준이다.
"""
enum NotificationType {
  """
  주문 상태 변경 알림. 주문(ORDER_*)·환불(REFUND_*) 이벤트가 여기 속한다.
  """
  ORDER_STATUS
  """
  내 리뷰에 좋아요가 달린 알림. REVIEW_LIKED 이벤트가 여기 속한다.
  """
  REVIEW_LIKE
  """
  운영 공지. 현재 생성 경로가 없는 예약된 분류다.
  """
  SYSTEM
  """
  마케팅 알림. 현재 생성 경로가 없는 예약된 분류다.
  """
  MARKETING
}

"""
알림 이벤트. 알림센터의 아이콘·라벨 매핑 기준 (figma notification-center)
"""
enum NotificationEvent {
  """
  다른 사용자가 내 리뷰에 좋아요를 눌렀다. type은 REVIEW_LIKE.
  """
  REVIEW_LIKED
  """
  판매자가 주문을 확인·수락했다. type은 ORDER_STATUS.
  """
  ORDER_CONFIRMED
  """
  판매자가 제작을 완료했다. type은 ORDER_STATUS.
  """
  ORDER_MADE
  """
  픽업이 완료됐다. type은 ORDER_STATUS.
  """
  ORDER_PICKED_UP
  """
  주문이 취소됐다(판매자·운영자·자동 미확정). 본문 끝에 사유 라벨이 붙고, 구매자 본인 취소는 알림이 없다. type은 ORDER_STATUS.
  """
  ORDER_CANCELED
  """
  입금이 확인돼 주문이 접수됐다. type은 ORDER_STATUS.
  """
  ORDER_PAYMENT_CONFIRMED
  """
  입금이 확인되지 않아 주문이 취소됐다(입금 기한 만료 자동 취소 또는 운영자 미입금 취소). type은 ORDER_STATUS.
  """
  ORDER_PAYMENT_EXPIRED
  """
  픽업 시간에 방문하지 않아 노쇼로 처리됐다. type은 ORDER_STATUS.
  """
  ORDER_NO_SHOW
  """
  판매자가 픽업 일시를 바꿨다. type은 ORDER_STATUS.
  """
  ORDER_PICKUP_RESCHEDULED
  """
  돌려받을 돈이 생겨 환불 계좌 입력이 필요하다. type은 ORDER_STATUS.
  """
  REFUND_ACCOUNT_REQUESTED
  """
  환불 송금이 끝났다. type은 ORDER_STATUS.
  """
  REFUND_COMPLETED
}
