extend type Mutation {
  """
  운영 공지(SYSTEM)·마케팅(MARKETING) 알림을 보낸다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  targetKind가 ALL_USERS면 활성 USER 전체에 1,000건 단위로 나눠 저장한다 — 청크 사이에 실패하면 그때까지
  저장된 건수를 sentCount로 돌려주며, 재실행은 중복 발송이 된다(멱등 키 없음).
  ACCOUNT_IDS면 accountIds(최대 500)를 대상으로 하고, 활성 USER가 아닌 ID는 skippedAccountIds로 돌려준다.
  """
  adminSendNotification(
    input: AdminSendNotificationInput!
  ): AdminSendNotificationResult!
}

"""
관리자가 보낼 수 있는 알림 분류. 주문·리뷰 이벤트 알림은 시스템이 만든다.
"""
enum AdminNotificationType {
  """
  운영 공지.
  """
  SYSTEM
  """
  마케팅.
  """
  MARKETING
}

"""
발송 대상 지정 방식.
"""
enum AdminNotificationTargetKind {
  """
  활성(ACTIVE·미탈퇴) USER 전체.
  """
  ALL_USERS
  """
  accountIds로 지정한 계정.
  """
  ACCOUNT_IDS
}

"""
알림 발송 입력.
"""
input AdminSendNotificationInput {
  """
  알림 분류.
  """
  type: AdminNotificationType!
  """
  제목. 1~200자.
  """
  title: String!
  """
  본문. 1~2000자.
  """
  body: String!
  """
  대상 지정 방식.
  """
  targetKind: AdminNotificationTargetKind!
  """
  targetKind가 ACCOUNT_IDS일 때 대상 계정 ID. 1~500개, 중복은 한 번으로 센다. ALL_USERS면 무시된다.
  """
  accountIds: [ID!]
}

"""
알림 발송 결과.
"""
type AdminSendNotificationResult {
  """
  저장된 알림 건수.
  """
  sentCount: Int!
  """
  대상에서 빠진 계정 ID(활성 USER가 아니거나 없음). ALL_USERS면 빈 배열.
  """
  skippedAccountIds: [ID!]!
}
