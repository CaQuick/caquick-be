extend type Query {
  """월별 픽업 가능 날짜 (홈 전역 정책 기준). yearMonth: "YYYY-MM" """
  pickupCalendar(
    """대상 연월. "YYYY-MM" 형식(KST 기준). 예: "2026-09". 형식이 어긋나면 BAD_REQUEST."""
    yearMonth: String!
  ): PickupCalendar!
  """선택 날짜의 픽업 시간 슬롯. date: "YYYY-MM-DD" """
  pickupTimeSlots(
    """대상 날짜. "YYYY-MM-DD" 형식(KST 기준). 예: "2026-09-10". 형식이 어긋나면 BAD_REQUEST."""
    date: String!
  ): PickupTimeSlots!
}

"""월별 픽업 달력. 요청한 연월의 모든 날짜가 담긴다."""
type PickupCalendar {
  """요청한 연월. "YYYY-MM"."""
  yearMonth: String!
  """해당 월의 전 날짜. 선택 불가한 날도 사유와 함께 포함된다."""
  days: [PickupDay!]!
}

"""달력의 하루."""
type PickupDay {
  """날짜. "YYYY-MM-DD" (KST)."""
  date: String!
  """픽업 예약 가능 여부."""
  selectable: Boolean!
  """선택 불가 사유. PAST | OUT_OF_RANGE (선택 가능 시 null)."""
  reason: String
}

"""선택 날짜의 픽업 시간 슬롯. 오전·오후로 나눠 내려준다."""
type PickupTimeSlots {
  """요청한 날짜. "YYYY-MM-DD" (KST)."""
  date: String!
  """12:00 이전 슬롯."""
  morning: [PickupSlot!]!
  """12:00 이후 슬롯."""
  afternoon: [PickupSlot!]!
}

"""픽업 시간 슬롯 1칸. 영업시간 10:00~20:00을 30분 간격으로 나눈 것이라 마지막은 19:30이다."""
type PickupSlot {
  """슬롯 시각. "HH:mm" (KST)."""
  time: String!
  """예약 가능 여부. 리드타임을 지났거나 예약 범위를 벗어나면 false."""
  available: Boolean!
}
