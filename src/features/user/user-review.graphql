extend type Query {
  """내가 작성한 리뷰 목록. 로그인 필수. 본인 데이터만 대상이 된다."""
  myReviews(input: MyReviewsInput): MyReviewConnection!
  """리뷰 작성 가능한 주문 아이템 목록(마이페이지 '리뷰 남기기' 탭). 픽업 완료 + 활성 리뷰 미존재. 로그인 필수. 본인 데이터만 대상이 된다."""
  myReviewableOrderItems(input: MyReviewableOrderItemsInput): MyReviewableOrderItemConnection!
  """주문 아이템에 대한 리뷰 작성 가능 여부 및 기존 리뷰. 로그인 필수. 본인 데이터만 대상이 된다."""
  myReviewForOrderItem(orderItemId: ID!): MyReviewOrNull!
}

"""리뷰 작성 가능 목록 조회 조건. 커서가 아니라 오프셋 방식이다."""
input MyReviewableOrderItemsInput {
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """한 번에 가져올 개수. 기본 20, 1~50만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
}

"""리뷰 작성 가능한 주문 품목 목록. 픽업 완료가 최근인 순으로 온다."""
type MyReviewableOrderItemConnection {
  """리뷰 작성 가능한 주문 품목. 픽업 완료가 최근인 순으로 온다."""
  items: [MyReviewableOrderItem!]!
  """'리뷰 남기기 N' 탭 카운트"""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
}

"""리뷰 작성 가능한 주문 아이템 카드. writeReview 입력에 orderItemId를 그대로 사용한다."""
type MyReviewableOrderItem {
  orderItemId: ID!
  productId: ID!
  """케이크명(주문 시점 스냅샷)"""
  productName: String!
  """대표 상품 이미지. 없으면 null."""
  productImageUrl: String
  """매장명."""
  storeName: String!
  """매장 위치 표기(예: 인천 청라동). 없으면 null."""
  regionLabel: String
  """픽업 완료 시각(최신 픽업 순 정렬 기준)."""
  pickedUpAt: DateTime
}

extend type Mutation {
  """리뷰 미디어 업로드용 Presigned URL 발급. 로그인 필수."""
  createReviewMediaUploadUrl(input: CreateReviewMediaUploadUrlInput!): ReviewMediaUploadUrl!
  """리뷰 작성. 로그인 필수."""
  writeReview(input: WriteReviewInput!): MyReview!
  """내 리뷰 삭제(soft). 로그인 필수. 본인 데이터만 대상이 된다."""
  deleteMyReview(reviewId: ID!): Boolean!
}

"""내 리뷰 목록 조회 조건. 커서가 아니라 오프셋 방식이다."""
input MyReviewsInput {
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """한 번에 가져올 개수. 기본 20, 1~50만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
}

"""내가 쓴 리뷰 목록. 최신순."""
type MyReviewConnection {
  """내가 쓴 리뷰. 최신순으로 온다."""
  items: [MyReview!]!
  """전체 리뷰 수. offset·limit과 무관한 총계다."""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
}

"""내가 쓴 리뷰 1건."""
type MyReview {
  reviewId: ID!
  """이 리뷰가 달린 주문 품목 ID."""
  orderItemId: ID!
  productId: ID!
  """상품명(주문 시점 스냅샷)."""
  productName: String!
  """대표 상품 이미지. 없으면 null."""
  productImageUrl: String
  """매장명."""
  storeName: String!
  """별점. 1.0~5.0, 0.5 단위."""
  rating: Float!
  """리뷰 본문. 삭제된 리뷰 등으로 본문이 없으면 null."""
  content: String
  """첨부 미디어. 없으면 빈 배열."""
  media: [MyReviewMedia!]!
  """작성 시각."""
  createdAt: DateTime!
}

"""특정 주문 품목에 대한 내 리뷰 조회 결과. 아직 안 썼으면 review가 null이다."""
type MyReviewOrNull {
  """작성한 리뷰. 없으면 null."""
  review: MyReview
  """지금 리뷰를 쓸 수 있는지."""
  canWrite: Boolean!
  """쓸 수 없는 사유 문구. canWrite가 true면 null이다(예: 이미 작성함, 픽업 미완료)."""
  reasonIfCannotWrite: String
}

"""리뷰에 첨부된 미디어 1건."""
type MyReviewMedia {
  """미디어 종류."""
  mediaType: ReviewMediaType!
  """미디어 원본 URL."""
  mediaUrl: String!
  """동영상 대표 프레임 URL. 이미지면 null일 수 있다."""
  thumbnailUrl: String
  """노출 순서. 오름차순."""
  sortOrder: Int!
}

"""리뷰 첨부 미디어 종류."""
enum ReviewMediaType {
  """이미지."""
  IMAGE
  """동영상. thumbnailUrl이 있으면 대표 프레임으로 쓰지만 필수가 아니라 없을 수 있다."""
  VIDEO
}

"""리뷰 미디어 업로드용 Presigned URL 발급 입력."""
input CreateReviewMediaUploadUrlInput {
  """업로드할 미디어 종류."""
  mediaType: ReviewMediaType!
  """업로드할 파일의 MIME 타입(예: image/jpeg)."""
  contentType: String!
  """업로드할 파일 크기(바이트)."""
  contentLength: Int!
}

"""발급된 업로드 URL. uploadUrl로 직접 PUT한 뒤 publicUrl을 writeReview에 넘긴다."""
type ReviewMediaUploadUrl {
  """파일을 PUT할 Presigned URL. 만료 전에 써야 한다."""
  uploadUrl: String!
  """업로드 완료 후 접근 가능한 URL. writeReview의 mediaUrl로 그대로 넘긴다."""
  publicUrl: String!
  """스토리지 객체 키."""
  key: String!
  """uploadUrl 만료까지 남은 시간(초)."""
  expiresInSeconds: Int!
}

"""
리뷰 작성 입력. 픽업 완료(PICKED_UP)된 주문 품목에만 쓸 수 있고, 품목당 1건이다.
미디어는 이미지 최대 10장과 영상 1개를 각각 셈하며, 둘을 섞어 최대 11개까지 넣을 수 있다.
"""
input WriteReviewInput {
  """리뷰 대상 주문 품목 ID. myReviewableOrderItems가 준 값을 그대로 쓴다."""
  orderItemId: ID!
  """별점 1.0 ~ 5.0 (0.5 단위)"""
  rating: Float!
  """최소 20자, 최대 1000자"""
  content: String!
  """첨부 미디어. 생략하면 텍스트만 등록된다."""
  media: [WriteReviewMediaInput!]
}

"""
리뷰 첨부 미디어 입력. createReviewMediaUploadUrl로 먼저 업로드한 뒤 그 결과를 넘긴다.
"""
input WriteReviewMediaInput {
  """미디어 종류."""
  mediaType: ReviewMediaType!
  """업로드 완료 후의 publicUrl"""
  mediaUrl: String!
  """동영상 대표 프레임 URL."""
  thumbnailUrl: String
  """노출 순서. 서버는 이 값을 쓰지 않고 배열에 담긴 순서를 그대로 저장한다."""
  sortOrder: Int!
}
