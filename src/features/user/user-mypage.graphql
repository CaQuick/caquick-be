extend type Query {
  """마이페이지 메인 화면 집계 데이터. 로그인 필수. 본인 데이터만 대상이 된다."""
  myPageOverview: MyPageOverview!
}

"""마이페이지 메인 집계"""
type MyPageOverview {
  """상단 카운트 카드"""
  counts: MyPageCounts!
  """진행중인 주문 요약 (최근 3개월, 최대 5건)"""
  ongoingOrders: [OngoingOrderSummary!]!
  """최근 본 상품 (최대 20건)"""
  recentViewedProducts: [RecentViewedProductSummary!]!
}

"""마이페이지 상단 카운트 카드."""
type MyPageCounts {
  """진행중 + 저장된 커스텀 드래프트 수"""
  customDraftCount: Int!
  """쿠폰함 보유 쿠폰 수 (MVP: 항상 0)"""
  couponCount: Int!
  """상품 찜 수"""
  wishlistCount: Int!
  """내가 작성한 리뷰 수"""
  myReviewCount: Int!
}

"""진행중 주문 요약 카드. 픽업 완료·취소는 제외된다."""
type OngoingOrderSummary {
  orderId: ID!
  """주문번호."""
  orderNumber: String!
  """현재 주문 상태."""
  status: OrderStatusType!
  """주문 생성 시각."""
  createdAt: DateTime!
  """픽업 예정 일시."""
  pickupAt: DateTime!
  """첫 번째 OrderItem 기준 대표 상품명"""
  representativeProductName: String!
  """첫 번째 OrderItem 기준 대표 이미지 URL"""
  representativeProductImageUrl: String
  """총 가격"""
  totalPrice: Int!
}

"""최근 본 상품 카드."""
type RecentViewedProductSummary {
  productId: ID!
  """상품명."""
  productName: String!
  """대표 상품 이미지. 없으면 null."""
  representativeImageUrl: String
  """할인가(원). 할인이 없으면 null."""
  salePrice: Int
  """정가(원)."""
  regularPrice: Int!
  """매장명."""
  storeName: String!
  """마지막으로 본 시각. 목록 정렬 기준이다."""
  viewedAt: DateTime!
  """현재 사용자의 찜 여부"""
  isWishlisted: Boolean!
}
