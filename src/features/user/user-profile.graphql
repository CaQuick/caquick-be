extend type Query {
  """현재 로그인한 유저 정보 조회"""
  me: MePayload!
  """닉네임 중복 확인. 로그인 필수."""
  checkNicknameAvailability(
    """
    검사할 닉네임. 앞뒤 공백을 제거한 뒤 2~20자, 한글·영문·숫자·언더스코어만 허용한다.
    규칙 위반은 예외가 아니라 available=false와 reason으로 돌려준다.
    """
    nickname: String!
  ): NicknameAvailability!
}

extend type Mutation {
  """온보딩 완료 처리(필수 정보 입력). 로그인 필수. 본인 데이터만 대상이 된다."""
  completeOnboarding(input: CompleteOnboardingInput!): MePayload!
  """프로필 정보 수정. 로그인 필수. 본인 데이터만 대상이 된다."""
  updateMyProfile(input: UpdateMyProfileInput!): MePayload!
  """프로필 이미지 URL 업데이트. 로그인 필수. 본인 데이터만 대상이 된다."""
  updateMyProfileImage(input: UpdateMyProfileImageInput!): MePayload!
  """회원 탈퇴(soft delete). 로그인 필수. 본인 데이터만 대상이 된다."""
  deleteMyAccount: Boolean!
  """프로필 이미지 업로드용 Presigned URL 발급. 로그인 필수. 본인 데이터만 대상이 된다."""
  createProfileImageUploadUrl(input: CreateProfileImageUploadUrlInput!): ProfileImageUploadUrl!
}

"""현재 로그인한 유저 정보"""
type MePayload {
  """계정 ID"""
  accountId: ID!
  """이메일(없을 수 있음)"""
  email: String
  """이름(없을 수 있음)"""
  name: String
  """계정 타입"""
  accountType: AccountType!
  """프로필 정보"""
  profile: UserProfile!
  """연동된 소셜 로그인 식별자 목록(soft-deleted 제외, 최근 로그인 순)"""
  linkedIdentities: [LinkedIdentity!]!
}

"""소셜 로그인 Provider 종류"""
enum IdentityProvider {
  """구글 OIDC."""
  GOOGLE
  """카카오 OIDC."""
  KAKAO
}

"""유저 계정에 연동된 소셜 로그인 식별자"""
type LinkedIdentity {
  """소셜 로그인 Provider"""
  provider: IdentityProvider!
  """해당 provider로 마지막 로그인한 시각(없을 수 있음)"""
  lastLoginAt: DateTime
}

"""유저 프로필"""
type UserProfile {
  """닉네임(유니크)"""
  nickname: String!
  """생년월일"""
  birthDate: DateTime
  """전화번호"""
  phoneNumber: String
  """프로필 이미지 URL"""
  profileImageUrl: String
  """온보딩 완료 시각"""
  onboardingCompletedAt: DateTime
}

"""온보딩 완료 입력"""
input CompleteOnboardingInput {
  """이름(계정에 없을 때만 저장)"""
  name: String
  """닉네임(필수)"""
  nickname: String!
  """생년월일"""
  birthDate: DateTime
  """전화번호"""
  phoneNumber: String
}

"""프로필 수정 입력"""
input UpdateMyProfileInput {
  """닉네임"""
  nickname: String
  """이름(전송 시 trim 후 비어있으면 reject)"""
  name: String
  """생년월일"""
  birthDate: DateTime
  """전화번호"""
  phoneNumber: String
}

"""프로필 이미지 수정 입력"""
input UpdateMyProfileImageInput {
  """프로필 이미지 URL"""
  profileImageUrl: String!
}

"""닉네임 사용 가능 여부"""
type NicknameAvailability {
  """사용 가능 여부. false면 reason에 사유가 담긴다."""
  available: Boolean!
  """미통과 시 이유"""
  reason: String
}

"""프로필 이미지 업로드 URL 발급 입력"""
input CreateProfileImageUploadUrlInput {
  """업로드할 파일의 MIME 타입(예: image/jpeg)."""
  contentType: String!
  """업로드할 파일 크기(바이트)."""
  contentLength: Int!
}

"""프로필 이미지 업로드 URL 결과"""
type ProfileImageUploadUrl {
  """파일을 PUT할 Presigned URL. 만료 전에 써야 한다."""
  uploadUrl: String!
  """업로드 완료 후 접근 가능한 URL. updateMyProfileImage에 그대로 넘긴다."""
  publicUrl: String!
  """스토리지 객체 키."""
  key: String!
  """uploadUrl 만료까지 남은 시간(초)."""
  expiresInSeconds: Int!
}
