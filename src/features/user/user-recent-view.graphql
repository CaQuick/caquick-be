extend type Query {
  """최근 본 상품 목록 조회. 로그인 필수. 본인 데이터만 대상이 된다."""
  myRecentViewedProducts(input: MyRecentViewedProductsInput): RecentViewedProductConnection!
}

extend type Mutation {
  """상품 상세 진입 시 호출하여 최근 본 상품에 기록. 로그인 필수. 본인 데이터만 대상이 된다."""
  recordProductView(productId: ID!): Boolean!
  """최근 본 상품 단건 삭제. 로그인 필수. 본인 데이터만 대상이 된다."""
  deleteRecentViewedProduct(productId: ID!): Boolean!
  """최근 본 상품 전체 삭제. 로그인 필수. 본인 데이터만 대상이 된다."""
  clearRecentViewedProducts: Boolean!
}

"""최근 본 상품 목록 조회 조건. 커서가 아니라 오프셋 방식이다."""
input MyRecentViewedProductsInput {
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """한 번에 가져올 개수. 기본 20, 1~50만 허용하며 벗어나면 BAD_REQUEST."""
  limit: Int = 20
}

"""최근 본 상품 목록. 최근에 본 상품이 먼저 온다."""
type RecentViewedProductConnection {
  """최근 본 상품 카드. 최근에 본 순으로 온다."""
  items: [RecentViewedProductSummary!]!
  """전체 기록 수. offset·limit과 무관한 총계다."""
  totalCount: Int!
  """다음 페이지 존재 여부. offset+limit이 totalCount에 못 미치면 true."""
  hasMore: Boolean!
}
