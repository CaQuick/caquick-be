extend type Query {
  """상단/하단 공통 UI용 카운트 정보 조회"""
  viewerCounts: ViewerCounts!
  """알림 목록 조회"""
  myNotifications(input: MyNotificationsInput): NotificationConnection!
}

extend type Mutation {
  """특정 알림 읽음 처리"""
  markNotificationRead(notificationId: ID!): Boolean!
  """전체 알림 읽음 처리"""
  markAllNotificationsRead: Boolean!
}

"""뷰어 카운트 정보"""
type ViewerCounts {
  """읽지 않은 알림 수"""
  unreadNotificationCount: Int!
  """장바구니 아이템 수"""
  cartItemCount: Int!
  """위시리스트 아이템 수"""
  wishlistCount: Int!
}

"""알림 목록 조회 입력"""
input MyNotificationsInput {
  """읽지 않은 알림만 조회"""
  unreadOnly: Boolean = false
  """이전 응답의 nextCursor(불투명 토큰). 미지정 시 첫 페이지"""
  cursor: String
  """조회 개수(최대 50)"""
  limit: Int = 20
}

"""알림 목록 응답. 최근 3개월 내 알림만 노출한다."""
type NotificationConnection {
  """알림 아이템 목록"""
  items: [NotificationItem!]!
  """전체 개수(3개월 내 기준)"""
  totalCount: Int!
  """다음 페이지 존재 여부"""
  hasMore: Boolean!
  """다음 페이지 커서. 없으면 null"""
  nextCursor: String
}

"""알림 아이템"""
type NotificationItem {
  """알림 ID"""
  id: ID!
  """알림 타입"""
  type: NotificationType!
  """알림 이벤트(아이콘·라벨 매핑용). 이벤트 없는 일반 알림은 null"""
  event: NotificationEvent
  """제목"""
  title: String!
  """내용"""
  body: String!
  """연관 주문 ID(딥링크용)"""
  orderId: ID
  """연관 매장 ID(딥링크용)"""
  storeId: ID
  """연관 상품 ID(딥링크용)"""
  productId: ID
  """연관 리뷰 ID(리뷰 보러가기 딥링크용)"""
  reviewId: ID
  """서브라인 조립용 매장명. 연관 매장이 없으면 null"""
  storeName: String
  """서브라인 조립용 상품명(주문 알림은 주문 시점 스냅샷). 없으면 null"""
  productName: String
  """읽음 처리 시각"""
  readAt: DateTime
  """생성 시각"""
  createdAt: DateTime!
}
