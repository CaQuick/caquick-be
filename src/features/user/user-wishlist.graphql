extend type Query {
  """내 찜 목록. 로그인 필수. 본인 데이터만 대상이 된다."""
  myWishlist(input: MyWishlistInput): MyWishlistConnection!
  """찜 상품의 매장별 그룹 목록 (찜 상품 수 desc, 동점 시 최근 찜 순). 로그인 필요."""
  myWishlistStoreGroups(input: MyWishlistStoreGroupsInput): MyWishlistStoreGroupsConnection!
}

extend type Mutation {
  """찜 추가 (멱등: 이미 있어도 true 반환, soft-delete된 항목은 복원). 로그인 필수. 본인 데이터만 대상이 된다."""
  addToWishlist(productId: ID!): Boolean!
  """찜 해제 (멱등: 이미 없어도 true 반환). 로그인 필수. 본인 데이터만 대상이 된다."""
  removeFromWishlist(productId: ID!): Boolean!
}

"""찜한 상품 목록 조회 조건. 커서가 아니라 오프셋 방식이다."""
input MyWishlistInput {
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """한 번에 가져올 개수. 기본 20, 1~50만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """특정 매장의 찜 상품만 조회(매장별 보기 → 매장 선택 화면)."""
  storeId: ID
}

"""찜한 상품 목록. 최근 찜한 순으로 온다."""
type MyWishlistConnection {
  """찜한 상품 카드. 최근 찜한 순으로 온다."""
  items: [WishlistItemSummary!]!
  """전체 찜 상품 수(storeId 필터 적용 후). offset·limit과 무관하다."""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
}

"""찜한 상품 카드."""
type WishlistItemSummary {
  productId: ID!
  """소속 매장 ID(상세 이동용)."""
  storeId: ID!
  """상품명."""
  productName: String!
  """대표 상품 이미지. 없으면 null."""
  representativeImageUrl: String
  """할인가(원). 할인이 없으면 null이고 regularPrice가 표시가로 쓰인다."""
  salePrice: Int
  """정가(원)."""
  regularPrice: Int!
  """할인율(0~100). salePrice 없으면 0."""
  discountRate: Int!
  """매장명."""
  storeName: String!
  """매장 위치 표기(예: 서울 대치동)."""
  regionLabel: String
  """상품 평균 평점(0.0~5.0, 소수 첫째 자리). 리뷰 없으면 0.0."""
  ratingAverage: Float!
  """리뷰 수."""
  reviewCount: Int!
  """찜한 시각. 목록 정렬 기준이다."""
  addedAt: DateTime!
}

"""매장별 보기 목록 조회 조건."""
input MyWishlistStoreGroupsInput {
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """한 번에 가져올 개수. 기본 20, 1~50만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
}

"""매장별 보기 목록."""
type MyWishlistStoreGroupsConnection {
  """매장별 보기 행. 찜한 상품 수 내림차순이고, 같으면 최근에 찜한 매장이 먼저 온다."""
  items: [WishlistStoreGroup!]!
  """찜 상품을 가진 매장 수."""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
}

"""매장별 보기 행(매장 + 찜 상품 수)"""
type WishlistStoreGroup {
  storeId: ID!
  """매장명."""
  storeName: String!
  """매장 프로필(로고) 이미지. 미등록 시 null."""
  profileImageUrl: String
  """이 매장에서 찜한 상품 수."""
  wishlistedProductCount: Int!
}
