extend type Query {
  """
  주문 목록을 최신순으로 조회한다(전 매장). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminOrders(input: AdminOrderListInput): AdminOrderConnection!
  """
  주문 상세를 전체 품목·구매자 요약·상태 이력과 함께 조회한다. 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminOrder(orderId: ID!): AdminOrderDetail!
  """
  매장의 진행 중 주문(입금 대기·접수·확정·제작 완료) 건수를 상태별로 센다. 판매자 정지·매장 숨김 전 경고용이며
  없는 매장이면 0건이다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminStoreInProgressOrderSummary(
    storeId: ID!
  ): AdminStoreInProgressOrderSummary!
}

extend type Mutation {
  """
  주문을 강제 취소한다. 입금 대기·접수·확정·제작 완료 주문만 되고(그 밖은 ORDER_NOT_CANCELLABLE), 규칙은 adminOrder의
  cancelOptions가 그대로 알려 준다. 입금 대기는 환불 없이(미입금이면 reason PAYMENT_NOT_RECEIVED), 접수는 결제액 전액,
  확정·제작 완료는 fault(사정)에 따라 환불한다(판매자 사정 = 전액, 구매자 사정 = refundAmount, 남는 금액은 수수료를 뺀 뒤 정산에 포함).
  고를 수 없는 사유면 CANCEL_REASON_NOT_ALLOWED, 사정이 없으면 CANCEL_FAULT_REQUIRED, 구매자 사정인데 금액이 없으면
  REFUND_AMOUNT_REQUIRED, 금액이 0~결제액 밖이면 REFUND_AMOUNT_OUT_OF_RANGE(모두 BAD_USER_INPUT).
  구매자에게 취소 알림(미입금이면 입금 기한 만료 알림)이, 입금 확인 뒤 주문이면 판매자에게 취소 푸시가 간다.
  없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminCancelOrder(input: AdminCancelOrderInput!): AdminOrderSummary!
}

"""
주문 요약(관리자 시점). 매장 ID·매장명은 첫 품목 기준이다(주문은 단일 매장 구조).
"""
type AdminOrderSummary {
  id: ID!
  """
  주문번호.
  """
  orderNumber: String!
  """
  구매자 계정 ID.
  """
  accountId: ID!
  """
  주문 품목이 속한 매장 ID. 품목이 없으면 null.
  """
  storeId: ID
  """
  주문 시점의 매장명(첫 품목 스냅샷). 품목이 없으면 null.
  """
  storeName: String
  """
  현재 주문 상태.
  """
  status: OrderStatusType!
  """
  픽업 예정 일시.
  """
  pickupAt: DateTime!
  """
  주문자 이름.
  """
  buyerName: String!
  """
  주문자 연락처.
  """
  buyerPhone: String!
  """
  최종 결제 금액(원).
  """
  totalPrice: Int!
  """
  주문 생성 시각.
  """
  createdAt: DateTime!
  """
  첫 품목의 상품명(주문 시점 스냅샷). 이후 상품명이 바뀌어도 유지된다. 품목이 없으면 null.
  """
  firstItemName: String
  """
  첫 품목의 상품 대표 이미지 URL(주문 시점 스냅샷). 주문 당시 이미지가 없었거나 품목이 없으면 null.
  """
  firstItemImageUrl: String
  """
  커스텀 주문 여부(첫 품목의 커스텀 방식이 NONE이 아니면 true). 목록 '커스텀' 배지용이다.
  """
  hasCustom: Boolean!
  """
  첫 품목의 커스텀 대표 이미지 URL(3D 윗면 렌더 또는 슬롯형 합성). 없으면 null.
  """
  firstItemCustomImageUrl: String
}

"""
주문 목록 페이지. 최신 주문이 먼저 온다.
"""
type AdminOrderConnection {
  """
  주문. 최신 주문이 먼저 온다.
  """
  items: [AdminOrderSummary!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
주문한 구매자 요약.
"""
type AdminOrderBuyer {
  """
  계정 ID.
  """
  accountId: ID!
  """
  이메일. 미등록 시 null.
  """
  email: String
  """
  닉네임. 탈퇴(프로필 삭제)면 null.
  """
  nickname: String
  """
  계정 상태.
  """
  status: AccountStatus!
}

"""
주문 상세(관리자 시점). 모든 품목이 담긴다.
"""
type AdminOrderDetail {
  id: ID!
  """
  주문번호.
  """
  orderNumber: String!
  """
  구매자 요약.
  """
  buyer: AdminOrderBuyer!
  """
  현재 주문 상태.
  """
  status: OrderStatusType!
  """
  픽업 예정 일시.
  """
  pickupAt: DateTime!
  """
  주문자 이름.
  """
  buyerName: String!
  """
  주문자 연락처.
  """
  buyerPhone: String!
  """
  구매자가 남긴 요청 사항. 없으면 null.
  """
  requestNote: String
  """
  결제와 입금 확인 기록. 결제 도입 전 주문이면 null.
  """
  payment: AdminOrderPayment
  """
  할인 전 품목 합계(원).
  """
  subtotalPrice: Int!
  """
  할인 금액(원).
  """
  discountPrice: Int!
  """
  최종 결제 금액(원).
  """
  totalPrice: Int!
  """
  SUBMITTED 도달 시각.
  """
  submittedAt: DateTime
  """
  CONFIRMED 도달 시각. 미도달 시 null.
  """
  confirmedAt: DateTime
  """
  MADE 도달 시각. 미도달 시 null.
  """
  madeAt: DateTime
  """
  PICKED_UP 도달 시각. 미도달 시 null.
  """
  pickedUpAt: DateTime
  """
  CANCELED 도달 시각. 취소되지 않았으면 null.
  """
  canceledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  """
  주문 품목 전체.
  """
  items: [OrderItemDetail!]!
  """
  상태 변경 이력. 최신순.
  """
  statusHistories: [OrderStatusHistory!]!
  """
  이 주문의 환불(취소 환불·입금 반환). 오래된 순, 없으면 빈 배열.
  """
  refunds: [OrderRefund!]!
  """
  취소 정보(주체·사유·사정·환불액·환불 진행). 취소되지 않은 주문이면 null.
  """
  cancellation: OrderCancellation
  """
  강제 취소 다이얼로그의 선택지. 지금 상태 기준이다.
  """
  cancelOptions: AdminOrderCancelOptions!
  """
  판매자 확정 마감 시각. 지나면 자동 취소·전액 환불된다. 접수(SUBMITTED) 상태가 아니거나 결제 도입 전 주문이면 null.
  """
  confirmDeadlineAt: DateTime
  """
  자동 픽업 완료 예정 시각(픽업 시각 + 24시간). 확정·제작 완료 상태에서만 있고 그 밖은 null.
  매장이 숨김이면 자동으로 픽업 완료되지 않는다. 판매자가 직접 처리하지 않으면 관리자는 강제 취소만 할 수 있다.
  """
  autoPickupAt: DateTime
  """
  노쇼 처리 시각. 노쇼가 아니면 null.
  """
  noShowAt: DateTime
}

"""
관리자 강제 취소 선택지. 화면은 이 값으로 다이얼로그를 그리고 규칙을 복제하지 않는다.
"""
type AdminOrderCancelOptions {
  """
  지금 취소할 수 있는지.
  """
  cancelable: Boolean!
  """
  고를 수 있는 취소 사유. 취소할 수 없으면 빈 배열.
  """
  reasons: [OrderCancelReasonType!]!
  """
  환불 규칙. BY_FAULT면 사정을 고르게 하고, 구매자 사정이면 환불 금액(0~paidAmount)을 입력받는다. 취소할 수 없으면 null.
  """
  refundRule: CancelRefundRuleType
  """
  확인된 결제액(원). 입금 전이거나 결제 도입 전 주문이면 0.
  """
  paidAmount: Int!
}

"""
매장의 진행 중 주문 요약.
"""
type AdminStoreInProgressOrderSummary {
  storeId: ID!
  """
  진행 중 주문 전체 건수.
  """
  totalCount: Int!
  """
  상태별 건수. 0건인 상태는 빠지고 흐름 순(입금 대기 → 제작 완료)으로 온다.
  """
  byStatus: [AdminStoreInProgressStatusCount!]!
}

"""
상태 1개의 주문 건수.
"""
type AdminStoreInProgressStatusCount {
  """
  주문 상태.
  """
  status: OrderStatusType!
  """
  건수.
  """
  count: Int!
}

"""
주문 목록 조회 조건. 모든 필터는 AND로 결합된다.
"""
input AdminOrderListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다.
  """
  cursor: String
  """
  주문번호·주문자 이름·연락처 부분일치 검색. 최대 100자.
  """
  keyword: String
  """
  주문 상태 필터. 미지정 시 전체.
  """
  status: OrderStatusType
  """
  true면 진행 중 주문(입금 대기·접수·확정·제작 완료)만. 기본 false, null도 false(전체)로 본다. status와 함께 오면 AND다.
  """
  inProgress: Boolean = false
  """
  매장 ID 필터(품목 기준). 미지정 시 전체.
  """
  storeId: ID
  """
  구매자 계정 ID 필터. 미지정 시 전체.
  """
  accountId: ID
  """
  주문 생성 시각 하한(이상).
  """
  fromCreatedAt: DateTime
  """
  주문 생성 시각 상한(이하).
  """
  toCreatedAt: DateTime
}

"""
주문 강제 취소 입력. 허용 범위는 adminOrder.cancelOptions를 따른다.
"""
input AdminCancelOrderInput {
  orderId: ID!
  """
  취소 사유. 필수. cancelOptions.reasons 중 하나여야 한다.
  """
  reason: OrderCancelReasonType!
  """
  취소 메모. 선택, 최대 500자. 상태 이력과 감사 로그에 남는다.
  """
  note: String
  """
  취소 사정. cancelOptions.refundRule이 BY_FAULT면 필수이고, 그 밖에는 무시한다.
  """
  fault: OrderCancelFaultType
  """
  돌려줄 금액(원, 0~cancelOptions.paidAmount). fault가 BUYER일 때 필수이고, 그 밖에는 무시한다.
  """
  refundAmount: Int
}
