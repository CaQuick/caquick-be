extend type Query {
  """
  내 매장 주문 목록을 조회한다. 입금이 확인된(접수된) 주문만 보인다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND.
  """
  sellerOrderList(input: SellerOrderListInput): SellerOrderConnection!
  """
  내 매장 주문 상세를 조회한다. 입금 확인 전 주문은 없는 주문과 같이 NOT_FOUND다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND.
  """
  sellerOrder(orderId: ID!): SellerOrderDetail!
}

extend type Mutation {
  """
  주문 상태를 변경한다. 취소(CANCELED)는 받지 않으므로 sellerCancelOrder를 쓴다(INVALID_ORDER_STATUS_TRANSITION).
  판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND.
  """
  sellerUpdateOrderStatus(
    input: SellerUpdateOrderStatusInput!
  ): SellerOrderSummary!
  """
  주문을 거절·취소한다. 접수(SUBMITTED) 단계 거절은 결제액 전액 환불이고, 확정·제작 완료(CONFIRMED·MADE) 뒤 취소는
  fault(사정)가 필수다(판매자 사정 = 전액 환불, 구매자 사정 = refundAmount 환불, 남는 금액은 수수료를 뺀 뒤 정산에 포함).
  환불 송금은 케이퀵이 한다. 그 밖의 상태면 ORDER_NOT_CANCELLABLE, 판매자가 고를 수 없는 사유면 CANCEL_REASON_NOT_ALLOWED,
  사정이 없으면 CANCEL_FAULT_REQUIRED, 구매자 사정인데 금액이 없으면 REFUND_AMOUNT_REQUIRED,
  금액이 0~결제액 밖이면 REFUND_AMOUNT_OUT_OF_RANGE(모두 BAD_USER_INPUT). 입금 확인 전·다른 매장 주문은 NOT_FOUND.
  판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND.
  """
  sellerCancelOrder(input: SellerCancelOrderInput!): SellerOrderSummary!
}

"""
주문 목록 카드. 상세는 sellerOrder로 재조회한다.
"""
type SellerOrderSummary {
  id: ID!
  """
  주문번호. 구매자에게 노출되는 식별자이며 검색(search) 대상이다.
  """
  orderNumber: String!
  """
  현재 주문 상태.
  """
  status: OrderStatusType!
  """
  픽업 예정 일시.
  """
  pickupAt: DateTime!
  """
  주문자 이름. 구매자가 주문 시 입력했거나 프로필 닉네임에서 온 값.
  """
  buyerName: String!
  """
  주문자 연락처.
  """
  buyerPhone: String!
  """
  할인 반영 후 최종 결제 금액(원).
  """
  totalPrice: Int!
  """
  주문 생성 시각. 목록 정렬 기준이다.
  """
  createdAt: DateTime!
  """
  내 매장 첫 품목의 상품명(주문 시점 스냅샷). 이후 상품명이 바뀌어도 유지된다. 활성 품목이 없으면 null.
  """
  firstItemName: String
  """
  내 매장 첫 품목의 상품 대표 이미지 URL(주문 시점 스냅샷). 주문 당시 이미지가 없었으면 null.
  """
  firstItemImageUrl: String
}

"""
주문 목록 페이지. 최신 주문이 먼저 온다.
"""
type SellerOrderConnection {
  """
  주문 카드. 최신 주문이 먼저 온다.
  """
  items: [SellerOrderSummary!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다. 불투명 토큰이라 값의 형식에 의존하지 않는다.
  """
  nextCursor: String
}

"""
주문 목록 조회 조건. 모든 필터는 AND로 결합되고, 미지정 필터는 적용되지 않는다.
"""
input SellerOrderListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다.
  """
  cursor: String
  """
  주문 상태 필터. 미지정 시 전체 상태.
  """
  status: OrderStatusType
  """
  구매자 계정 ID 필터. 채팅 상대의 주문만 볼 때 쓴다. 미지정 시 전체.
  """
  buyerAccountId: ID
  """
  주문 생성 시각 하한(이상).
  """
  fromCreatedAt: DateTime
  """
  주문 생성 시각 상한(이하).
  """
  toCreatedAt: DateTime
  """
  픽업 일시 하한(이상).
  """
  fromPickupAt: DateTime
  """
  픽업 일시 상한(이하).
  """
  toPickupAt: DateTime
  """
  주문번호·주문자 이름·연락처 부분일치 검색. 셋 중 하나라도 맞으면 포함된다.
  """
  search: String
}

"""
주문 상세. items에는 내 매장 품목만 담긴다.
"""
type SellerOrderDetail {
  id: ID!
  """
  주문번호.
  """
  orderNumber: String!
  """
  주문한 구매자 계정 ID.
  """
  accountId: ID!
  """
  현재 주문 상태.
  """
  status: OrderStatusType!
  """
  픽업 예정 일시.
  """
  pickupAt: DateTime!
  """
  주문자 이름.
  """
  buyerName: String!
  """
  주문자 연락처.
  """
  buyerPhone: String!
  """
  구매자가 남긴 요청 사항. 없으면 null.
  """
  requestNote: String
  """
  결제 수단. 결제 도입 전 주문이면 null. 값은 늘어날 수 있으니 모르는 값은 '기타'로 보여 준다.
  """
  paymentMethod: PaymentMethodType
  """
  할인 전 품목 합계(원).
  """
  subtotalPrice: Int!
  """
  할인 금액(원). 할인이 없으면 0.
  """
  discountPrice: Int!
  """
  최종 결제 금액(원) = subtotalPrice - discountPrice.
  """
  totalPrice: Int!
  """
  각 상태에 도달한 시각. 아직 그 상태를 거치지 않았으면 null이다.
  """
  submittedAt: DateTime
  """
  CONFIRMED 도달 시각. 미도달 시 null.
  """
  confirmedAt: DateTime
  """
  MADE(제작 완료) 도달 시각. 미도달 시 null.
  """
  madeAt: DateTime
  """
  PICKED_UP 도달 시각. 미도달 시 null.
  """
  pickedUpAt: DateTime
  """
  CANCELED 도달 시각. 취소되지 않았으면 null.
  """
  canceledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  """
  내 매장에 속한 주문 품목만 포함된다. 다른 매장 품목은 내려오지 않는다.
  """
  items: [OrderItemDetail!]!
  """
  상태 변경 이력. 최신순. 입금 대기 이력은 빠지고, 접수 이력은 fromStatus가 null(최초)로 온다.
  """
  statusHistories: [OrderStatusHistory!]!
  """
  취소 정보(주체·사유·사정·환불액·환불 진행). 취소되지 않은 주문이면 null.
  """
  cancellation: OrderCancellation
}

"""
주문 상태 변경 입력. 전이 규칙은 OrderStatusType 설명을 따르며, 규칙에 어긋나면
BAD_USER_INPUT으로 거절된다.
"""
input SellerUpdateOrderStatusInput {
  orderId: ID!
  """
  변경할 상태. 현재 상태에서 진입 가능한 값이어야 한다.
  """
  toStatus: OrderStatusType!
  """
  변경 메모. 선택, 최대 500자. 상태 이력에 남는다.
  """
  note: String
}

"""
판매자 주문 거절·취소 입력. 허용 범위는 sellerCancelOrder 설명을 따른다.
"""
input SellerCancelOrderInput {
  orderId: ID!
  """
  취소 사유. DESIGN_NOT_FEASIBLE·OUT_OF_MATERIALS·SCHEDULE_UNAVAILABLE·INAPPROPRIATE_REQUEST·BUYER_REQUEST·OTHER 중 하나.
  """
  reason: OrderCancelReasonType!
  """
  취소 메모. 선택, 최대 500자. 상태 이력에 남고 구매자도 본다.
  """
  note: String
  """
  취소 사정. 확정·제작 완료 주문이면 필수이고, 접수 단계 거절에서는 무시한다.
  """
  fault: OrderCancelFaultType
  """
  돌려줄 금액(원, 0~결제액). fault가 BUYER일 때 필수이고, 그 밖에는 무시한다.
  """
  refundAmount: Int
}
