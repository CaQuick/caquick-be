extend type Query {
  """
  입금 확인을 기다리는 주문(입금 대기 + 결제 대기) 목록. claimedOnly면 '입금했어요'를 누른 시각, 아니면 주문 생성 순으로
  오래된 것부터 온다. 기한이 지났지만 아직 자동 취소되지 않은 주문도 포함한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminPendingPayments(
    input: AdminPendingPaymentListInput
  ): AdminPendingPaymentConnection!
  """
  처리 대기 건수(배지용). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminTaskCounts: AdminTaskCounts!
}

extend type Mutation {
  """
  은행 앱에서 확인한 입금으로 주문을 접수(SUBMITTED)로 넘긴다. 이때부터 판매자에게 주문이 보이고 '새 주문' 푸시가 가며,
  판매자 확정 마감은 min(지금 + 24시간, 픽업 일시)이다. 구매자에게 ORDER_PAYMENT_CONFIRMED 알림이 간다.
  입금 대기가 아니면(이미 확인·취소) PAYMENT_NOT_PENDING(CONFLICT), 픽업 일시가 지났으면 PAYMENT_PICKUP_PASSED(CONFLICT),
  입금액이 1 미만이면 DEPOSIT_AMOUNT_INVALID, 결제 금액과 다르면 DEPOSIT_AMOUNT_MISMATCH(BAD_USER_INPUT)다.
  거절된 입금은 미입금 취소·반환 대상 연결로 처리한다. 메모가 500자를 넘으면 TEXT_TOO_LONG. 없는 주문이면 NOT_FOUND.
  감사 로그에 입금액이 남는다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminConfirmPayment(input: AdminConfirmPaymentInput!): AdminOrderSummary!
}

"""
입금 확인 대기 목록 조회 조건. 모든 필터는 AND로 결합된다.
"""
input AdminPendingPaymentListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다. claimedOnly를 바꾸면 커서를 버리고 첫 페이지부터 다시 조회한다.
  """
  cursor: String
  """
  true면 구매자가 '입금했어요'를 누른 주문만. 기본 false, null도 false(전체)로 본다.
  """
  claimedOnly: Boolean = false
  """
  결제 금액(원) 일치 필터. 은행 앱에서 본 입금액으로 주문을 찾는다. null이면 전체.
  """
  amount: Int
  """
  입금자명 부분일치 필터(최대 50자). 공백만 보내거나 null이면 전체.
  """
  depositorName: String
}

"""
입금 확인 대기 주문 1건.
"""
type AdminPendingPayment {
  orderId: ID!
  """
  주문번호.
  """
  orderNumber: String!
  """
  매장명(주문 시점 스냅샷). 품목이 없으면 null.
  """
  storeName: String
  """
  상품명(주문 시점 스냅샷). 품목이 없으면 null.
  """
  productName: String
  """
  입금할 금액(원).
  """
  amount: Int!
  """
  입금자명.
  """
  depositorName: String!
  """
  주문자 이름.
  """
  buyerName: String!
  """
  주문자 연락처.
  """
  buyerPhone: String!
  createdAt: DateTime!
  """
  입금 기한.
  """
  expiresAt: DateTime!
  """
  구매자가 '입금했어요'를 누른 시각. 누르지 않았으면 null.
  """
  buyerClaimedAt: DateTime
  """
  픽업 예정 일시. 지난 주문은 입금 확인할 수 없다.
  """
  pickupAt: DateTime!
}

"""
입금 확인 대기 목록 페이지.
"""
type AdminPendingPaymentConnection {
  """
  입금 확인 대기 주문. 오래된 것부터 온다.
  """
  items: [AdminPendingPayment!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
처리 대기 건수. 진실은 각 목록이고 이 값은 배지용이다.
"""
type AdminTaskCounts {
  """
  '입금했어요'를 눌렀고 아직 확인하지 않은 주문 수(adminPendingPayments claimedOnly=true의 totalCount).
  """
  claimedPayments: Int!
  """
  입금 확인을 기다리는 전체 주문 수(adminPendingPayments의 totalCount, '입금했어요' 포함).
  """
  pendingPayments: Int!
}

"""
입금 확인 입력.
"""
input AdminConfirmPaymentInput {
  orderId: ID!
  """
  은행 앱에서 본 입금액(원, 0 이상 정수). 결제 금액과 같아야 확인된다(0원 주문은 0).
  """
  depositedAmount: Int!
  """
  처리 메모(선택, 500자 이하). 결제 기록에 남는다.
  """
  note: String
}

"""
주문 결제(관리자 시점). 처리자 표시가 더해진다.
"""
type AdminOrderPayment {
  """
  결제 수단.
  """
  method: PaymentMethodType!
  """
  결제 상태.
  """
  status: PaymentStatusType!
  """
  결제 금액(원).
  """
  amount: Int!
  """
  입금자명.
  """
  depositorName: String!
  """
  안내한 케이퀵 계좌의 은행(주문 시점 스냅샷).
  """
  depositBank: Bank!
  """
  안내한 케이퀵 계좌번호(주문 시점 스냅샷).
  """
  depositAccountNumber: String!
  """
  안내한 케이퀵 계좌 예금주(주문 시점 스냅샷).
  """
  depositAccountHolder: String!
  """
  입금 기한.
  """
  expiresAt: DateTime!
  """
  구매자가 '입금했어요'를 누른 시각. 누르지 않았으면 null.
  """
  buyerClaimedAt: DateTime
  """
  입금이 확인된 시각. 확인 전이면 null.
  """
  confirmedAt: DateTime
  """
  입금 확인 경로. 확인 전이면 null.
  """
  confirmSource: PaymentConfirmSourceType
  """
  입금을 확인한 관리자 표시 이름(확인 시점 스냅샷). 확인 전이거나 이름이 없으면 null.
  """
  confirmedByLabel: String
  """
  입금 확인 메모. 없으면 null.
  """
  confirmNote: String
}
