extend type Mutation {
  """
  주문 생성(구매자). 옵션·픽업 일시를 서버가 재검증하고 가격을 스냅샷한 뒤 입금 대기(PENDING_PAYMENT) 주문을 만든다.
  결과의 payment로 입금을 안내하고, 1시간 안에 입금이 확인되지 않으면 자동 취소된다. 판매자에게는 입금 확인 뒤에 보인다.
  입금 계좌가 설정되지 않았으면 PAYMENT_ACCOUNT_NOT_CONFIGURED(SERVICE_UNAVAILABLE), 입금 대기 주문이 이미 2건이면
  PENDING_PAYMENT_LIMIT_EXCEEDED(CONFLICT), 같은 계정의 다른 주문 요청이 처리 중이라 3초 안에 차례가 오지 않으면
  CONCURRENT_REQUEST(CONFLICT)다. 커스텀 상품이면 custom 입력을 검증해 주문 시점 스냅샷으로 저장하고 수량은 1이다
  (CreateOrderCustomInput 참고). 로그인 필수.
  """
  createOrder(input: CreateOrderInput!): CreateOrderOutput!
  """
  커스텀 이미지 업로드용 Presigned URL 발급(구매자). uploadUrl로 PUT한 뒤 publicUrl을 주문 생성의 커스텀 입력에 넣는다.
  JPEG·PNG·WebP, 장당 1바이트 이상 10MB 이하(아니면 INVALID_CONTENT_TYPE·INVALID_CONTENT_LENGTH·FILE_TOO_LARGE).
  주문에 쓰이지 않은 파일은 발급 하루 뒤 지워진다. 구매자 계정만 쓸 수 있고(아니면 USER_ONLY), 정지·탈퇴 등으로
  이용할 수 없는 계정이면 BUYER_ACCOUNT_NOT_ACTIVE다. 로그인 필수.
  """
  createOrderCustomUploadUrl(
    """이미지 용도. 주문 생성 때 이 용도의 자리에만 쓸 수 있다."""
    purpose: OrderCustomUploadPurpose!
    """파일 MIME 타입(image/jpeg·image/png·image/webp)."""
    contentType: String!
    """파일 크기(바이트, 1 이상 10MB 이하)."""
    contentLength: Int!
  ): UploadUrl!
}

"""구매자 커스텀 이미지 업로드 용도."""
enum OrderCustomUploadPurpose {
  """3D 렌더 이미지(윗면·옆면 앞·뒤·좌·우)."""
  RENDER
  """슬롯형 합성 이미지(바탕 + 문구, 구매자가 본 그대로)."""
  COMPOSITE
  """자유 편집 참고 사진."""
  REFERENCE
}

"""주문 생성 입력."""
input CreateOrderInput {
  """
  클라이언트 생성 멱등 키(8~64자). 체크아웃 진입 시 새로 만들고 재시도에는
  같은 키를 재사용한다. 같은 키의 재요청은 새 주문을 만들지 않고 기존 주문을 반환한다.
  같은 키로 다른 입력을 보내면 IDEMPOTENCY_KEY_INPUT_MISMATCH로 거절한다.
  """
  idempotencyKey: String!
  productId: ID!
  """선택한 옵션 아이템 ID 목록. 그룹 규칙(필수/min/max)을 서버가 검증한다."""
  optionItemIds: [ID!]!
  """픽업 일시. 매장 정책(영업시간·휴무·capacity·리드타임과 상품 제작 시간 중 긴 쪽·슬롯 정렬) 재검증."""
  pickupAt: DateTime!
  """주문 수량. 기본 1."""
  quantity: Int = 1
  """미입력 시 프로필 닉네임 사용."""
  buyerName: String
  """미입력 시 프로필 전화번호 사용. 둘 다 없으면 거절."""
  buyerPhone: String
  """
  입금자명(1~20자). 생략하거나 공백만 보내면 주문자 이름을 쓴다. 입력값이든 주문자 이름이든 20자를 넘으면
  DEPOSITOR_NAME_INVALID로 거절한다(은행 입금자명과 대조하는 값이라 자르지 않는다).
  """
  depositorName: String
  """
  화면에 보여 준 최종 결제 금액(원). 서버가 다시 계산한 금액과 다르면 ORDER_PRICE_CHANGED로 거절한다.
  """
  expectedTotalPrice: Int!
  """판매자에게 전할 요청 사항(최대 500자). 공백만 보내면 없음으로 저장한다."""
  requestNote: String
  """
  커스텀 입력. 상품의 커스텀 방식(ProductDetail.customMode)이 SLOT이면 slot, THREE_D면 threeD 하나만 보낸다.
  커스텀 상품인데 없으면 CUSTOM_INPUT_REQUIRED, 방식이 다르거나 커스텀 상품이 아닌데 보내면 CUSTOM_INPUT_MISMATCH,
  수량이 1이 아니면 CUSTOM_QUANTITY_FIXED, 판매자 설정이 끝나지 않은 상품이면 CUSTOM_PRODUCT_NOT_READY다.
  커스텀은 추가 금액이 없다(3D 모양·크기 등의 가격은 옵션 추가금으로만 들어온다).
  """
  custom: CreateOrderCustomInput
}

"""
주문 커스텀 입력. 이미지 URL은 모두 createOrderCustomUploadUrl로 올린 본인 파일의 publicUrl이어야 하고(용도가 맞아야 한다),
한 주문 안에서 같은 파일을 두 번 쓸 수 없다. 아니면 CUSTOM_UPLOAD_INVALID, 발급 뒤 오래돼 정리 중인 파일이면
CUSTOM_UPLOAD_EXPIRED다. 다른 주문에 이미 쓴 파일도 CUSTOM_UPLOAD_INVALID다.
"""
input CreateOrderCustomInput {
  """슬롯형(바탕 이미지 + 문구 자리) 입력. 슬롯형 상품에서만 보낸다."""
  slot: CreateOrderSlotCustomInput
  """3D 입력. 3D 상품에서만 보낸다."""
  threeD: CreateOrderThreeDCustomInput
}

"""
슬롯형 커스텀 입력. 좌표는 바탕 이미지 한 변을 10000으로 본 정수 비율이고 원점은 왼쪽 위다.
"""
input CreateOrderSlotCustomInput {
  """
  꾸미기를 시작할 때 본 ProductDetail.customTemplate.revision. 그 사이 판매자가 설정을 바꿨으면
  CUSTOM_TEMPLATE_CHANGED(CONFLICT)이고 다시 꾸며야 한다.
  """
  templateRevision: Int!
  """
  문구 자리마다 1건(customTemplate.slots 전부, 중복 없이). 빠지거나 남는 자리가 있으면 CUSTOM_SLOT_TEXTS_MISMATCH다.
  """
  texts: [CreateOrderSlotTextInput!]!
  """구매자가 본 그대로의 합성 이미지 URL(바탕 + 문구, 용도 COMPOSITE). 대표 이미지로 저장된다."""
  compositeImageUrl: String!
  """
  자유 편집 요청(customTemplate.freeEditEnabled일 때만, 최대 5건). 규칙을 벗어나면 CUSTOM_FREE_EDIT_INVALID다.
  """
  freeEdits: [CreateOrderFreeEditInput!] = []
}

"""문구 자리 1개의 입력."""
input CreateOrderSlotTextInput {
  tokenId: ID!
  """
  넣을 문구. 손대지 않았으면 기본 문구를 그대로 보낸다. 줄바꿈(CRLF는 LF로 바꾼다)·이모지를 쓸 수 있고 앞뒤 공백은 지운다.
  지운 뒤 비었거나 null이면 '문구 없음'이다(필수 자리면 CUSTOM_SLOT_TEXT_REQUIRED). 자리의 maxLength(코드 포인트)를
  넘으면 CUSTOM_SLOT_TEXT_TOO_LONG이다.
  """
  valueText: String
}

"""자유 편집 요청 1건. 바탕 이미지 위 영역과 설명, 참고 사진이다."""
input CreateOrderFreeEditInput {
  """영역 왼쪽 위 x(0~10000)."""
  posX: Int!
  """영역 왼쪽 위 y(0~10000)."""
  posY: Int!
  """영역 너비(1 이상, posX + width ≤ 10000)."""
  width: Int!
  """영역 높이(1 이상, posY + height ≤ 10000)."""
  height: Int!
  """요청 설명(앞뒤 공백을 지운 뒤 1~2000자, 줄바꿈 허용)."""
  descriptionText: String!
  """참고 사진 URL(용도 REFERENCE, 최대 3장)."""
  referenceImageUrls: [String!] = []
}

"""3D 커스텀 입력."""
input CreateOrderThreeDCustomInput {
  """
  3D 디자인(JSON v1). 모양·크기·디자인·맛은 고른 옵션의 threeDKey와 같아야 한다(아니면 CUSTOM_3D_OPTIONS_CHANGED).
  카탈로그·한도 검증은 customThreeDCatalog를 따른다.
  """
  design: ThreeDDesignInput!
  """
  렌더 이미지(용도 RENDER). THREE_D_TOP·FRONT·BACK·LEFT·RIGHT 정확히 1장씩이고, 아니면 CUSTOM_RENDER_IMAGES_INVALID다.
  윗면이 대표 이미지로 저장된다.
  """
  renderImages: [CreateOrderRenderImageInput!]!
}

"""3D 렌더 이미지 1장."""
input CreateOrderRenderImageInput {
  """렌더 자세."""
  kind: CustomImageKindType!
  """이미지 URL."""
  imageUrl: String!
}

"""
3D 디자인 입력(JSON v1). 저장 형태는 ThreeDDesign이고 같은 좌표계·규칙을 쓴다. 배열 순서가 그리는 순서다.
"""
input ThreeDDesignInput {
  """디자인 JSON 버전. 지금은 1만 받는다(아니면 CUSTOM_3D_SCHEMA_UNSUPPORTED)."""
  schemaVersion: Int!
  """모양·크기·디자인·맛·시트 색."""
  basic: ThreeDDesignBasicInput!
  """윗면 항목(글자·꾸미기 각 10개까지)."""
  top: [ThreeDDesignItemInput!]!
  """옆면 항목(글자·꾸미기 각 10개까지)."""
  side: [ThreeDDesignItemInput!]!
}

"""3D 디자인의 케이크 기본값."""
input ThreeDDesignBasicInput {
  """모양 선택지 value(고른 모양 옵션의 값)."""
  shape: String!
  """크기 선택지 value(고른 크기 옵션의 값)."""
  size: String!
  """디자인 선택지 value. 디자인 옵션을 고르지 않았으면 null(장식 없는 시트)."""
  design: String
  """맛 선택지 value. 맛 옵션을 고르지 않았으면 null."""
  flavor: String
  """시트 색 key(카탈로그 sheetColors)."""
  sheetColor: String!
}

"""3D 디자인 항목(글자 또는 꾸미기) 1개."""
input ThreeDDesignItemInput {
  """항목 종류."""
  kind: ThreeDItemKindType!
  """가로 위치(0~1, ThreeDDesign.top·side 좌표계)."""
  x: Float!
  """세로 위치(0~1, ThreeDDesign.top·side 좌표계)."""
  y: Float!
  """크기(cqw). 글자 4~30, 꾸미기 8~50."""
  size: Float!
  """효과."""
  effect: ThreeDDesignEffectInput!
  """글자 내용(TEXT만, 1~30 코드 포인트, 줄바꿈·이모지 허용). DECO는 null."""
  text: String
  """글자색(TEXT만, #RRGGBB). DECO는 null."""
  color: String
  """꾸미기 key(DECO만, 카탈로그 decos). TEXT는 null."""
  decoId: String
}

"""3D 디자인 항목에 건 효과."""
input ThreeDDesignEffectInput {
  """효과 key(카탈로그 effects)."""
  type: String!
  """효과 강도(0~100 정수)."""
  intensity: Int!
}

"""주문 생성 결과 요약. 상세는 myOrder로 재조회."""
type CreateOrderOutput {
  orderId: ID!
  """주문번호. 화면·문의에 쓰는 식별자."""
  orderNumber: String!
  """
  주문 상태. 새로 생성된 경우 PENDING_PAYMENT다. 같은 idempotencyKey로 재시도하면 기존
  주문을 그대로 돌려주므로 그 사이 진행된 상태(SUBMITTED·CONFIRMED·CANCELED 등)일 수 있다.
  """
  status: OrderStatusType!
  """확정된 픽업 일시. 서버가 매장 정책으로 재검증한 값이다."""
  pickupAt: DateTime!
  """서버가 스냅샷한 최종 결제 금액(원). 클라이언트 계산값이 아니다."""
  totalPrice: Int!
  """입금 안내(계좌·금액·입금자명·기한). 결제 도입 전 주문을 replay한 경우만 null."""
  payment: OrderPayment
}
