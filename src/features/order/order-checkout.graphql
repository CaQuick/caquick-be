extend type Mutation {
  """
  주문 생성(구매자). 옵션·픽업 일시를 서버가 재검증하고 가격을 스냅샷한 뒤 입금 대기(PENDING_PAYMENT) 주문을 만든다.
  결과의 payment로 입금을 안내하고, 1시간 안에 입금이 확인되지 않으면 자동 취소된다. 판매자에게는 입금 확인 뒤에 보인다.
  입금 계좌가 설정되지 않았으면 PAYMENT_ACCOUNT_NOT_CONFIGURED(SERVICE_UNAVAILABLE), 입금 대기 주문이 이미 2건이면
  PENDING_PAYMENT_LIMIT_EXCEEDED(CONFLICT), 같은 계정의 다른 주문 요청이 처리 중이라 3초 안에 차례가 오지 않으면
  CONCURRENT_REQUEST(CONFLICT)다. 로그인 필수.
  """
  createOrder(input: CreateOrderInput!): CreateOrderOutput!
  """
  커스텀 이미지 업로드용 Presigned URL 발급(구매자). uploadUrl로 PUT한 뒤 publicUrl을 주문 생성의 커스텀 입력에 넣는다.
  JPEG·PNG·WebP, 장당 1바이트 이상 10MB 이하(아니면 INVALID_CONTENT_TYPE·INVALID_CONTENT_LENGTH·FILE_TOO_LARGE).
  주문에 쓰이지 않은 파일은 발급 하루 뒤 지워진다. 구매자 계정만 쓸 수 있고(아니면 USER_ONLY), 정지·탈퇴 등으로
  이용할 수 없는 계정이면 BUYER_ACCOUNT_NOT_ACTIVE다. 로그인 필수.
  """
  createOrderCustomUploadUrl(
    """이미지 용도. 주문 생성 때 이 용도의 자리에만 쓸 수 있다."""
    purpose: OrderCustomUploadPurpose!
    """파일 MIME 타입(image/jpeg·image/png·image/webp)."""
    contentType: String!
    """파일 크기(바이트, 1 이상 10MB 이하)."""
    contentLength: Int!
  ): UploadUrl!
}

"""구매자 커스텀 이미지 업로드 용도."""
enum OrderCustomUploadPurpose {
  """3D 렌더 이미지(윗면·옆면 앞·뒤·좌·우)."""
  RENDER
  """슬롯형 합성 이미지(바탕 + 문구, 구매자가 본 그대로)."""
  COMPOSITE
  """자유 편집 참고 사진."""
  REFERENCE
}

"""주문 생성 입력. 커스텀 필드는 커스텀 스펙 확정 후 optional로 확장 예정."""
input CreateOrderInput {
  """
  클라이언트 생성 멱등 키(8~64자). 체크아웃 진입 시 새로 만들고 재시도에는
  같은 키를 재사용한다. 같은 키의 재요청은 새 주문을 만들지 않고 기존 주문을 반환한다.
  같은 키로 다른 입력을 보내면 IDEMPOTENCY_KEY_INPUT_MISMATCH로 거절한다.
  """
  idempotencyKey: String!
  productId: ID!
  """선택한 옵션 아이템 ID 목록. 그룹 규칙(필수/min/max)을 서버가 검증한다."""
  optionItemIds: [ID!]!
  """픽업 일시. 매장 정책(영업시간·휴무·capacity·리드타임과 상품 제작 시간 중 긴 쪽·슬롯 정렬) 재검증."""
  pickupAt: DateTime!
  """주문 수량. 기본 1."""
  quantity: Int = 1
  """미입력 시 프로필 닉네임 사용."""
  buyerName: String
  """미입력 시 프로필 전화번호 사용. 둘 다 없으면 거절."""
  buyerPhone: String
  """
  입금자명(1~20자). 생략하거나 공백만 보내면 주문자 이름을 쓴다. 입력값이든 주문자 이름이든 20자를 넘으면
  DEPOSITOR_NAME_INVALID로 거절한다(은행 입금자명과 대조하는 값이라 자르지 않는다).
  """
  depositorName: String
  """
  화면에 보여 준 최종 결제 금액(원). 서버가 다시 계산한 금액과 다르면 ORDER_PRICE_CHANGED로 거절한다.
  """
  expectedTotalPrice: Int!
  """판매자에게 전할 요청 사항(최대 500자). 공백만 보내면 없음으로 저장한다."""
  requestNote: String
}

"""주문 생성 결과 요약. 상세는 myOrder로 재조회."""
type CreateOrderOutput {
  orderId: ID!
  """주문번호. 화면·문의에 쓰는 식별자."""
  orderNumber: String!
  """
  주문 상태. 새로 생성된 경우 PENDING_PAYMENT다. 같은 idempotencyKey로 재시도하면 기존
  주문을 그대로 돌려주므로 그 사이 진행된 상태(SUBMITTED·CONFIRMED·CANCELED 등)일 수 있다.
  """
  status: OrderStatusType!
  """확정된 픽업 일시. 서버가 매장 정책으로 재검증한 값이다."""
  pickupAt: DateTime!
  """서버가 스냅샷한 최종 결제 금액(원). 클라이언트 계산값이 아니다."""
  totalPrice: Int!
  """입금 안내(계좌·금액·입금자명·기한). 결제 도입 전 주문을 replay한 경우만 null."""
  payment: OrderPayment
}
