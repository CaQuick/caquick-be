extend type Query {
  """
  환불(취소 환불·입금 반환) 목록. 처리 순서대로 오래된 환불부터 온다. 계좌번호는 끝 4자리만 나간다.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminRefunds(input: AdminRefundListInput): AdminRefundConnection!
  """
  환불 상세. 송금에 쓸 계좌번호 원문과 입금 반환이면 그 입금 기록이 함께 온다. 없으면 REFUND_NOT_FOUND(NOT_FOUND).
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminRefund(refundId: ID!): AdminRefundDetail!
  """
  결제로 확인하지 않은 입금 기록(반환·종결) 목록. 최근 기록부터 온다.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminDepositRecords(
    input: AdminDepositRecordListInput
  ): AdminDepositRecordConnection!
}

extend type Mutation {
  """
  환불 송금을 마쳤다고 기록한다. 계좌가 들어온(송금 대기) 환불만 되고, 계좌 입력 전이면 REFUND_NOT_READY(BAD_USER_INPUT),
  이미 끝났으면 REFUND_ALREADY_COMPLETED(CONFLICT), 없으면 REFUND_NOT_FOUND(NOT_FOUND). 메모가 500자를 넘으면 TEXT_TOO_LONG.
  구매자에게 REFUND_COMPLETED 알림이 가고 감사 로그(REFUND)를 남긴다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminCompleteRefund(input: AdminCompleteRefundInput!): AdminRefund!
  """
  은행 앱에서 본 입금을 주문의 반환 대상으로 연결한다. 입금 기록(RETURN)과 입금액 전액의 환불(계좌 입력 대기)이 생기고
  구매자에게 환불 계좌 입력 요청 알림이 간다. 주문 상태·결제·정산은 바꾸지 않으며 주문 상태와 관계없이 연결할 수 있다
  (미입금 취소 뒤 늦은 입금, 취소 뒤 입금, 금액이 틀린 입금, 이중 입금). 입금액이 1 미만이면 DEPOSIT_AMOUNT_INVALID,
  입금자명이 비었거나 50자를 넘으면 TEXT_REQUIRED·TEXT_TOO_LONG, 메모가 500자를 넘으면 TEXT_TOO_LONG(모두 BAD_USER_INPUT),
  없는 주문이면 ORDER_NOT_FOUND(NOT_FOUND). 감사 로그(DEPOSIT_RECORD)를 남긴다.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminCreateDepositReturn(
    input: AdminCreateDepositReturnInput!
  ): AdminDepositRecord!
  """
  주인을 알 수 없는 입금을 메모와 함께 종결 기록(UNIDENTIFIED)으로 남긴다. 메모가 비면 DEPOSIT_NOTE_REQUIRED,
  입금액·입금자명·메모 길이 오류는 adminCreateDepositReturn과 같다(모두 BAD_USER_INPUT). 감사 로그(DEPOSIT_RECORD)를 남긴다.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminRecordUnidentifiedDeposit(
    input: AdminRecordUnidentifiedDepositInput!
  ): AdminDepositRecord!
  """
  종결 기록한 입금의 주인을 찾았을 때 그 기록을 주문의 반환 대상으로 바꾼다. 같은 입금을 새로 기록하지 않고 기록 종류가
  RETURN으로 바뀌며, 입금액 전액의 환불이 생겨 구매자에게 계좌 입력 요청 알림이 간다(주문 상태·결제·정산은 그대로).
  이미 반환으로 연결된 기록이면 DEPOSIT_RECORD_ALREADY_LINKED(CONFLICT), 없는 기록이면 DEPOSIT_RECORD_NOT_FOUND,
  없는 주문이면 ORDER_NOT_FOUND(모두 NOT_FOUND). 감사 로그(DEPOSIT_RECORD)를 남긴다.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminLinkUnidentifiedDeposit(
    input: AdminLinkUnidentifiedDepositInput!
  ): AdminDepositRecord!
}

"""
입금 기록 종류. 값은 늘어날 수 있으니 모르는 값을 받아도 화면이 죽지 않게 처리한다.
"""
enum DepositRecordKindType {
  """주문에 연결해 돌려주는 입금. 같은 금액의 입금 반환 환불이 함께 있다."""
  RETURN
  """주인을 알 수 없어 메모로 종결한 입금."""
  UNIDENTIFIED
}

"""
환불 목록 조회 조건. 모든 필터는 AND로 결합된다.
"""
input AdminRefundListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다.
  """
  cursor: String
  """
  진행 상태 필터. null이면 전체.
  """
  status: RefundStatusType
  """
  종류 필터. null이면 전체.
  """
  kind: RefundKindType
}

"""
환불(관리자 시점). 계좌번호는 끝 4자리만 담는다.
"""
type AdminRefund {
  id: ID!
  """
  환불 종류.
  """
  kind: RefundKindType!
  """
  돌려줄 금액(원).
  """
  amount: Int!
  """
  진행 상태.
  """
  status: RefundStatusType!
  """
  환불받을 은행. 계좌 입력 전이면 null.
  """
  bank: Bank
  """
  환불 계좌 예금주. 계좌 입력 전이면 null.
  """
  accountHolder: String
  """
  환불 계좌번호 끝 4자리만 보이는 값(예: ****1234). 계좌 입력 전이면 null.
  """
  accountNumberMasked: String
  """
  환불이 생긴 시각.
  """
  requestedAt: DateTime!
  """
  구매자가 계좌를 입력한 시각(덮어쓰면 마지막 입력). 입력 전이면 null.
  """
  accountSubmittedAt: DateTime
  """
  송금 완료 시각. 완료 전이면 null.
  """
  completedAt: DateTime
  orderId: ID!
  """
  주문번호.
  """
  orderNumber: String!
  """
  주문자 이름. 계좌 입력을 기다릴 때 연락에 쓴다.
  """
  buyerName: String!
  """
  주문자 연락처.
  """
  buyerPhone: String!
  """
  매장명(주문 시점 스냅샷). 품목이 없으면 null.
  """
  storeName: String
  """
  상품명(주문 시점 스냅샷). 품목이 없으면 null.
  """
  productName: String
  """
  송금 완료를 기록한 관리자 표시 이름(처리 시점 스냅샷). 완료 전이거나 이름이 없으면 null.
  """
  completedByLabel: String
  """
  송금 완료 메모. 없으면 null.
  """
  completeNote: String
}

"""
환불 상세. 계좌번호 원문이 들어 있으니 화면 밖(로그·분석 이벤트)에 남기지 않는다.
"""
type AdminRefundDetail {
  """
  환불.
  """
  refund: AdminRefund!
  """
  환불 계좌번호 원문(숫자만). 송금에 쓴다. 계좌 입력 전이면 null.
  """
  accountNumber: String
  """
  입금 반환이면 그 입금 기록, 취소 환불이면 null.
  """
  depositRecord: AdminDepositRecord
}

"""
환불 목록 페이지.
"""
type AdminRefundConnection {
  """
  환불. 오래된 것부터 온다.
  """
  items: [AdminRefund!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
입금 기록 목록 조회 조건.
"""
input AdminDepositRecordListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다.
  """
  cursor: String
  """
  종류 필터. null이면 전체.
  """
  kind: DepositRecordKindType
}

"""
결제로 확인하지 않은 입금 기록 1건.
"""
type AdminDepositRecord {
  id: ID!
  """
  기록 종류.
  """
  kind: DepositRecordKindType!
  """
  연결한 주문 ID. 반환(RETURN)만 있고 종결이면 null.
  """
  orderId: ID
  """
  연결한 주문번호. 반환(RETURN)만 있고 종결이면 null.
  """
  orderNumber: String
  """
  입금액(원).
  """
  amount: Int!
  """
  은행 앱에 보인 입금자명.
  """
  depositorName: String!
  """
  은행 앱에 보인 입금 일시. 입력하지 않았으면 null.
  """
  depositedAt: DateTime
  """
  처리 메모. 없으면 null(종결 기록은 항상 있다).
  """
  note: String
  """
  기록한 관리자 표시 이름(기록 시점 스냅샷). 이름이 없으면 null.
  """
  recordedByLabel: String
  """
  반환으로 생긴 환불 ID(adminRefund로 연다). 종결이면 null.
  """
  refundId: ID
  """
  반환으로 생긴 환불의 진행 상태. 종결이면 null.
  """
  refundStatus: RefundStatusType
  createdAt: DateTime!
}

"""
입금 기록 목록 페이지.
"""
type AdminDepositRecordConnection {
  """
  입금 기록. 최근 것부터 온다.
  """
  items: [AdminDepositRecord!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
환불 송금 완료 입력.
"""
input AdminCompleteRefundInput {
  refundId: ID!
  """
  처리 메모(선택, 500자 이하). 환불 기록에 남는다.
  """
  note: String
}

"""
입금 반환 연결 입력.
"""
input AdminCreateDepositReturnInput {
  orderId: ID!
  """
  은행 앱에서 본 입금액(원, 1 이상). 이 금액 전액을 돌려준다.
  """
  amount: Int!
  """
  은행 앱에 보인 입금자명(1~50자).
  """
  depositorName: String!
  """
  은행 앱에 보인 입금 일시(선택).
  """
  depositedAt: DateTime
  """
  처리 메모(선택, 500자 이하).
  """
  note: String
}

"""
주인 모를 입금 종결 기록 입력.
"""
input AdminRecordUnidentifiedDepositInput {
  """
  은행 앱에서 본 입금액(원, 1 이상).
  """
  amount: Int!
  """
  은행 앱에 보인 입금자명(1~50자).
  """
  depositorName: String!
  """
  은행 앱에 보인 입금 일시(선택).
  """
  depositedAt: DateTime
  """
  종결 사유 메모(필수, 500자 이하).
  """
  note: String!
}

"""
종결 기록을 반환 대상으로 바꾸는 입력.
"""
input AdminLinkUnidentifiedDepositInput {
  depositRecordId: ID!
  orderId: ID!
}
