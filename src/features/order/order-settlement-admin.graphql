extend type Query {
  """
  주간 정산 목록. 최근 생성 순. 매주 월요일 05:00(KST)에 지난주(월~일)까지 정산이 확정된 주문을 매장별로 묶어 만든다.
  날짜 형식이 어긋나면 INVALID_DATE(BAD_USER_INPUT). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminSettlements(input: AdminSettlementListInput): AdminSettlementConnection!
  """
  주간 정산 1건과 포함 주문·현재 매장 정산 계좌(원문). 없으면 NOT_FOUND(SETTLEMENT_NOT_FOUND).
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminSettlement(settlementId: ID!): AdminSettlementDetail!
  """
  월 수수료 집계. 정산 확정 시각의 KST 월로 매장별 주문 수·기준액·수수료를 묶는다(주간 정산 여부와 무관).
  월 형식이 어긋나면 INVALID_YEAR_MONTH(BAD_USER_INPUT). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminMonthlyCommissions(
    input: AdminMonthlyCommissionInput!
  ): AdminMonthlyCommissionReport!
}

extend type Mutation {
  """
  은행 앱에서 매장 정산 계좌로 송금한 뒤 송금 완료로 처리한다. 그 시점 매장 정산 계좌를 송금 계좌로 남기고 감사 로그(SETTLEMENT)를 쓴다.
  이미 송금 완료면 SETTLEMENT_ALREADY_PAID(CONFLICT), 매장 정산 계좌가 없으면 SETTLEMENT_ACCOUNT_REQUIRED(BAD_USER_INPUT),
  메모가 500자를 넘으면 TEXT_TOO_LONG, 없는 정산이면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminMarkSettlementPaid(
    input: AdminMarkSettlementPaidInput!
  ): AdminSettlementDetail!
}

"""
주간 정산 목록 조회 조건. 모든 필터는 AND로 결합된다.
"""
input AdminSettlementListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다. 필터를 바꾸면 커서를 버리고 첫 페이지부터 다시 조회한다.
  """
  cursor: String
  """
  송금 상태 필터. null이면 전체.
  """
  status: SettlementStatusType
  """
  매장 필터. null이면 전체.
  """
  storeId: ID
  """
  정산 기간 시작일(월요일, KST, YYYY-MM-DD) 필터. 관리자 알림 링크의 periodStart와 같다. null이면 전체.
  """
  periodStart: String
}

"""
주간 정산 1건(관리자 시점).
"""
type AdminSettlementSummary {
  id: ID!
  storeId: ID!
  """
  매장명(정산에 묶인 가장 최근 주문의 스냅샷).
  """
  storeName: String!
  """
  정산 기간 시작일(월요일, KST). YYYY-MM-DD.
  """
  periodStart: String!
  """
  정산 기간 마지막 날(일요일, KST). YYYY-MM-DD.
  """
  periodEnd: String!
  """
  포함 주문 수. 앞 정산에서 빠진 주문(늦게 확정된 주문)도 함께 묶인다.
  """
  orderCount: Int!
  """
  수수료 기준액 합계(원).
  """
  settlementBaseAmount: Int!
  """
  수수료 합계(원).
  """
  commissionAmount: Int!
  """
  송금할 금액(원) = 기준액 합계 − 수수료 합계.
  """
  payoutAmount: Int!
  """
  송금 상태.
  """
  status: SettlementStatusType!
  """
  송금 완료 시각. 송금 전이면 null.
  """
  paidAt: DateTime
  """
  지금 매장 정산 계좌가 등록돼 있는지. false면 송금 완료로 처리할 수 없다.
  """
  accountRegistered: Boolean!
  createdAt: DateTime!
}

"""
주간 정산 목록 페이지.
"""
type AdminSettlementConnection {
  """
  주간 정산. 최근 생성 순.
  """
  items: [AdminSettlementSummary!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
주간 정산 상세(관리자 시점). 현재 계좌 원문이 들어 있으니 화면 밖(로그·분석 이벤트)에 남기지 않는다.
"""
type AdminSettlementDetail {
  id: ID!
  storeId: ID!
  """
  매장명(정산에 묶인 가장 최근 주문의 스냅샷).
  """
  storeName: String!
  """
  정산 기간 시작일(월요일, KST). YYYY-MM-DD.
  """
  periodStart: String!
  """
  정산 기간 마지막 날(일요일, KST). YYYY-MM-DD.
  """
  periodEnd: String!
  """
  포함 주문 수.
  """
  orderCount: Int!
  """
  수수료 기준액 합계(원).
  """
  settlementBaseAmount: Int!
  """
  수수료 합계(원).
  """
  commissionAmount: Int!
  """
  송금할 금액(원) = 기준액 합계 − 수수료 합계.
  """
  payoutAmount: Int!
  """
  송금 상태.
  """
  status: SettlementStatusType!
  """
  송금 완료 시각. 송금 전이면 null.
  """
  paidAt: DateTime
  """
  지금 매장 정산 계좌가 등록돼 있는지(currentAccount가 있는지).
  """
  accountRegistered: Boolean!
  createdAt: DateTime!
  """
  송금 완료로 처리한 관리자 표시 이름(처리 시점 스냅샷). 송금 전이거나 이름이 없으면 null.
  """
  paidByLabel: String
  """
  송금 메모. 없으면 null.
  """
  paidNote: String
  """
  송금한 계좌(송금 시점 스냅샷, 끝 4자리만). 송금 전이면 null.
  """
  paidAccount: SettlementPaidAccount
  """
  지금 매장 정산 계좌(계좌번호 원문 포함). 송금할 때 쓴다. 등록 전이면 null.
  """
  currentAccount: AdminStoreSettlementAccount
  """
  포함 주문. 주문 id 순.
  """
  orders: [SettlementOrder!]!
}

"""
송금 완료 입력.
"""
input AdminMarkSettlementPaidInput {
  settlementId: ID!
  """
  송금 메모(선택, 500자 이하). 정산과 감사 로그에 남는다.
  """
  note: String
}

"""
월 수수료 집계 조건.
"""
input AdminMonthlyCommissionInput {
  """
  집계 월(KST). "YYYY-MM" 형식. 예: "2026-11".
  """
  month: String!
}

"""
월 수수료 집계.
"""
type AdminMonthlyCommissionReport {
  """
  집계 월. "YYYY-MM".
  """
  month: String!
  """
  정산이 확정된 주문 수 합계.
  """
  orderCount: Int!
  """
  수수료 기준액 합계(원).
  """
  settlementBaseAmount: Int!
  """
  수수료 합계(원).
  """
  commissionAmount: Int!
  """
  매장별 집계. 매장 id 순, 확정 주문이 없는 매장은 빠진다.
  """
  stores: [AdminMonthlyCommissionStore!]!
}

"""
매장 1곳의 월 수수료.
"""
type AdminMonthlyCommissionStore {
  storeId: ID!
  """
  매장명(그 달 가장 최근 확정 주문의 스냅샷).
  """
  storeName: String!
  """
  정산이 확정된 주문 수.
  """
  orderCount: Int!
  """
  수수료 기준액 합계(원).
  """
  settlementBaseAmount: Int!
  """
  수수료 합계(원).
  """
  commissionAmount: Int!
}
