extend type Query {
  """
  문의 채팅 진입 컨텍스트(구매자). 매장 프로필·상담시간·치환 완료 인사말·질문 칩을
  한 번에 내려준다. 아직 대화가 없어도 조회 가능하며 그 경우 conversationId는 null.
  로그인 필수.
  숨김 매장은 그 매장에 진행 중인 주문이 있는 구매자만 조회할 수 있다(아니면 STORE_NOT_FOUND). 문의 전송도 같다.
  """
  storeInquiryContext(storeId: ID!): StoreInquiryContext!
}

extend type Mutation {
  """
  구매자 텍스트 메시지 전송. 해당 매장과의 대화가 없으면 이 시점에 생성하고,
  치환 완료된 인사말을 매장 메시지로 먼저 저장한 뒤 유저 메시지를 저장한다.
  로그인 필수.
  """
  sendConversationMessage(input: SendConversationMessageInput!): ConversationMessagesPayload!
  """
  질문 칩(FAQ) 전송. 유저 메시지(칩 제목)와 매장 자동응답(FAQ 답변 HTML)을
  한 트랜잭션으로 저장한다. 첫 전송이면 대화 생성 + 인사말 저장도 함께 수행.
  로그인 필수.
  """
  sendConversationFaqMessage(input: SendConversationFaqMessageInput!): ConversationMessagesPayload!
  """
  채팅 이미지 업로드용 Presigned URL 발급(구매자). uploadUrl로 PUT한 뒤 publicUrl을 sendConversationImageMessage에 넣는다.
  JPEG·PNG·WebP, 1바이트 이상 10MB 이하(아니면 INVALID_CONTENT_TYPE·INVALID_CONTENT_LENGTH·FILE_TOO_LARGE).
  로그인 필수.
  """
  createConversationImageUploadUrl(
    """파일 MIME 타입(image/jpeg·image/png·image/webp)."""
    contentType: String!
    """파일 크기(바이트, 1 이상 10MB 이하)."""
    contentLength: Int!
  ): UploadUrl!
  """
  구매자 이미지 메시지 전송(메시지당 1장). 대화가 없으면 sendConversationMessage처럼 생성하고 인사말을 먼저 저장한다.
  imageUrl이 이 계정에 createConversationImageUploadUrl로 발급된 URL이 아니면 INVALID_IMAGE_URL, 공백이면
  IMAGE_URL_REQUIRED다. 로그인 필수.
  """
  sendConversationImageMessage(input: SendConversationImageMessageInput!): ConversationMessagesPayload!
  """
  주문 카드 전송(구매자). 주문의 매장과의 대화에 보낸 시점의 주문 스냅샷을 카드로 남긴다(대화가 없으면 생성).
  본인 주문이 아니면 ORDER_NOT_FOUND, 입금 확인 전(판매자가 볼 수 없는) 주문이면 ORDER_INQUIRY_NOT_AVAILABLE,
  매장이 숨김이고 그 매장에 진행 중인 주문이 없으면 STORE_NOT_FOUND다. 로그인 필수.
  """
  sendConversationOrderCard(orderId: ID!): ConversationMessagesPayload!
}

"""문의 채팅 진입 컨텍스트"""
type StoreInquiryContext {
  storeId: ID!
  """매장명."""
  storeName: String!
  """매장 프로필(로고) 이미지 URL. 미등록 시 null"""
  profileImageUrl: String
  """요일별 상담시간(영업시간과 동일 정책). FE가 "월/화/수… 10:00~18:00" 형식으로 조합"""
  businessHours: [InquiryBusinessHour!]!
  """닉네임·매장명 치환이 끝난 인사말"""
  greetingMessage: String!
  """질문 칩 목록(활성 FAQ, 노출 순서대로)"""
  faqTopics: [InquiryFaqTopic!]!
  """기존 대화가 있으면 그 ID, 없으면 null"""
  conversationId: ID
}

"""요일별 상담시간"""
type InquiryBusinessHour {
  """0=일 ~ 6=토"""
  dayOfWeek: Int!
  """해당 요일 휴무 여부. true면 openTime·closeTime이 null이다."""
  isClosed: Boolean!
  """오픈 시각 "HH:mm". 휴무면 null"""
  openTime: String
  """마감 시각 "HH:mm". 휴무면 null"""
  closeTime: String
}

"""질문 칩(매장 FAQ)"""
type InquiryFaqTopic {
  id: ID!
  """칩에 노출되는 질문 제목. 전송하면 이 문구가 유저 메시지로 저장된다."""
  title: String!
}

"""대화 메시지"""
type ConversationMessage {
  id: ID!
  conversationId: ID!
  """발신 주체. 말풍선 좌우 배치 기준이다."""
  senderType: ConversationSenderType!
  """본문 형식. 읽어야 할 본문 필드를 가리킨다."""
  bodyFormat: ConversationBodyFormat!
  """평문 본문. bodyFormat이 TEXT면 이 값을 쓴다. IMAGE·ORDER_CARD는 대체 문구가 들어 있다."""
  bodyText: String
  """서식 본문. bodyFormat이 HTML이면 이 값을 쓴다."""
  bodyHtml: String
  """이미지 URL. bodyFormat이 IMAGE면 채워진다."""
  imageUrl: String
  """주문 카드. bodyFormat이 ORDER_CARD면 채워진다."""
  orderCard: ConversationOrderCard
  """발송 시각. 메시지 스트림 정렬은 id 기준이다."""
  createdAt: DateTime!
}

"""메시지 전송 결과. 이번 호출로 저장된 메시지들을 생성 순으로 담는다(첫 전송이면 인사말 포함)"""
type ConversationMessagesPayload {
  """대화방 ID. 첫 전송이면 이번에 생성된 대화방 ID다."""
  conversationId: ID!
  """이번 호출로 저장된 메시지. 생성 순이며 첫 전송이면 인사말이 맨 앞에 온다."""
  messages: [ConversationMessage!]!
}

"""구매자 텍스트 메시지 전송 입력"""
input SendConversationMessageInput {
  """문의할 매장 ID. 대화방이 없으면 이 호출에서 생성된다."""
  storeId: ID!
  """보낼 평문 메시지."""
  bodyText: String!
}

"""구매자 이미지 메시지 전송 입력"""
input SendConversationImageMessageInput {
  """문의할 매장 ID. 대화방이 없으면 이 호출에서 생성된다."""
  storeId: ID!
  """createConversationImageUploadUrl이 이 계정에 발급한 publicUrl."""
  imageUrl: String!
}

"""질문 칩(FAQ) 전송 입력"""
input SendConversationFaqMessageInput {
  """문의할 매장 ID. 대화방이 없으면 이 호출에서 생성된다."""
  storeId: ID!
  """선택한 질문 칩 ID. storeInquiryContext.faqTopics가 준 값을 쓴다."""
  faqTopicId: ID!
}
