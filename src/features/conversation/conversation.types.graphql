"""대화 메시지 발신자 유형. 구매자·판매자 API가 공용으로 쓴다."""
enum ConversationSenderType {
  """구매자가 보낸 메시지."""
  USER
  """판매자(매장)가 보낸 메시지. FAQ 질문 칩에 대한 자동응답도 이 값으로 저장된다."""
  STORE
  """시스템이 발신한 메시지."""
  SYSTEM
}

"""대화 메시지 본문 형식. 구매자·판매자 API가 공용으로 쓴다."""
enum ConversationBodyFormat {
  """평문. 목록 미리보기에도 원문이 그대로 쓰인다."""
  TEXT
  """
  서식이 있는 본문(FAQ 답변 등). 목록 미리보기에서는 태그를 제거해 한 줄로 만든다.
  서버 측 sanitize는 아직 적용돼 있지 않다.
  """
  HTML
  """
  이미지 1장. imageUrl을 그리고, bodyText에는 대체 문구('사진을 보냈습니다.')가 있다.
  """
  IMAGE
  """
  주문 카드(구매자만 보낸다). orderCard를 그리고, bodyText에는 대체 문구('주문 문의: {상품명} ({주문번호})')가 있다.
  """
  ORDER_CARD
}

"""
채팅 주문 카드. 구매자가 보낸 시점의 주문 스냅샷이라 이후 주문이 바뀌거나 지워져도 그대로 보인다.
판매자 앱은 orderId로 주문 상세를 연다.
"""
type ConversationOrderCard {
  orderId: ID!
  """주문번호."""
  orderNumber: String!
  """상품명(주문 시점 스냅샷)."""
  productName: String!
  """썸네일. 커스텀 주문이면 커스텀 대표 이미지(3D 윗면·슬롯형 합성), 아니면 상품 대표 이미지. 둘 다 없으면 null."""
  thumbnailUrl: String
  """보낸 시점의 픽업 일시."""
  pickupAt: DateTime!
}
