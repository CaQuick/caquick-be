extend type Query {
  """상품 상세. 없거나 비활성/삭제 상품(또는 매장)이면 NOT_FOUND. 비로그인 접근 가능."""
  productDetail(productId: ID!): ProductDetail!
}

"""상품 상세(구매자용)."""
type ProductDetail {
  id: ID!
  """소속 매장 ID(주문/매장 이동용)."""
  storeId: ID!
  """상품명."""
  name: String!
  """상품 설명. 미등록 시 null."""
  description: String
  """구매 전 필독사항."""
  purchaseNotice: String
  """상품 이미지(캐러셀·썸네일, sort_order asc)."""
  images: [String!]!
  """정가(원)."""
  regularPrice: Int!
  """할인가(원). 할인이 없으면 null이고 regularPrice가 표시가로 쓰인다."""
  salePrice: Int
  """할인율(0~100). salePrice 없으면 0."""
  discountRate: Int!
  """통화 코드(ISO 4217). 저장된 값을 그대로 돌려주며, 현재 KRW만 주문 가능하다."""
  currency: String!
  """후기 탭 카운트."""
  reviewCount: Int!
  """로그인 사용자의 찜 여부(비로그인 시 false)."""
  isWishlisted: Boolean!
  """옵션 섹션(케이크 사이즈/맛 등, sort_order asc). 활성 그룹만."""
  optionGroups: [ProductDetailOptionGroup!]!
  """커스텀 방식. NONE이 아니면 꾸민 내용과 함께 주문해야 한다."""
  customMode: CustomModeType!
  """슬롯형 꾸미기 설정. customMode가 SLOT일 때만 오고 그 밖에는 null."""
  customTemplate: ProductDetailCustomTemplate
}

"""
슬롯형 꾸미기 설정. 바탕 이미지는 정사각(1:1)이고 문구 자리 좌표는 한 변을 10000으로 본 정수 비율이다(원점 왼쪽 위).
"""
type ProductDetailCustomTemplate {
  """설정 버전. 주문할 때 그대로 보내고, 그사이 판매자가 설정을 바꿨으면 주문이 거절되어 다시 꾸며야 한다."""
  revision: Int!
  """바탕 이미지 URL(정사각)."""
  baseImageUrl: String!
  """자유 편집(바탕 위 영역 지정 + 요청 문구·참고 사진) 허용 여부."""
  freeEditEnabled: Boolean!
  """문구 자리. sortOrder 오름차순."""
  slots: [ProductDetailCustomSlot!]!
}

"""
슬롯형 문구 자리 1개. 구매자는 기본 문구로 시작해 바꾸거나 지운다(필수 자리는 지울 수 없다).
"""
type ProductDetailCustomSlot {
  id: ID!
  """자리 이름(예: 받는 사람). 입력 화면 라벨로 쓴다."""
  label: String!
  """기본 문구. 바꾸지 않으면 이 문구로 주문된다."""
  defaultText: String!
  """입력 가능한 최대 글자 수(코드 포인트, 1~50)."""
  maxLength: Int!
  """필수 자리 여부. true면 문구를 비울 수 없다."""
  isRequired: Boolean!
  """자리 왼쪽 위 가로 위치(0~10000)."""
  posX: Int!
  """자리 왼쪽 위 세로 위치(0~10000)."""
  posY: Int!
  """자리 너비(1~10000, posX + width ≤ 10000)."""
  width: Int!
  """자리 높이(1~10000, posY + height ≤ 10000)."""
  height: Int!
  """글자색(#RRGGBB 대문자)."""
  textColor: String!
  """자리 안 글자 정렬."""
  textAlign: CustomTextAlignType!
  """입력 화면 노출 순서. 오름차순."""
  sortOrder: Int!
}

"""상품 상세 옵션 섹션(그룹)."""
type ProductDetailOptionGroup {
  id: ID!
  """그룹명(섹션 제목)."""
  name: String!
  """그룹 안내 문구(섹션 인트로)."""
  description: String
  """필수 선택 여부. true면 선택 개수가 minSelect~maxSelect 범위 안이어야 하고, false면 0개 선택도 허용된다."""
  isRequired: Boolean!
  """최소 선택 개수."""
  minSelect: Int!
  """최대 선택 개수. minSelect와 함께 허용 개수를 정한다(둘 다 1이면 단일 선택)."""
  maxSelect: Int!
  """섹션 노출 순서. 오름차순."""
  sortOrder: Int!
  """이 그룹의 선택지. 활성 항목만 온다."""
  items: [ProductDetailOptionItem!]!
}

"""상품 상세 옵션 항목."""
type ProductDetailOptionItem {
  id: ID!
  """선택지 이름."""
  title: String!
  """선택지 설명. 미등록 시 null."""
  description: String
  """선택지 이미지 URL. 미등록 시 null."""
  imageUrl: String
  """옵션 선택 시 가격 증감(원)."""
  priceDelta: Int!
  """그룹 안에서의 노출 순서. 오름차순."""
  sortOrder: Int!
}
