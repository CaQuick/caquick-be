extend type Query {
  """
  상품 목록을 최신 등록순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminProducts(input: AdminProductListInput): AdminProductConnection!
  """
  상품 1건을 소속 매장·이미지·집계·분류·옵션·커스텀 템플릿과 함께 조회한다. 없거나 삭제됐으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminProduct(productId: ID!): AdminProductDetail!
}

extend type Mutation {
  """
  상품 노출 여부를 강제로 바꾼다(정책 위반 상품 내리기). 상품 내용 수정은 판매자 몫이다.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN. 상품이 없으면 NOT_FOUND. 같은 값이면 그대로 반환한다(멱등, 감사 기록 없음).
  """
  adminSetProductActive(input: AdminSetProductActiveInput!): AdminProduct!
}

"""
상품 요약. 판매자의 SellerProduct와 같은 원본을 관리자 시점으로 본 것이다.
"""
type AdminProduct {
  id: ID!
  """
  소속 매장 ID.
  """
  storeId: ID!
  """
  소속 매장명.
  """
  storeName: String!
  """
  상품명.
  """
  name: String!
  """
  정가.
  """
  regularPrice: Int!
  """
  할인가. 없으면 null.
  """
  salePrice: Int
  """
  통화 코드.
  """
  currency: String!
  """
  기본 디자인 이미지 URL. 미등록 시 null.
  """
  baseDesignImageUrl: String
  """
  노출 여부. false면 구매자 화면에 나오지 않는다.
  """
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
상품 상세. 소속 매장 상태·이미지·집계와 판매자가 설정한 분류·옵션·커스텀 템플릿을 함께 준다.
"""
type AdminProductDetail {
  """
  상품.
  """
  product: AdminProduct!
  """
  소속 매장 노출 여부. 매장이 내려가 있으면 상품도 구매자에게 보이지 않는다.
  """
  storeIsActive: Boolean!
  """
  상품 설명. 미등록 시 null.
  """
  description: String
  """
  구매 안내. 미등록 시 null.
  """
  purchaseNotice: String
  """
  제작 소요 시간(분).
  """
  preparationTimeMinutes: Int!
  """
  상품 이미지 URL 목록(노출 순서, 삭제 제외).
  """
  imageUrls: [String!]!
  """
  리뷰 수(삭제 제외).
  """
  reviewCount: Int!
  """
  주문 항목 수(삭제 제외).
  """
  orderItemCount: Int!
  """
  연결된 카테고리. 종류(EVENT → STYLE → OTHER) → 노출 순서로 정렬한다. 삭제된 연결·카테고리는 빼고 숨김 카테고리는 isActive=false로 담는다.
  """
  categories: [AdminProductCategory!]!
  """
  연결된 태그. 이름순. 삭제된 연결·태그는 뺀다.
  """
  tags: [AdminProductTag!]!
  """
  옵션 그룹. sortOrder 오름차순. 삭제는 빼고 숨김 그룹·선택지는 isActive=false로 담는다.
  """
  optionGroups: [AdminProductOptionGroup!]!
  """
  커스텀 템플릿 요약(문구 좌표 제외). 없거나 삭제됐으면 null.
  """
  customTemplate: AdminProductCustomTemplate
}

"""
상품에 연결된 카테고리.
"""
type AdminProductCategory {
  id: ID!
  """
  카테고리 분류.
  """
  categoryType: CategoryType!
  """
  카테고리명.
  """
  name: String!
  """
  카테고리 노출 여부. false면 숨김 카테고리다(상품 연결은 유지).
  """
  isActive: Boolean!
}

"""
상품에 연결된 태그.
"""
type AdminProductTag {
  id: ID!
  """
  태그명.
  """
  name: String!
}

"""
옵션 그룹. 구매자는 이 그룹 단위로 선택지를 고른다.
활성 필수 그룹의 minSelect가 1 이상인데 활성 선택지가 없으면 구매자가 주문할 수 없다.
"""
type AdminProductOptionGroup {
  id: ID!
  """
  그룹명.
  """
  name: String!
  """
  그룹 안내 문구. 미등록 시 null.
  """
  description: String
  """
  필수 선택 여부. true면 선택 개수가 minSelect~maxSelect 범위 안이어야 하고, false면 0개 선택도 허용된다.
  """
  isRequired: Boolean!
  """
  최소 선택 개수.
  """
  minSelect: Int!
  """
  최대 선택 개수. 둘 다 1이면 단일 선택이다.
  """
  maxSelect: Int!
  """
  선택지에 구매자 커스텀 입력(설명)이 필요한 그룹인지. 현재는 true인 그룹의 옵션을 고르면 주문이 거절된다(잠정 가드).
  """
  optionRequiresDescription: Boolean!
  """
  선택지에 구매자 커스텀 입력(이미지)이 필요한 그룹인지. 현재는 true인 그룹의 옵션을 고르면 주문이 거절된다(잠정 가드).
  """
  optionRequiresImage: Boolean!
  """
  상품 안에서의 그룹 노출 순서. 오름차순.
  """
  sortOrder: Int!
  """
  노출 여부. false면 구매자에게 그룹 자체가 보이지 않는다.
  """
  isActive: Boolean!
  """
  선택지. sortOrder 오름차순. 삭제는 빼고 숨김 선택지는 isActive=false로 담는다.
  """
  optionItems: [AdminProductOptionItem!]!
}

"""
옵션 그룹의 선택지 1개.
"""
type AdminProductOptionItem {
  id: ID!
  """
  선택지 이름.
  """
  title: String!
  """
  선택지 설명. 미등록 시 null.
  """
  description: String
  """
  선택지 이미지 URL. 미등록 시 null.
  """
  imageUrl: String
  """
  이 선택지를 고를 때 더해지는 금액(원). 음수면 할인이다.
  """
  priceDelta: Int!
  """
  그룹 안에서의 노출 순서. 오름차순.
  """
  sortOrder: Int!
  """
  노출 여부. false면 구매자가 고를 수 없다.
  """
  isActive: Boolean!
}

"""
커스텀 템플릿 요약. 바탕 이미지 위 문구 슬롯 구성이며 슬롯 좌표는 담지 않는다.
"""
type AdminProductCustomTemplate {
  id: ID!
  """
  문구를 올릴 바탕 이미지 URL.
  """
  baseImageUrl: String!
  """
  활성 여부. false면 구매자 화면에 커스텀 입력이 열리지 않는다.
  """
  isActive: Boolean!
  """
  문구 슬롯. sortOrder 오름차순. 삭제된 슬롯은 뺀다.
  """
  textTokens: [AdminProductCustomTextToken!]!
}

"""
커스텀 템플릿의 문구 슬롯 1개.
"""
type AdminProductCustomTextToken {
  id: ID!
  """
  슬롯 식별 키.
  """
  tokenKey: String!
  """
  구매자가 입력하지 않았을 때 쓸 기본 문구.
  """
  defaultText: String!
  """
  입력 가능한 최대 글자 수.
  """
  maxLength: Int!
  """
  입력 화면에서의 노출 순서. 오름차순.
  """
  sortOrder: Int!
  """
  필수 입력 여부.
  """
  isRequired: Boolean!
}

"""
상품 목록 페이지. 최신 등록이 먼저 온다.
"""
type AdminProductConnection {
  """
  상품. 최신 등록이 먼저 온다.
  """
  items: [AdminProduct!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
상품 목록 조회 조건.
"""
input AdminProductListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다.
  """
  cursor: String
  """
  상품명 부분일치 검색어. 최대 100자. 미지정 시 전체.
  """
  keyword: String
  """
  소속 매장 ID 필터. 미지정 시 전체.
  """
  storeId: ID
  """
  노출 여부 필터. 미지정 시 전체.
  """
  isActive: Boolean
}

"""
상품 노출 여부 변경 입력.
"""
input AdminSetProductActiveInput {
  productId: ID!
  """
  노출 여부.
  """
  isActive: Boolean!
  """
  변경 사유. 감사 로그에 기록된다. 최대 500자. 선택.
  """
  reason: String
}
