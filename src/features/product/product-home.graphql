extend type Query {
  """홈 '상황별 인기 케이크' 섹션(배너 1건 + 인기 케이크 카드). 비로그인 접근 가능."""
  popularCakes(input: PopularCakesInput): PopularCakesResult!

  """홈 '다른 사람들은 이렇게 만들었어요' 제작 후기(좋아요순). 없으면 빈 배열. 비로그인 접근 가능."""
  customCakeShowcase(input: CustomCakeShowcaseInput): [CustomCakeShowcaseItem!]!

  """홈 '랜덤 케이크 둘러보기' 그리드(호출마다 무작위 재추출). 비로그인 접근 가능."""
  randomCakes(input: RandomCakesInput): RandomCakesResult!
}

"""랜덤 케이크 조회 조건."""
input RandomCakesInput {
  """EVENT 카테고리 ID. 비우면 '전체' 칩(필터 미적용)."""
  categoryId: ID
  """이미지 수(기본 9 — 3열 그리드 9개 단위, figma 명세 기준). 1~30만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 9
}

"""랜덤 케이크 그리드. '새로보기 1/3' 페이지 카운트는 FE 로컬 상태(서버 무관)."""
type RandomCakesResult {
  """무작위 추출된 케이크 카드. 호출마다 구성이 달라진다."""
  items: [RandomCake!]!
}

"""랜덤 케이크 그리드 셀(클릭 시 케이크 상세 이동)."""
type RandomCake {
  id: ID!
  """소속 매장 ID(상세 URL 구성용: /store/{storeId}/products/{id})."""
  storeId: ID!
  """대표 이미지(sort_order 최소)."""
  thumbnailUrl: String!
}

"""인기 케이크 조회 조건."""
input PopularCakesInput {
  """EVENT 카테고리 ID. 비우면 '전체' 칩(필터 미적용)."""
  categoryId: ID
  """2차 시군구 ID 다중 선택. 비우면 전국 대상."""
  regionIds: [ID!]
  """카드 수(최대 3 — figma 명세 "최대 3개 케이크 노출")."""
  limit: Int = 3
}

"""홈 인기 케이크 섹션 결과."""
type PopularCakesResult {
  """카테고리 대표 배너. 등록된 배너가 없으면 null(FE placeholder 처리)."""
  banner: HomeBanner
  """인기 케이크 카드. rank 오름차순."""
  items: [PopularCake!]!
  """랭킹 산출 기준 시각(서버 조회 시점)."""
  rankedAt: DateTime!
}

"""홈 카테고리 대표 배너. linkType에 대응하는 링크 필드 하나만 채워진다."""
type HomeBanner {
  id: ID!
  """배너 이미지 URL."""
  imageUrl: String!
  """배너 문구. 미입력 시 null."""
  title: String
  """이동 대상 타입. 이 값에 따라 아래 링크 필드 중 하나만 채워진다."""
  linkType: BannerLinkType!
  """linkType=URL일 때 이동 URL."""
  linkUrl: String
  """linkType=PRODUCT일 때 상품 ID."""
  linkProductId: ID
  """linkType=PRODUCT일 때 상품의 소속 매장 ID(상세 URL 구성용: /store/{linkProductStoreId}/products/{linkProductId})."""
  linkProductStoreId: ID
  """linkType=STORE일 때 이동 대상 매장 ID."""
  linkStoreId: ID
  """linkType=CATEGORY일 때 카테고리 ID(FE 카테고리 자동선택 이동)."""
  linkCategoryId: ID
}

"""홈 '다른 사람들은 이렇게 만들었어요' 제작 후기 카드 목록."""
input CustomCakeShowcaseInput {
  """가져올 후기 수. 기본 5, 1~20만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 5
}

"""제작 후기 카드. Before(요청 디자인)/After(완성 사진)가 모두 있는 리뷰만 노출."""
type CustomCakeShowcaseItem {
  """후기 보러가기(reviewDetail) 이동용."""
  reviewId: ID!
  """후기 소속 매장 ID(상세 URL 구성용: /store/{storeId}/reviews/{reviewId})."""
  storeId: ID!
  """좋아요순 순위(1부터)."""
  rank: Int!
  """작성자 닉네임. 탈퇴 작성자는 null(FE 익명 표기)."""
  authorNickname: String
  """리뷰 본문. 없으면 null."""
  reviewText: String
  """좋아요 수. 이 값 기준 내림차순으로 정렬된다."""
  likeCount: Int!
  """사용자가 요청한 디자인 이미지(주문 커스텀 자유편집 크롭)."""
  beforeImageUrl: String!
  """실제 완성된 케이크 이미지(리뷰 첫 이미지)."""
  afterImageUrl: String!
}

"""인기 케이크 카드(지역명·매장명·케이크명·가격·할인율)."""
type PopularCake {
  id: ID!
  """소속 매장 ID(상세 URL 구성용: /store/{storeId}/products/{id})."""
  storeId: ID!
  """인기 순위. 1부터 시작한다."""
  rank: Int!
  """상품명."""
  name: String!
  """대표 이미지(sort_order 최소). 없으면 null."""
  thumbnailUrl: String
  """매장명."""
  storeName: String!
  """매장 위치 표기(예: 서울 청담동)."""
  regionLabel: String
  """정가(원)."""
  regularPrice: Int!
  """할인가(원). 할인이 없으면 null이고 regularPrice가 표시가로 쓰인다."""
  salePrice: Int
  """할인율(0~100). salePrice 없으면 0."""
  discountRate: Int!
}
