extend type Query {
  """키워드 상품 검색(검색 결과 상품 탭). 상품명·태그명에 단어별 AND 부분일치. 비로그인 접근 가능."""
  searchProducts(input: SearchProductsInput!): SearchProductConnection!
}

"""상품 검색 정렬. 시안 '추천순' 라벨은 POPULAR(기본)로 해석한다."""
enum ProductSearchSort {
  """인기순(최근 주문·찜·베이지안 평점 — 인기 케이크와 동일 산식)."""
  POPULAR
  """등록순(최신 등록 우선)."""
  LATEST
  """판매순(최근 30일 유효 주문 수량 합)."""
  BEST_SELLING
  """낮은 가격순(표시가 = salePrice ?? regularPrice)."""
  PRICE_ASC
  """높은 가격순."""
  PRICE_DESC
}

"""상품 검색 조건. 필터 그룹 간에는 AND, 그룹 안에서는 OR로 결합된다."""
input SearchProductsInput {
  """검색어(정규화: trim·공백 축약, 빈값/200자 초과 400)."""
  keyword: String!
  """상황별(EVENT) 카테고리 ID 다중 선택(그룹 내 OR). 비우면 '전체'."""
  eventCategoryIds: [ID!]
  """스타일별(STYLE) 카테고리 ID 다중 선택(그룹 내 OR, 상황별과는 AND). 비우면 '전체'."""
  styleCategoryIds: [ID!]
  """최저가(원, 표시가 기준). 비우면 하한 없음."""
  minPrice: Int
  """최고가(원, 표시가 기준). 비우면 상한 없음('7만원 이상'). minPrice보다 작으면 400."""
  maxPrice: Int
  """2차 시군구 ID 다중 선택. 비우면 전국 대상."""
  regionIds: [ID!]
  """정렬 기준. 기본 인기순."""
  sort: ProductSearchSort = POPULAR
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """조회 개수(최대 50)."""
  limit: Int = 20
}

"""상품 검색 결과 목록."""
type SearchProductConnection {
  """상품 카드. 요청한 sort 순서로 온다. 가격 뒤 '~' 표기는 FE 장식(옵션 가격 가변 안내)."""
  items: [ProductCard!]!
  """조건에 맞는 전체 상품 수. 탭 카운트에 쓴다."""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
}

extend type Query {
  """가격대 필터 시트의 가격 분포 히스토그램(키워드+카테고리+지역 조건, 가격 조건 제외). 비로그인 접근 가능."""
  searchProductFacets(input: SearchProductFacetsInput!): SearchProductFacets!
}

"""가격 분포 조회 조건. 가격 필터만 빼고 상품 검색과 같은 조건을 받는다."""
input SearchProductFacetsInput {
  """검색어(정규화: trim·공백 축약, 빈값/200자 초과 400)."""
  keyword: String!
  """상황별(EVENT) 카테고리 ID 다중 선택(그룹 내 OR)."""
  eventCategoryIds: [ID!]
  """스타일별(STYLE) 카테고리 ID 다중 선택(그룹 내 OR, 상황별과는 AND)."""
  styleCategoryIds: [ID!]
  """2차 시군구 ID 다중 선택. 비우면 전국 대상."""
  regionIds: [ID!]
}

"""가격 분포. 버킷은 5,000원 고정 폭으로 0원부터 70,000원까지, 마지막은 '70,000원 이상'(maxPrice null)."""
type SearchProductFacets {
  """가격 버킷. minPrice 오름차순으로 온다."""
  buckets: [SearchPriceBucket!]!
  """조건에 맞는 상품의 최저 표시가. 결과 없으면 null."""
  minPrice: Int
  """조건에 맞는 상품의 최고 표시가. 결과 없으면 null."""
  maxPrice: Int
  """조건에 맞는 상품 수(가격 조건 제외)."""
  totalCount: Int!
}

"""가격 버킷 [minPrice, maxPrice). maxPrice null = 상한 없음."""
type SearchPriceBucket {
  """구간 하한(원, 포함)."""
  minPrice: Int!
  """구간 상한(원, 미포함). null이면 상한 없는 마지막 구간이다."""
  maxPrice: Int
  """이 구간에 속한 상품 수."""
  count: Int!
}
