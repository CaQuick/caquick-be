extend type Query {
  """리뷰 상세(후기 상세 화면). 없거나 삭제된 리뷰면 NOT_FOUND. 비로그인 접근 가능."""
  reviewDetail(reviewId: ID!): ReviewDetail!

  """리뷰 댓글 목록(등록순, 커서). 비로그인 접근 가능."""
  reviewComments(input: ReviewCommentsInput!): ReviewCommentConnection!
}

"""리뷰 상세(후기 상세 화면)."""
type ReviewDetail {
  """리뷰 본문(목록 카드와 동일 구조, content 전문)."""
  review: ProductReview!
  """판매 케이크 정보(현재 상품 기준)."""
  product: ReviewDetailProduct!
}

"""리뷰 상세 상단 판매 케이크 정보."""
type ReviewDetailProduct {
  productId: ID!
  """상품명(현재 값). 리뷰 시점 스냅샷이 아니다."""
  name: String!
  """대표 이미지(sort_order 최소). 없으면 null."""
  thumbnailUrl: String
  """매장명."""
  storeName: String!
  """매장 위치 표기(예: 인천 청라동)."""
  regionLabel: String
  """정가(원)."""
  regularPrice: Int!
  """할인가(원). 할인이 없으면 null."""
  salePrice: Int
  """할인율(0~100). salePrice 없으면 0."""
  discountRate: Int!
}

"""리뷰 댓글 목록 조회 조건."""
input ReviewCommentsInput {
  reviewId: ID!
  """이전 페이지 마지막 댓글 id(이후부터 조회)."""
  cursor: String
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
}

"""리뷰 댓글 목록(등록순, 커서 기반)."""
type ReviewCommentConnection {
  """댓글. 등록순으로 온다."""
  items: [ReviewCommentItem!]!
  """전체 댓글 수."""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: String
}

"""리뷰 댓글."""
type ReviewCommentItem {
  id: ID!
  """댓글 본문."""
  content: String!
  """작성자 닉네임(탈퇴 시 null)."""
  authorNickname: String
  """작성자 프로필 이미지(탈퇴/미설정 시 null)."""
  authorProfileImageUrl: String
  """로그인 사용자 본인 댓글 여부(삭제 버튼 노출용, 비로그인 시 false)."""
  isMine: Boolean!
  """작성 시각. 등록순 정렬 기준이다."""
  createdAt: DateTime!
}
