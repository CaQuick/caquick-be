  """
  textTokens: [SellerCustomTextToken!]!
}

"""
내 매장 상품. 목록·상세 모두 이 타입으로 내려온다.
"""
type SellerProduct {
  id: ID!
  storeId: ID!
  """
  상품명.
  """
  name: String!
  """
  상품 설명.
  """
  description: String
  """
  구매 전 안내 문구(주의사항 등).
  """
  purchaseNotice: String
  """
  정가(원).
  """
  regularPrice: Int!
  """
  할인가(원). null이면 할인이 없고 정가가 표시가다.
  """
  salePrice: Int
  """
  통화 코드(ISO 4217, 대문자 3자). KRW만 주문 가능하다.
  """
  currency: String!
  """
  제작 소요 시간(분). 픽업 가능 시각 계산의 리드타임에 반영된다.
  """
  preparationTimeMinutes: Int!
  """
  커스텀 방식. 바꾸려면 sellerSetProductCustomMode.
  """
  customMode: CustomModeType!
  """
  커스텀 방식별 준비 상태(NONE·SLOT·THREE_D 순). 준비 이슈가 있는 방식으로는 바꿀 수 없고,
  지금 방식에 이슈가 생기면 구매자 주문이 거절된다.
  """
  customReadiness: [SellerCustomReadiness!]!
  """
  노출 여부. false면 구매자 화면에 나오지 않는다.
  """
  isActive: Boolean!
  """
  상품 이미지. sortOrder 오름차순이고 첫 장이 대표 이미지다.
  """
  images: [SellerProductImage!]!
  """
  연결된 카테고리. 없으면 빈 배열.
  """
  categories: [SellerCategory!]!
  """
  연결된 태그. 없으면 빈 배열.
  """
  tags: [SellerTag!]!
  """
  옵션 그룹. sortOrder 오름차순이며 비활성 그룹도 포함된다.
  """
  optionGroups: [SellerOptionGroup!]!
  """
  커스텀 템플릿. 등록하지 않았으면 null.
  """
  customTemplate: SellerCustomTemplate
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
커스텀 방식 하나의 준비 상태.
"""
type SellerCustomReadiness {
  """
  대상 커스텀 방식.
  """
  mode: CustomModeType!
  """
  issues가 비어 있으면 true.
  """
  ready: Boolean!
  """
  준비 이슈. 판매자에게 그대로 보여 줄 메시지를 담는다.
  """
  issues: [SellerCustomReadinessIssue!]!
}

"""
커스텀 준비 이슈 1건.
"""
type SellerCustomReadinessIssue {
  """
  이슈 코드. 값이 늘 수 있어 문자열이다.
  슬롯형: SLOT_TEMPLATE_MISSING(바탕 없음), SLOT_NOTHING_TO_EDIT(문구 자리 0개이고 자유 편집 꺼짐).
  3D: THREE_D_GROUP_MISSING(모양·크기 그룹 없음), THREE_D_GROUP_DUPLICATED(같은 카테고리 그룹이 둘 이상),
  THREE_D_GROUP_MIXED(한 그룹에 카테고리가 섞였거나 3D 항목 미지정 선택지가 있음),
  THREE_D_GROUP_NOT_SINGLE_SELECT(모양·크기는 필수·1개 선택, 맛·디자인은 최대 1개 선택이 아님),
  THREE_D_KEY_DUPLICATED(같은 키가 둘 이상), THREE_D_KEY_UNAVAILABLE(카탈로그에 없거나 퇴역한 키).
  """
  code: String!
  """
  판매자에게 보여 줄 안내 문장.
  """
  message: String!
  """
  이슈가 걸린 옵션 그룹. 그룹과 무관하면 null.
  """
  optionGroupId: ID
}

"""
