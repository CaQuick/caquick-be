  """
  sellerDeleteProductCustomTextToken(tokenId: ID!): Boolean!
  """
  커스텀 텍스트 토큰 순서를 변경한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND.
  """
  sellerReorderProductCustomTextTokens(
    input: SellerReorderProductCustomTextTokensInput!
  ): [SellerCustomTextToken!]!
}

"""
상품에 연결된 카테고리.
"""
type SellerCategory {
  id: ID!
  """
  카테고리명.
  """
  name: String!
}

"""
상품에 연결된 태그.
"""
type SellerTag {
  id: ID!
  """
  태그명.
  """
  name: String!
}

"""
태그 제안 1건. 정확 일치 여부로 FE가 '새 태그 만들기' 행을 띄울지 판단한다.
"""
type SellerTagSuggestion {
  id: ID!
  """
  태그명(저장된 형태).
  """
  name: String!
  """
  정규화한 keyword와 이름이 같으면 true(대소문자·악센트 무시). 목록에 true가 없으면 FE는 '새로 만들기'를 보여준다.
  """
  isExactMatch: Boolean!
  """
  이 태그가 붙은 활성 상품 수(전 매장). 표시용 근사치이며 정렬에는 쓰지 않는다.
  """
  productCount: Int!
}

"""
상품 이미지 1장.
"""
type SellerProductImage {
  id: ID!
  """
  이미지 URL.
  """
  imageUrl: String!
  """
  노출 순서. 오름차순이고 가장 앞이 대표 이미지다.
  """
  sortOrder: Int!
}

"""
옵션 그룹에 속한 선택지 1개.
"""
type SellerOptionItem {
  id: ID!
  optionGroupId: ID!
  """
  선택지 이름.
  """
  title: String!
  """
  선택지 설명. 미등록 시 null.
  """
  description: String
  """
  선택지 이미지 URL. 미등록 시 null.
  """
  imageUrl: String
  """
  이 선택지를 고를 때 더해지는 금액(원). 음수면 할인으로 동작하되 품목 금액이 0원 미만이 되면 거절된다.
  """
  priceDelta: Int!
  """
  그룹 안에서의 노출 순서. 오름차순.
  """
  sortOrder: Int!
  """
  노출 여부. false면 구매자가 고를 수 없다.
  """
  isActive: Boolean!
  """
  이어진 3D 카탈로그 선택지 키(customThreeDCatalog.optionChoices.key). 없으면 null.
  """
  threeDKey: String
}

"""
상품 옵션 그룹. 구매자는 이 그룹 단위로 선택지를 고르고, 주문 생성 시 서버가
필수·최소·최대 선택 규칙을 재검증한다. 활성 필수 그룹의 minSelect가 1 이상인데 활성 선택지가 없으면 주문할 수 없다.
"""
type SellerOptionGroup {
  id: ID!
  productId: ID!
  """
  그룹명(상품 상세의 옵션 섹션 제목).
  """
  name: String!
  """
  그룹 안내 문구(상품 상세 옵션 섹션 인트로).
  """
  description: String
  """
  필수 선택 여부. true면 선택 개수가 minSelect~maxSelect 범위 안이어야 하고, false면 0개 선택도 허용된다.
  """
  isRequired: Boolean!
  """
  최소 선택 개수.
  """
  minSelect: Int!
  """
  최대 선택 개수. minSelect와 함께 허용 개수를 정한다(둘 다 1이면 단일 선택).
  """
  maxSelect: Int!
  """
  상품 안에서의 그룹 노출 순서. 오름차순.
  """
  sortOrder: Int!
  """
  노출 여부. false면 구매자에게 그룹 자체가 보이지 않는다.
  """
  isActive: Boolean!
  """
  활성 선택지의 threeDKey로 정해지는 3D 카테고리. 이어진 키가 없거나 종류가 섞였으면 null.
  """
  threeDCategory: ThreeDOptionCategoryType
  """
  이 그룹의 선택지. sortOrder 오름차순.
  """
  optionItems: [SellerOptionItem!]!
}

"""
커스텀 케이크 문구 슬롯 1개. 구매자가 이 자리에 문구를 입력한다.
"""
type SellerCustomTextToken {
  id: ID!
  templateId: ID!
  """
  슬롯 식별 키. 주문 시 스냅샷으로 남아 어느 자리 문구인지 구분한다.
  """
  tokenKey: String!
  """
  표시 이름(구매자 입력 화면 라벨). 주문에 스냅샷으로 남는다.
  """
  label: String!
  """
  구매자가 입력하지 않았을 때 쓸 기본 문구.
  """
  defaultText: String!
  """
  입력 가능한 최대 글자 수(코드 포인트, 1~50).
  """
  maxLength: Int!
  """
  입력 화면에서의 노출 순서. 오름차순.
  """
  sortOrder: Int!
  """
  필수 입력 여부.
  """
  isRequired: Boolean!
  """
  문구 영역 왼쪽 위 모서리의 가로 위치. 바탕 이미지 한 변을 10000으로 본 정수 비율(0~10000), 원점은 왼쪽 위.
  """
  posX: Int!
  """
  문구 영역 왼쪽 위 모서리의 세로 위치(0~10000).
  """
  posY: Int!
  """
  문구 영역 너비(1~10000, posX + width ≤ 10000).
  """
  width: Int!
  """
  문구 영역 높이(1~10000, posY + height ≤ 10000).
  """
  height: Int!
  """
  글자색(#RRGGBB 대문자).
  """
  textColor: String!
  """
  자리 안 글자 정렬.
  """
  textAlign: CustomTextAlignType!
}

"""
상품 커스텀 템플릿(슬롯형). 정사각 바탕 이미지 위에 문구 슬롯을 올려 구매자가 문구를 넣게 한다.
상품당 1개다. 구매자에게 열리는지는 템플릿이 아니라 SellerProduct.customMode(SLOT)로 정한다.
"""
type SellerCustomTemplate {
  id: ID!
  productId: ID!
  """
  문구를 올릴 바탕 이미지 URL(정사각).
  """
  baseImageUrl: String!
  """
  자유 편집(바탕 위 영역 지정 + 요청 문구·참고 사진) 허용 여부.
  """
  freeEditEnabled: Boolean!
  """
  설정 버전. 템플릿·문구 슬롯이 바뀔 때마다 1 오른다.
  """
  revision: Int!
  """
