  height: Int!
  """
  글자색 #RRGGBB(대소문자 무관, 대문자로 저장). 생략하면 수정은 지금 값을 두고, 등록은 #000000.
  """
  textColor: String
  """
  자리 안 글자 정렬. 생략하면 수정은 지금 값을 두고, 등록은 CENTER.
  """
  textAlign: CustomTextAlignType
}

