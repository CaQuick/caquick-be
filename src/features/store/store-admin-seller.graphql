extend type Query {
  """
  판매자 계정 목록을 최신 생성순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminSellers(input: AdminSellerListInput): AdminSellerConnection!
  """
  판매자 계정 1건을 조회한다. SELLER 계정이 아니거나 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminSeller(accountId: ID!): AdminSeller!
}

extend type Mutation {
  """
  판매자를 온보딩한다 — 계정·로그인 자격증명·사업자 프로필·매장을 한 트랜잭션으로 만든다.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  username이 이미 쓰이고 있으면 BAD_USER_INPUT. regionId는 활성 2차 지역(시군구)이어야 하며 아니면 BAD_USER_INPUT.
  생성된 계정은 최초 로그인 시 비밀번호 변경이 강제된다.
  """
  adminCreateSeller(input: AdminCreateSellerInput!): AdminSeller!
  """
  판매자 비밀번호를 초기화한다. 새 비밀번호로 교체하고 모든 로그인 세션을 폐기하며,
  최초 로그인 시 변경이 강제된다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  대상이 SELLER 계정이 아니거나 자격증명이 없으면 NOT_FOUND.
  """
  adminResetSellerPassword(input: AdminResetSellerPasswordInput!): Boolean!
}

"""
판매자 계정. 자격증명·사업자 프로필·매장 요약을 함께 보여준다.
"""
type AdminSeller {
  """
  계정 ID.
  """
  accountId: ID!
  """
  로그인 username. 자격증명이 없는 개발용 계정이면 null.
  """
  username: String
  """
  이메일. 미등록 시 null.
  """
  email: String
  """
  이름. 미등록 시 null.
  """
  name: String
  """
  계정 상태.
  """
  status: AccountStatus!
  """
  초기 비밀번호 상태. true면 본인이 비밀번호를 바꾸기 전까지 판매자 API가 FORBIDDEN이다.
  """
  mustChangePassword: Boolean!
  """
  최근 로그인 시각. 로그인 이력이 없으면 null.
  """
  lastLoginAt: DateTime
  """
  사업자 프로필. 개발용 계정은 없을 수 있다.
  """
  profile: AdminSellerProfile
  """
  보유 매장 요약. 매장이 없거나 삭제됐으면 null.
  """
  store: AdminSellerStoreSummary
  createdAt: DateTime!
}

"""
판매자 사업자 프로필.
"""
type AdminSellerProfile {
  """
  상호.
  """
  businessName: String!
  """
  사업자 연락처.
  """
  businessPhone: String!
  """
  홈페이지·SNS URL. 미등록 시 null.
  """
  websiteUrl: String
}

"""
판매자 매장 요약. 상세는 매장 관리 API에서 본다.
"""
type AdminSellerStoreSummary {
  id: ID!
  """
  매장명.
  """
  storeName: String!
  """
  매장 대표 연락처.
  """
  storePhone: String!
  """
  전체 주소 문자열.
  """
  addressFull: String!
  """
  매장 노출 여부.
  """
  isActive: Boolean!
}

"""
판매자 계정 목록 페이지. 최신 생성이 먼저 온다.
"""
type AdminSellerConnection {
  """
  판매자 계정. 최신 생성이 먼저 온다.
  """
  items: [AdminSeller!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
판매자 목록 조회 조건.
"""
input AdminSellerListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다.
  """
  cursor: String
  """
  username·이메일·이름·매장명 부분일치 검색어. 최대 100자. 미지정 시 전체.
  """
  keyword: String
  """
  계정 상태 필터. 미지정 시 전체.
  """
  status: AccountStatus
}

"""
판매자 온보딩 입력. 계정·자격증명·사업자 프로필·매장을 한 번에 만든다.
"""
input AdminCreateSellerInput {
  """
  로그인 username. 4~80자, 소문자·숫자·`.`·`_`·`-`만 허용. 이미 쓰이고 있으면 BAD_USER_INPUT.
  """
  username: String!
  """
  초기 비밀번호. 8~64자에 대문자·소문자·숫자·특수문자를 각각 1개 이상 포함. 최초 로그인 시 변경이 강제된다.
  """
  password: String!
  """
  계정 이메일. 선택.
  """
  email: String
  """
  계정 이름(운영자명). 선택.
  """
  name: String
  """
  상호.
  """
  businessName: String!
  """
  사업자 연락처.
  """
  businessPhone: String!
  """
  홈페이지·SNS URL. 선택.
  """
  websiteUrl: String
  """
  매장 기본 정보.
  """
  store: AdminCreateSellerStoreInput!
}

"""
온보딩 시 만들 매장 기본 정보. 영업시간·픽업 정책은 판매자가 이후 직접 설정한다.
"""
input AdminCreateSellerStoreInput {
  """
  매장명.
  """
  storeName: String!
  """
  매장 대표 연락처.
  """
  storePhone: String!
  """
  전체 주소 문자열.
  """
  addressFull: String!
  """
  시·도 단위. 선택.
  """
  addressCity: String
  """
  시·군·구 단위. 선택.
  """
  addressDistrict: String
  """
  읍·면·동 단위. 선택.
  """
  addressNeighborhood: String
  """
  지역 필터용 2차 지역(시군구) ID. 활성 2차 지역이 아니면 BAD_USER_INPUT. 선택.
  """
  regionId: ID
  """
  위도. 정밀도 손실을 피하려고 문자열로 받는다. 선택.
  """
  latitude: String
  """
  경도. 정밀도 손실을 피하려고 문자열로 받는다. 선택.
  """
  longitude: String
  """
  지도 진입에 쓸 provider. 기본 NONE.
  """
  mapProvider: StoreMapProvider = NONE
}

"""
판매자 비밀번호 초기화 입력.
"""
input AdminResetSellerPasswordInput {
  """
  대상 판매자 계정 ID.
  """
  accountId: ID!
  """
  새 비밀번호. 8~64자에 대문자·소문자·숫자·특수문자를 각각 1개 이상 포함.
  """
  newPassword: String!
}
