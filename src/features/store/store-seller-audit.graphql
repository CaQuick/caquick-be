extend type Query {
  """
  내 매장 감사 로그 목록을 조회한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND.
  """
  sellerAuditLogs(input: SellerAuditLogListInput): SellerAuditLogConnection!
}

"""
감사 로그가 가리키는 대상 종류.
"""
enum SellerAuditTargetType {
  """
  매장 정보·영업시간·픽업 정책·FAQ 등 매장 단위 설정과 콘텐츠.
  """
  STORE
  """
  상품과 그 하위(이미지·옵션·커스텀 템플릿).
  """
  PRODUCT
  """
  주문. 상태 변경만 기록된다.
  """
  ORDER
  """
  구매자 문의 대화.
  """
  CONVERSATION
  """
  판매자 비밀번호 변경. targetId에는 비밀번호를 바꾼 판매자 본인의 계정 ID가 들어간다.
  """
  CHANGE_PASSWORD
}

"""
감사 로그에 기록된 행위 종류.
"""
enum SellerAuditActionType {
  """
  생성.
  """
  CREATE
  """
  수정.
  """
  UPDATE
  """
  삭제(soft-delete 포함).
  """
  DELETE
  """
  상태 전이. 주문 상태 변경과 전용 활성화 뮤테이션(sellerSetProductActive·sellerSetProductCustomTemplateActive)만 해당한다. 일반 수정 안의 isActive 변경은 UPDATE로 기록된다.
  """
  STATUS_CHANGE
}

"""
판매자 조작 감사 로그 1건. 매장 설정·상품·주문 변경 이력을 남긴다.
로그는 누적만 되고 수정·삭제되지 않는다.
"""
type SellerAuditLog {
  id: ID!
  """
  조작한 계정 ID.
  """
  actorAccountId: ID!
  """
  대상 매장 ID. 판매자가 매장을 보유하면 채워지고, 보유하지 않은 상태의 조작에서만 null이다.
  """
  storeId: ID
  """
  조작 대상 종류.
  """
  targetType: SellerAuditTargetType!
  """
  대상 리소스 ID.
  """
  targetId: ID!
  """
  기록된 행위 종류.
  """
  action: SellerAuditActionType!
  """
  변경 전 값(JSON 문자열). 생성 조작이면 null.
  """
  beforeJson: String
  """
  변경 후 값(JSON 문자열). 삭제 조작이면 null일 수 있다.
  """
  afterJson: String
  """
  요청 IP. 수집하지 못했으면 null.
  """
  ipAddress: String
  """
  요청 User-Agent. 수집하지 못했으면 null.
  """
  userAgent: String
  """
  기록 시각.
  """
  createdAt: DateTime!
}

"""
감사 로그 목록 페이지. 최신 기록이 먼저 온다.
"""
type SellerAuditLogConnection {
  """
  감사 로그. 최신 기록이 먼저 온다.
  """
  items: [SellerAuditLog!]!
  """
  조건에 맞는 전체 건수.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
감사 로그 조회 조건.
"""
input SellerAuditLogListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다.
  """
  cursor: String
  """
  대상 종류 필터. 미지정 시 전체.
  """
  targetType: SellerAuditTargetType
}
