extend type Query {
  """월별 픽업 가능 날짜 (홈 전역 정책 기준). yearMonth: "YYYY-MM" """
  pickupCalendar(
    """대상 연월. "YYYY-MM" 형식(KST 기준). 예: "2026-09". 형식이 어긋나면 BAD_USER_INPUT."""
    yearMonth: String!
  ): PickupCalendar!
  """선택 날짜의 픽업 시간 슬롯. date: "YYYY-MM-DD" """
  pickupTimeSlots(
    """대상 날짜. "YYYY-MM-DD" 형식(KST 기준). 예: "2026-09-10". 형식이 어긋나면 BAD_USER_INPUT."""
    date: String!
  ): PickupTimeSlots!
}

"""
월별 픽업 달력. 요청한 연월의 모든 날짜가 담긴다.
전역(`pickupCalendar`)과 매장별(`storePickupCalendar`)이 같은 형태를 공유한다 —
다른 것은 판정 근거이지 응답 모양이 아니다.
"""
type PickupCalendar {
  """요청한 연월. "YYYY-MM"."""
  yearMonth: String!
  """해당 월의 전 날짜. 선택 불가한 날도 사유와 함께 포함된다."""
  days: [PickupDay!]!
}

"""달력의 하루."""
type PickupDay {
  """날짜. "YYYY-MM-DD" (KST)."""
  date: String!
  """픽업 예약 가능 여부."""
  selectable: Boolean!
  """
선택 불가 사유(선택 가능 시 null).
PAST | OUT_OF_RANGE | CLOSED(휴무·영업요일 아님·당일 잔여 슬롯 없음) | CAPACITY_FULL.
전역 달력은 매장 재고 개념이 없어 CAPACITY_FULL을 쓰지 않는다.
"""
  reason: String
}

"""선택 날짜의 픽업 시간 슬롯. 오전·오후로 나눠 내려준다."""
type PickupTimeSlots {
  """요청한 날짜. "YYYY-MM-DD" (KST)."""
  date: String!
  """오전 슬롯. 12:00 이전(12:00은 afternoon에 들어간다)."""
  morning: [PickupSlot!]!
  """오후 슬롯. 12:00 포함, 이후."""
  afternoon: [PickupSlot!]!
}

"""
픽업 시간 슬롯 1칸.
전역 조회는 고정 정책(10:00~20:00, 30분 간격)을, 매장별 조회는 그 매장의
pickupSlotIntervalMinutes·영업시간·리드타임·잔여 수량을 반영한다.
"""
type PickupSlot {
  """슬롯 시각. "HH:mm" (KST)."""
  time: String!
  """예약 가능 여부. 리드타임을 지났거나 예약 범위를 벗어나면 false."""
  available: Boolean!
}
