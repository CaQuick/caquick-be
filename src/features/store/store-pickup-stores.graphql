extend type Query {
  """매장 선택(메인 검색 결과). 픽업 날짜·시간에 예약 가능한 매장을 요청한 정렬로 돌려준다. 비로그인 접근 가능."""
  pickupStores(input: PickupStoresInput!): PickupStoreConnection!
}

"""매장 선택 조회 조건. 커서가 아니라 오프셋 방식이다."""
input PickupStoresInput {
  """픽업 날짜. "YYYY-MM-DD"(KST). 형식이 어긋나면 INVALID_DATE, 오늘보다 앞서면 PICKUP_DATE_PAST."""
  date: String!
  """픽업 시각. "HH:mm"(KST). 그 슬롯이 예약 가능한 매장만 남긴다. 생략·null이면 그날 예약 가능한 슬롯이 하나라도 있는 매장. 형식이 어긋나면 INVALID_TIME_VALUE."""
  time: String
  """2차 시군구 ID 다중 선택. 비우면 전국 대상."""
  regionIds: [ID!]
  """정렬 기준. 기본 인기순."""
  sort: StoreSort = POPULAR
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """조회 개수(최대 50)."""
  limit: Int = 20
}

"""매장 선택 결과 목록."""
type PickupStoreConnection {
  """매장 항목. 요청한 sort 순서로 온다."""
  items: [PickupStoreItem!]!
  """조건에 맞는 전체 매장 수."""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
  """
  선택한 지역들의 중심 좌표를 모두 담는 범위(지도 카메라용). 매장이 0건이어도 온다. 지역이 하나면 한 점(south=north, west=east)이다.
  regionIds를 비웠거나(전국) 좌표가 등록된 2차 지역이 없으면 null.
  """
  regionBounds: MapBounds
}

"""지도 범위(WGS84)."""
type MapBounds {
  """남쪽 끝 위도."""
  south: Float!
  """서쪽 끝 경도."""
  west: Float!
  """북쪽 끝 위도."""
  north: Float!
  """동쪽 끝 경도."""
  east: Float!
}

"""매장 선택 항목. 매장 카드와 지도 마커 좌표."""
type PickupStoreItem {
  """매장 카드."""
  store: StoreCard!
  """위도(지도 마커). 미설정 시 null."""
  latitude: Float
  """경도(지도 마커). 미설정 시 null."""
  longitude: Float
}
