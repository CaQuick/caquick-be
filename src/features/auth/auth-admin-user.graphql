extend type Query {
  """
  구매자(USER) 계정 목록을 최신 가입순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminUsers(input: AdminUserListInput): AdminUserConnection!
  """
  구매자 계정 1건을 조회한다. USER 계정이 아니거나 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminUser(accountId: ID!): AdminUser!
}

extend type Mutation {
  """
  계정을 정지한다(USER·SELLER). 정지되면 모든 API 접근이 FORBIDDEN이 되고 refresh 세션이 전부 폐기된다.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN. 대상이 ADMIN 계정이거나 본인이면 FORBIDDEN,
  탈퇴·미존재 계정이면 NOT_FOUND. 이미 정지된 계정이면 그대로 반환한다(멱등, 감사 기록 없음).
  """
  adminSuspendAccount(
    input: AdminSuspendAccountInput!
  ): AdminAccountStatusResult!
  """
  정지된 계정을 복구한다(USER·SELLER). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  대상이 ADMIN 계정이면 FORBIDDEN, 탈퇴·미존재 계정이면 NOT_FOUND. 이미 ACTIVE면 그대로 반환한다(멱등).
  """
  adminReinstateAccount(accountId: ID!): AdminAccountStatusResult!
}

"""
구매자 계정. 프로필·연동 소셜·활동 집계를 함께 보여준다.
"""
type AdminUser {
  """
  계정 ID.
  """
  accountId: ID!
  """
  이메일. 미등록 시 null.
  """
  email: String
  """
  이름. 미등록 시 null.
  """
  name: String
  """
  계정 상태.
  """
  status: AccountStatus!
  """
  닉네임. 프로필이 없으면 null.
  """
  nickname: String
  """
  전화번호. 미등록 시 null.
  """
  phoneNumber: String
  """
  온보딩 완료 여부.
  """
  onboardingCompleted: Boolean!
  """
  연동된 소셜 로그인 provider 목록(soft-delete 제외).
  """
  identityProviders: [IdentityProvider!]!
  """
  주문 수(삭제 제외).
  """
  orderCount: Int!
  """
  리뷰 수(삭제 제외).
  """
  reviewCount: Int!
  """
  가입 시각.
  """
  createdAt: DateTime!
}

"""
구매자 계정 목록 페이지. 최신 가입이 먼저 온다.
"""
type AdminUserConnection {
  """
  구매자 계정. 최신 가입이 먼저 온다.
  """
  items: [AdminUser!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
구매자 목록 조회 조건.
"""
input AdminUserListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다.
  """
  cursor: String
  """
  닉네임·이메일·이름 부분일치 검색어. 최대 100자. 미지정 시 전체.
  """
  keyword: String
  """
  계정 상태 필터. 미지정 시 전체.
  """
  status: AccountStatus
}

"""
계정 정지 입력.
"""
input AdminSuspendAccountInput {
  """
  대상 계정 ID(USER 또는 SELLER).
  """
  accountId: ID!
  """
  정지 사유. 감사 로그에 기록된다. 최대 500자.
  """
  reason: String!
}

"""
계정 상태 변경 결과.
"""
type AdminAccountStatusResult {
  """
  대상 계정 ID.
  """
  accountId: ID!
  """
  대상 계정 종류.
  """
  accountType: AccountType!
  """
  변경 후 상태.
  """
  status: AccountStatus!
}
