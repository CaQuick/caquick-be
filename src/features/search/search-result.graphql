extend type Query {
  """
  검색 결과 '전체' 탭 카운트(상품/매장). 필터·정렬 없이 키워드(+지역)만 반영하며, keyword를 생략하면 지역만 반영한다. '전체 N'은 FE가 합산. 비로그인 접근 가능.
  """
  searchSummary(input: SearchSummaryInput!): SearchSummary!
}

"""
검색 결과 탭 카운트 조회 조건.
"""
input SearchSummaryInput {
  """
  검색어. 규칙은 SearchProductsInput.keyword와 같다(생략·null이면 검색어 조건 없음, 빈 문자열·공백은 400).
  """
  keyword: String
  """
  2차 시군구 ID 다중 선택. 비우면 전국 대상.
  """
  regionIds: [ID!]
}

"""
검색 결과 탭 카운트. '전체 N'은 두 값을 FE가 합산한다.
"""
type SearchSummary {
  """
  조건에 맞는 상품 수.
  """
  productCount: Int!
  """
  조건에 맞는 매장 수.
  """
  storeCount: Int!
}
