extend type Query {
  """1차 광역 지역 목록 (전국 포함)"""
  regionGroups: [RegionGroup!]!
  """특정 1차 지역의 2차 시군구 목록"""
  regions(parentId: ID!): [Region!]!
  """지역명 자동검색 (1·2차 모두 대상)"""
  searchRegions(input: SearchRegionsInput!): [RegionSearchResult!]!
  """
  현재 위치가 속한 2차 지역과 그 상위 1차 지역. 비로그인 허용. 선택 가능한 지역이 없으면 null(서비스 지역 밖·바다·해외 포함).
  위치 변환(카카오)이 실패하면 LOCATION_LOOKUP_UNAVAILABLE, IP당 분당 30회를 넘으면 RATE_LIMITED. 좌표는 저장하지 않고 이용 사실만 기록한다.
  """
  regionByLocation(input: RegionByLocationInput!): RegionByLocation
}

"""현재 위치(WGS84)."""
input RegionByLocationInput {
  """위도. -90~90."""
  latitude: Float!
  """경도. -180~180."""
  longitude: Float!
}

"""현재 위치가 속한 지역."""
type RegionByLocation {
  """상위 1차 지역."""
  group: RegionGroup!
  """현재 위치가 속한 2차 시군구."""
  region: Region!
}

"""지역 자동검색 입력."""
input SearchRegionsInput {
  """검색어. 1·2차 지역명 모두를 대상으로 부분일치 검색한다."""
  keyword: String!
  """한 번에 가져올 개수. 기본 20, 1~50만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
}

"""1차 광역 지역 (예: 서울 북부, 인천)"""
type RegionGroup {
  id: ID!
  """화면에 노출되는 1차 지역명."""
  name: String!
  """URL·쿼리에 쓰는 영문 식별자."""
  slug: String!
  """하위 2차 지역 보유 여부 (전국 등은 false)"""
  hasChildren: Boolean!
}

"""2차 시군구 지역 (예: 강남구, 수원시영통구)"""
type Region {
  id: ID!
  """상위 1차 지역 ID. 최상위면 null."""
  parentId: ID
  """화면에 노출되는 2차 지역명."""
  name: String!
  """URL·쿼리에 쓰는 영문 식별자."""
  slug: String!
  """지역 계층 깊이. 1=광역, 2=시군구."""
  level: Int!
}

"""지역 검색 결과. 동명 시군구 구분을 위해 상위 지역명을 동반."""
type RegionSearchResult {
  id: ID!
  """매칭된 지역명."""
  name: String!
  """상위 1차 지역명. 동명 시군구를 구분하는 용도이며 1차 지역이면 null."""
  parentName: String
  """지역 계층 깊이. 1=광역, 2=시군구."""
  level: Int!
}
