extend type Query {
  """내 관리자 계정을 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminMe: AdminAccount!
  """관리자 계정 목록을 최신 생성순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminAdmins(input: CursorInput): AdminAccountConnection!
}

extend type Mutation {
  """
  관리자 계정을 추가한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  username이 이미 쓰이고 있으면 BAD_USER_INPUT. 생성된 계정은 최초 로그인 시 비밀번호 변경이 강제된다.
  """
  adminCreateAdmin(input: AdminCreateAdminInput!): AdminAccount!
}

"""관리자 계정. 로그인 자격증명(username)과 계정 상태를 함께 보여준다."""
type AdminAccount {
  """계정 ID."""
  accountId: ID!
  """로그인 username. 자격증명이 없는 개발용 계정이면 null."""
  username: String
  """이메일. 미등록 시 null."""
  email: String
  """이름. 미등록 시 null."""
  name: String
  """계정 상태."""
  status: AccountStatus!
  """초기 비밀번호 상태. true면 본인이 비밀번호를 바꾸기 전까지 관리자 API가 FORBIDDEN이다."""
  mustChangePassword: Boolean!
  """최근 로그인 시각. 로그인 이력이 없으면 null."""
  lastLoginAt: DateTime
  createdAt: DateTime!
}

"""관리자 계정 목록 페이지. 최신 생성이 먼저 온다."""
type AdminAccountConnection {
  """관리자 계정. 최신 생성이 먼저 온다."""
  items: [AdminAccount!]!
  """전체 관리자 수(현재 페이지와 무관)."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: String
}

"""관리자 계정 생성 입력."""
input AdminCreateAdminInput {
  """로그인 username. 4~80자, 소문자·숫자·`.`·`_`·`-`만 허용. 이미 쓰이고 있으면 BAD_USER_INPUT."""
  username: String!
  """초기 비밀번호. 8~64자에 대문자·소문자·숫자·특수문자를 각각 1개 이상 포함해야 한다. 최초 로그인 시 변경이 강제된다."""
  password: String!
  """이메일. 선택."""
  email: String
  """이름. 선택."""
  name: String
}
