extend type Query {
  """매장 목록을 최신 등록순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminStores(input: AdminStoreListInput): AdminStoreConnection!
  """매장 1건을 판매자 계정·집계와 함께 조회한다. 없거나 삭제됐으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminStore(storeId: ID!): AdminStoreDetail!
}

extend type Mutation {
  """
  매장 노출 여부를 바꾼다. false면 구매자 화면에서 사라진다(판매자 API로는 바꿀 수 없는 값).
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN. 매장이 없으면 NOT_FOUND. 같은 값이면 그대로 반환한다(멱등, 감사 기록 없음).
  """
  adminSetStoreActive(input: AdminSetStoreActiveInput!): AdminStore!
  """
  매장 기본 정보를 대리 수정한다. 전달한 필드만 바뀌며 규칙은 판매자의 sellerUpdateStoreBasicInfo와 같다.
  regionId는 활성 2차 지역만 허용(아니면 BAD_USER_INPUT), null이면 연결 해제.
  storeName·storePhone·addressFull·mapProvider는 null을 보낼 수 없다(BAD_USER_INPUT) — 생략만 가능.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN. 매장이 없으면 NOT_FOUND.
  """
  adminUpdateStoreBasicInfo(input: AdminUpdateStoreBasicInfoInput!): AdminStore!
}

"""매장. 판매자의 SellerStore와 같은 원본을 관리자 시점으로 본 것이다."""
type AdminStore {
  id: ID!
  """이 매장을 소유한 판매자 계정 ID."""
  sellerAccountId: ID!
  """매장명."""
  storeName: String!
  """매장 대표 연락처."""
  storePhone: String!
  """전체 주소 문자열."""
  addressFull: String!
  """시·도 단위. 매핑되지 않았으면 null."""
  addressCity: String
  """시·군·구 단위. 매핑되지 않았으면 null."""
  addressDistrict: String
  """읍·면·동 단위. 매핑되지 않았으면 null."""
  addressNeighborhood: String
  """지역 필터용 2차 지역 ID. 미연결이면 null."""
  regionId: ID
  """위도. 정밀도 손실을 피하려고 문자열로 내려준다. 좌표 미등록 시 null."""
  latitude: String
  """경도. 정밀도 손실을 피하려고 문자열로 내려준다. 좌표 미등록 시 null."""
  longitude: String
  """지도 진입에 쓸 provider."""
  mapProvider: StoreMapProvider!
  """매장 홈페이지·SNS URL. 미등록 시 null."""
  websiteUrl: String
  """영업시간 안내 문구(자유 입력)."""
  businessHoursText: String
  """매장 프로필(로고) 이미지 URL. 미등록 시 null."""
  profileImageUrl: String
  """문의 채팅 인사말 템플릿. null이면 기본 문구."""
  greetingMessage: String
  """픽업 예약 시간 슬롯 간격(분)."""
  pickupSlotIntervalMinutes: Int!
  """최소 리드타임(분)."""
  minLeadTimeMinutes: Int!
  """예약 가능 범위(일)."""
  maxDaysAhead: Int!
  """매장 노출 여부. false면 구매자 화면에 나오지 않는다."""
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""매장 상세. 소유 판매자 계정 요약과 집계를 함께 준다."""
type AdminStoreDetail {
  """매장."""
  store: AdminStore!
  """소유 판매자 계정 요약."""
  seller: AdminStoreSeller!
  """상품 수(삭제 제외)."""
  productCount: Int!
  """주문 항목 수(삭제 제외)."""
  orderItemCount: Int!
}

"""매장 소유 판매자 요약."""
type AdminStoreSeller {
  """계정 ID."""
  accountId: ID!
  """로그인 username. 자격증명이 없으면 null."""
  username: String
  """이메일. 미등록 시 null."""
  email: String
  """이름. 미등록 시 null."""
  name: String
  """계정 상태."""
  status: AccountStatus!
}

"""매장 목록 페이지. 최신 등록이 먼저 온다."""
type AdminStoreConnection {
  """매장. 최신 등록이 먼저 온다."""
  items: [AdminStore!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: String
}

"""매장 목록 조회 조건."""
input AdminStoreListInput {
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: String
  """매장명 부분일치 검색어. 최대 100자. 미지정 시 전체."""
  keyword: String
  """노출 여부 필터. 미지정 시 전체."""
  isActive: Boolean
  """2차 지역 ID 필터. 미지정 시 전체."""
  regionId: ID
}

"""매장 노출 여부 변경 입력."""
input AdminSetStoreActiveInput {
  storeId: ID!
  """노출 여부."""
  isActive: Boolean!
  """변경 사유. 감사 로그에 기록된다. 최대 500자. 선택."""
  reason: String
}

"""매장 기본 정보 대리 수정 입력. 전달한 필드만 변경된다(부분 수정)."""
input AdminUpdateStoreBasicInfoInput {
  storeId: ID!
  """매장명."""
  storeName: String
  """매장 대표 연락처."""
  storePhone: String
  """전체 주소 문자열."""
  addressFull: String
  """시·도 단위. null이면 제거."""
  addressCity: String
  """시·군·구 단위. null이면 제거."""
  addressDistrict: String
  """읍·면·동 단위. null이면 제거."""
  addressNeighborhood: String
  """지역 필터용 2차 지역 ID. 활성 2차 지역만 허용, null이면 연결 해제."""
  regionId: ID
  """위도(문자열). null이면 제거."""
  latitude: String
  """경도(문자열). null이면 제거."""
  longitude: String
  """지도 진입에 쓸 provider."""
  mapProvider: StoreMapProvider
  """매장 홈페이지·SNS URL. null이면 제거."""
  websiteUrl: String
  """영업시간 안내 문구. null이면 제거."""
  businessHoursText: String
  """매장 프로필(로고) 이미지 URL. null이면 제거. adminCreateUploadUrl(STORE_IMAGE)로 이 계정에 발급된 publicUrl만 허용, 아니면 BAD_USER_INPUT."""
  profileImageUrl: String
  """문의 채팅 인사말 템플릿. null이면 기본 문구로 되돌린다."""
  greetingMessage: String
}
