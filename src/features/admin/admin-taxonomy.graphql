extend type Query {
  """카테고리 마스터 목록을 type·sortOrder·id 순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminCategories(input: AdminCategoryListInput): [AdminCategory!]!
  """태그 마스터 목록을 최신 생성순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminTags(input: AdminTagListInput): AdminTagConnection!
}

extend type Mutation {
  """
  카테고리를 만든다. 같은 type에 같은 이름이 있으면 BAD_USER_INPUT.
  삭제된 같은 이름이 있으면 새로 만들지 않고 복구한다(상품 연결은 복구하지 않는다).
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminCreateCategory(input: AdminCreateCategoryInput!): AdminCategory!
  """카테고리를 수정한다. 전달한 필드만 바뀐다. type은 바꿀 수 없다. 이름 충돌이면 BAD_USER_INPUT, 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminUpdateCategory(input: AdminUpdateCategoryInput!): AdminCategory!
  """카테고리를 삭제(soft-delete)하고 상품 연결도 함께 끊는다. 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminDeleteCategory(categoryId: ID!): Boolean!
  """
  태그를 만든다. 같은 이름이 있으면 BAD_USER_INPUT. 삭제된 같은 이름이 있으면 복구한다(상품 연결은 복구하지 않는다).
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminCreateTag(input: AdminCreateTagInput!): AdminTag!
  """태그 이름을 바꾼다. 충돌이면 BAD_USER_INPUT, 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminUpdateTag(input: AdminUpdateTagInput!): AdminTag!
  """태그를 삭제(soft-delete)하고 상품 연결도 함께 끊는다. 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminDeleteTag(tagId: ID!): Boolean!
}

"""카테고리 마스터. 판매자는 여기 있는 것 중에서만 상품에 연결할 수 있다."""
type AdminCategory {
  id: ID!
  """카테고리 종류(EVENT·STYLE·OTHER). 홈 칩·랭킹은 EVENT만 쓴다."""
  categoryType: CategoryType!
  """이름. 같은 종류 안에서 유일."""
  name: String!
  """설명. 미등록 시 null."""
  description: String
  """노출 순서. 오름차순."""
  sortOrder: Int!
  """노출 여부. false면 구매자 카테고리 목록에 나오지 않는다."""
  isActive: Boolean!
  """연결된 상품 수(삭제 연결 제외)."""
  productCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""태그 마스터. 판매자는 여기 있는 것 중에서만 상품에 연결할 수 있다."""
type AdminTag {
  id: ID!
  """이름. 전역 유일."""
  name: String!
  """연결된 상품 수(삭제 연결 제외)."""
  productCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""태그 목록 페이지. 최신 생성이 먼저 온다."""
type AdminTagConnection {
  """태그. 최신 생성이 먼저 온다."""
  items: [AdminTag!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: String
}

"""카테고리 목록 조회 조건."""
input AdminCategoryListInput {
  """종류 필터. 미지정 시 전체."""
  categoryType: CategoryType
  """비활성 포함 여부. 기본 false."""
  includeInactive: Boolean = false
}

"""태그 목록 조회 조건."""
input AdminTagListInput {
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: String
  """이름 부분일치 검색어. 최대 100자. 미지정 시 전체."""
  keyword: String
}

"""카테고리 생성 입력."""
input AdminCreateCategoryInput {
  """종류."""
  categoryType: CategoryType!
  """이름. 1~100자, 같은 종류 안에서 유일."""
  name: String!
  """설명. 최대 255자. 선택."""
  description: String
  """노출 순서. 미지정 시 0."""
  sortOrder: Int
  """노출 여부. 기본 true."""
  isActive: Boolean = true
}

"""카테고리 수정 입력. 전달한 필드만 변경된다."""
input AdminUpdateCategoryInput {
  categoryId: ID!
  """이름. 1~100자."""
  name: String
  """설명. null이면 제거."""
  description: String
  """노출 순서."""
  sortOrder: Int
  """노출 여부."""
  isActive: Boolean
}

"""태그 생성 입력."""
input AdminCreateTagInput {
  """이름. 1~80자, 전역 유일."""
  name: String!
}

"""태그 수정 입력."""
input AdminUpdateTagInput {
  tagId: ID!
  """이름. 1~80자, 전역 유일."""
  name: String!
}
