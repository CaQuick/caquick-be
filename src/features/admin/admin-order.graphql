extend type Query {
  """주문 목록을 최신순으로 조회한다(전 매장). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminOrders(input: AdminOrderListInput): AdminOrderConnection!
  """주문 상세를 전체 품목·구매자 요약·상태 이력과 함께 조회한다. 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminOrder(orderId: ID!): AdminOrderDetail!
}

extend type Mutation {
  """
  주문을 강제 취소한다. 전이 규칙은 판매자 취소와 같다 — SUBMITTED·CONFIRMED·MADE에서만 가능하고
  PICKED_UP·CANCELED면 BAD_USER_INPUT. 사유(note)는 필수이며 상태 이력에 '[관리자]' 접두로 기록된다.
  구매자에게 ORDER_CANCELED 알림이 간다. 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminCancelOrder(input: AdminCancelOrderInput!): AdminOrderSummary!
}

"""주문 요약(관리자 시점). 매장 ID는 첫 품목 기준이다(주문은 단일 매장 구조)."""
type AdminOrderSummary {
  id: ID!
  """주문번호."""
  orderNumber: String!
  """구매자 계정 ID."""
  accountId: ID!
  """주문 품목이 속한 매장 ID. 품목이 없으면 null."""
  storeId: ID
  """현재 주문 상태."""
  status: OrderStatusType!
  """픽업 예정 일시."""
  pickupAt: DateTime!
  """주문자 이름."""
  buyerName: String!
  """주문자 연락처."""
  buyerPhone: String!
  """최종 결제 금액(원)."""
  totalPrice: Int!
  """주문 생성 시각."""
  createdAt: DateTime!
}

"""주문 목록 페이지. 최신 주문이 먼저 온다."""
type AdminOrderConnection {
  """주문. 최신 주문이 먼저 온다."""
  items: [AdminOrderSummary!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: String
}

"""주문한 구매자 요약."""
type AdminOrderBuyer {
  """계정 ID."""
  accountId: ID!
  """이메일. 미등록 시 null."""
  email: String
  """닉네임. 탈퇴(프로필 삭제)면 null."""
  nickname: String
  """계정 상태."""
  status: AccountStatus!
}

"""주문 상태 변경 이력 1건. 최신 변경이 먼저 온다."""
type AdminOrderStatusHistory {
  id: ID!
  """변경 전 상태. 최초 생성 이력은 null."""
  fromStatus: OrderStatusType
  """변경 후 상태."""
  toStatus: OrderStatusType!
  """변경 시각."""
  changedAt: DateTime!
  """변경 사유 메모. 관리자 취소는 '[관리자]' 접두."""
  note: String
}

"""주문 품목 옵션 스냅샷."""
type AdminOrderItemOptionSnapshot {
  id: ID!
  """옵션 그룹명(주문 당시)."""
  groupNameSnapshot: String!
  """옵션명(주문 당시)."""
  optionTitleSnapshot: String!
  """옵션 추가금(원, 주문 당시)."""
  optionPriceDeltaSnapshot: Int!
}

"""주문 품목 커스텀 문구 스냅샷."""
type AdminOrderItemCustomTextSnapshot {
  id: ID!
  """문구 슬롯 키(주문 당시)."""
  tokenKeySnapshot: String!
  """슬롯 기본 문구(주문 당시)."""
  defaultTextSnapshot: String!
  """구매자가 입력한 문구."""
  valueText: String!
  """표시 순서."""
  sortOrder: Int!
}

"""자유 편집 첨부."""
type AdminOrderItemCustomFreeEditAttachment {
  id: ID!
  """첨부 이미지 URL."""
  imageUrl: String!
  """표시 순서."""
  sortOrder: Int!
}

"""주문 품목 자유 편집 요청 스냅샷."""
type AdminOrderItemCustomFreeEditSnapshot {
  id: ID!
  """편집 대상 크롭 이미지 URL."""
  cropImageUrl: String!
  """요청 설명."""
  descriptionText: String!
  """표시 순서."""
  sortOrder: Int!
  """첨부 이미지."""
  attachments: [AdminOrderItemCustomFreeEditAttachment!]!
}

"""주문 품목 1건. 가격·옵션은 전부 주문 당시 스냅샷이다."""
type AdminOrderItemDetail {
  id: ID!
  storeId: ID!
  productId: ID!
  """상품명(주문 당시)."""
  productNameSnapshot: String!
  """정가(원, 주문 당시)."""
  regularPriceSnapshot: Int!
  """할인가(원, 주문 당시). 없었으면 null."""
  salePriceSnapshot: Int
  """주문 수량."""
  quantity: Int!
  """품목 합계 금액(원)."""
  itemSubtotalPrice: Int!
  """선택된 옵션(주문 당시 스냅샷)."""
  optionItems: [AdminOrderItemOptionSnapshot!]!
  """입력된 커스텀 문구(주문 당시 스냅샷)."""
  customTexts: [AdminOrderItemCustomTextSnapshot!]!
  """자유 편집 요청(주문 당시 스냅샷)."""
  freeEdits: [AdminOrderItemCustomFreeEditSnapshot!]!
}

"""주문 상세(관리자 시점). 모든 품목이 담긴다."""
type AdminOrderDetail {
  id: ID!
  """주문번호."""
  orderNumber: String!
  """구매자 요약."""
  buyer: AdminOrderBuyer!
  """현재 주문 상태."""
  status: OrderStatusType!
  """픽업 예정 일시."""
  pickupAt: DateTime!
  """주문자 이름."""
  buyerName: String!
  """주문자 연락처."""
  buyerPhone: String!
  """할인 전 품목 합계(원)."""
  subtotalPrice: Int!
  """할인 금액(원)."""
  discountPrice: Int!
  """최종 결제 금액(원)."""
  totalPrice: Int!
  """SUBMITTED 도달 시각."""
  submittedAt: DateTime
  """CONFIRMED 도달 시각. 미도달 시 null."""
  confirmedAt: DateTime
  """MADE 도달 시각. 미도달 시 null."""
  madeAt: DateTime
  """PICKED_UP 도달 시각. 미도달 시 null."""
  pickedUpAt: DateTime
  """CANCELED 도달 시각. 취소되지 않았으면 null."""
  canceledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  """주문 품목 전체."""
  items: [AdminOrderItemDetail!]!
  """상태 변경 이력. 최신순."""
  statusHistories: [AdminOrderStatusHistory!]!
}

"""주문 목록 조회 조건. 모든 필터는 AND로 결합된다."""
input AdminOrderListInput {
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: String
  """주문번호·주문자 이름·연락처 부분일치 검색. 최대 100자."""
  keyword: String
  """주문 상태 필터. 미지정 시 전체."""
  status: OrderStatusType
  """매장 ID 필터(품목 기준). 미지정 시 전체."""
  storeId: ID
  """구매자 계정 ID 필터. 미지정 시 전체."""
  accountId: ID
  """주문 생성 시각 하한(이상)."""
  fromCreatedAt: DateTime
  """주문 생성 시각 상한(이하)."""
  toCreatedAt: DateTime
}

"""주문 강제 취소 입력."""
input AdminCancelOrderInput {
  orderId: ID!
  """취소 사유. 필수. 최대 494자('[관리자] ' 접두를 붙여 500자 이내로 이력에 남는다). 감사 로그에도 기록된다."""
  note: String!
}
