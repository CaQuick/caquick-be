extend type Query {
  """리뷰·댓글 신고 목록을 최신 접수순으로 조회한다. 기본은 PENDING만. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminReviewReports(input: AdminReviewReportListInput): AdminReviewReportConnection!
  """신고 1건을 대상 원문과 함께 조회한다. 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminReviewReport(reportId: ID!): AdminReviewReportDetail!
  """리뷰 목록을 최신순으로 조회한다(삭제 포함 가능). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminReviews(input: AdminReviewListInput): AdminReviewConnection!
  """리뷰 댓글 목록을 최신순으로 조회한다(삭제 포함 가능). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminReviewComments(input: AdminReviewCommentListInput): AdminReviewCommentConnection!
}

extend type Mutation {
  """
  신고를 처리한다. DELETE_TARGET은 대상(리뷰 또는 댓글)을 삭제하고 같은 대상의 다른 미처리 신고도 함께 RESOLVED로 닫는다.
  REJECT는 이 신고만 REJECTED로 닫는다. 이미 처리된 신고면 BAD_USER_INPUT, 없으면 NOT_FOUND.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminResolveReviewReport(input: AdminResolveReviewReportInput!): AdminReviewReport!
  """
  리뷰를 강제 삭제(soft-delete)한다. 사진·댓글도 함께 내려가고 미처리 신고는 RESOLVED로 닫힌다.
  없거나 이미 삭제됐으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminDeleteReview(input: AdminDeleteReviewInput!): Boolean!
  """
  리뷰 댓글을 강제 삭제(soft-delete)한다. 미처리 신고는 RESOLVED로 닫힌다.
  없거나 이미 삭제됐으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminDeleteReviewComment(input: AdminDeleteReviewCommentInput!): Boolean!
}

"""신고 대상 종류."""
enum AdminReviewReportTargetType {
  """리뷰."""
  REVIEW
  """리뷰 댓글."""
  REVIEW_COMMENT
}

"""신고 처리 방식."""
enum AdminReviewReportAction {
  """대상을 삭제하고 같은 대상의 미처리 신고를 모두 RESOLVED로 닫는다."""
  DELETE_TARGET
  """이 신고만 REJECTED로 닫고 대상은 유지한다."""
  REJECT
}

"""리뷰·댓글 신고 1건."""
type AdminReviewReport {
  id: ID!
  """대상 종류."""
  targetType: AdminReviewReportTargetType!
  """대상 ID(리뷰 또는 댓글)."""
  targetId: ID!
  """신고자 계정 ID."""
  reporterAccountId: ID!
  """신고 사유."""
  reason: ReviewReportReason!
  """상세 설명. 없으면 null."""
  detail: String
  """처리 상태."""
  status: ReviewReportStatus!
  """처리한 관리자 계정 ID. 미처리면 null."""
  resolvedByAccountId: ID
  """처리 시각. 미처리면 null."""
  resolvedAt: DateTime
  """처리 메모. 없으면 null."""
  resolutionNote: String
  """접수 시각."""
  createdAt: DateTime!
}

"""신고 대상 원문 요약."""
type AdminReviewReportTarget {
  """대상 ID."""
  id: ID!
  """댓글이면 소속 리뷰 ID, 리뷰면 null."""
  reviewId: ID
  """작성자 계정 ID."""
  authorAccountId: ID!
  """작성자 닉네임. 탈퇴(프로필 삭제)면 null."""
  authorNickname: String
  """본문. 리뷰는 없을 수 있다."""
  content: String
  """리뷰가 달린 매장 ID."""
  storeId: ID!
  """이미 삭제된 대상이면 true."""
  deleted: Boolean!
}

"""신고 상세."""
type AdminReviewReportDetail {
  """신고."""
  report: AdminReviewReport!
  """대상 원문."""
  target: AdminReviewReportTarget!
}

"""신고 목록 페이지. 최신 접수가 먼저 온다."""
type AdminReviewReportConnection {
  """신고. 최신 접수가 먼저 온다."""
  items: [AdminReviewReport!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: ID
}

"""리뷰(관리자 시점)."""
type AdminReview {
  id: ID!
  """매장 ID."""
  storeId: ID!
  """매장명."""
  storeName: String!
  """상품 ID."""
  productId: ID!
  """작성자 계정 ID."""
  authorAccountId: ID!
  """작성자 닉네임. 탈퇴(프로필 삭제)면 null."""
  authorNickname: String
  """평점. 정밀도 보존을 위해 문자열."""
  rating: String!
  """본문. 없으면 null."""
  content: String
  """댓글 수(삭제 제외)."""
  commentCount: Int!
  """좋아요 수(삭제 제외)."""
  likeCount: Int!
  """삭제된 리뷰면 true."""
  deleted: Boolean!
  """작성 시각."""
  createdAt: DateTime!
}

"""리뷰 목록 페이지. 최신 작성이 먼저 온다."""
type AdminReviewConnection {
  """리뷰. 최신 작성이 먼저 온다."""
  items: [AdminReview!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: ID
}

"""리뷰 댓글(관리자 시점)."""
type AdminReviewComment {
  id: ID!
  """소속 리뷰 ID."""
  reviewId: ID!
  """작성자 계정 ID."""
  authorAccountId: ID!
  """작성자 닉네임. 탈퇴(프로필 삭제)면 null."""
  authorNickname: String
  """본문."""
  content: String!
  """삭제된 댓글이면 true."""
  deleted: Boolean!
  """작성 시각."""
  createdAt: DateTime!
}

"""리뷰 댓글 목록 페이지. 최신 작성이 먼저 온다."""
type AdminReviewCommentConnection {
  """댓글. 최신 작성이 먼저 온다."""
  items: [AdminReviewComment!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: ID
}

"""신고 목록 조회 조건."""
input AdminReviewReportListInput {
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: ID
  """처리 상태 필터. 기본 PENDING. 전체를 보려면 null을 명시한다."""
  status: ReviewReportStatus = PENDING
  """대상 종류 필터. 미지정 시 전체."""
  targetType: AdminReviewReportTargetType
}

"""리뷰 목록 조회 조건."""
input AdminReviewListInput {
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: ID
  """본문 부분일치 검색어. 최대 100자. 미지정 시 전체."""
  keyword: String
  """매장 ID 필터. 미지정 시 전체."""
  storeId: ID
  """작성자 계정 ID 필터. 미지정 시 전체."""
  accountId: ID
  """삭제된 리뷰 포함 여부. 기본 false."""
  includeDeleted: Boolean = false
}

"""리뷰 댓글 목록 조회 조건."""
input AdminReviewCommentListInput {
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: ID
  """소속 리뷰 ID 필터. 미지정 시 전체."""
  reviewId: ID
  """작성자 계정 ID 필터. 미지정 시 전체."""
  accountId: ID
  """삭제된 댓글 포함 여부. 기본 false."""
  includeDeleted: Boolean = false
}

"""신고 처리 입력."""
input AdminResolveReviewReportInput {
  reportId: ID!
  """처리 방식."""
  action: AdminReviewReportAction!
  """처리 메모. 최대 500자. 선택."""
  note: String
}

"""리뷰 강제 삭제 입력."""
input AdminDeleteReviewInput {
  reviewId: ID!
  """삭제 사유. 감사 로그와 닫히는 신고의 메모에 기록된다. 최대 500자."""
  reason: String!
}

"""리뷰 댓글 강제 삭제 입력."""
input AdminDeleteReviewCommentInput {
  commentId: ID!
  """삭제 사유. 감사 로그와 닫히는 신고의 메모에 기록된다. 최대 500자."""
  reason: String!
}
