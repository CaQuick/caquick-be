extend type Query {
  """지역 마스터 목록을 level·sortOrder·id 순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminRegions(input: AdminRegionListInput): [AdminRegion!]!
}

extend type Mutation {
  """
  지역을 만든다. parentId가 없으면 1차(광역), 있으면 그 아래 2차(시군구)다 — parentId는 활성 1차 지역이어야
  하며 아니면 BAD_USER_INPUT. slug가 이미 쓰이고 있으면 BAD_USER_INPUT. 삭제된 같은 slug가 있으면 새로 만들지
  않고 복구한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminCreateRegion(input: AdminCreateRegionInput!): AdminRegion!
  """지역을 수정한다. 전달한 필드만 바뀌고 parentId·level은 바꿀 수 없다. slug 충돌이면 BAD_USER_INPUT, 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminUpdateRegion(input: AdminUpdateRegionInput!): AdminRegion!
  """
  지역을 삭제(soft-delete)한다. 2차 지역에 매장이 연결돼 있거나 1차 지역에 활성 하위 지역이 있으면 BAD_USER_INPUT.
  없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminDeleteRegion(regionId: ID!): Boolean!
}

"""지역 마스터 1건."""
type AdminRegion {
  id: ID!
  """상위 1차 지역 ID. 1차 지역이면 null."""
  parentId: ID
  """1 = 광역 그룹, 2 = 시군구."""
  level: Int!
  """이름."""
  name: String!
  """URL·시드용 고유 키."""
  slug: String!
  """노출 순서. 오름차순."""
  sortOrder: Int!
  """노출 여부."""
  isActive: Boolean!
  """중심 위도. 미등록 시 null."""
  centerLat: String
  """중심 경도. 미등록 시 null."""
  centerLng: String
  """연결된 매장 수(삭제 제외). 2차 지역만 의미 있다."""
  storeCount: Int!
  """활성 하위 지역 수. 1차 지역만 의미 있다."""
  childCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""지역 목록 조회 조건."""
input AdminRegionListInput {
  """상위 지역 ID. 지정하면 그 아래 2차 지역만, 미지정 시 전체."""
  parentId: ID
  """비활성 포함 여부. 기본 false."""
  includeInactive: Boolean = false
}

"""지역 생성 입력."""
input AdminCreateRegionInput {
  """상위 1차 지역 ID. 없으면 1차 지역을 만든다."""
  parentId: ID
  """이름. 1~80자."""
  name: String!
  """고유 키. 1~120자, 소문자·숫자·`-`만."""
  slug: String!
  """노출 순서. 미지정 시 0."""
  sortOrder: Int
  """노출 여부. 기본 true."""
  isActive: Boolean = true
  """중심 위도(문자열, -90~90). 선택."""
  centerLat: String
  """중심 경도(문자열, -180~180). 선택."""
  centerLng: String
}

"""지역 수정 입력. 전달한 필드만 변경된다."""
input AdminUpdateRegionInput {
  regionId: ID!
  """이름."""
  name: String
  """고유 키."""
  slug: String
  """노출 순서."""
  sortOrder: Int
  """노출 여부."""
  isActive: Boolean
  """중심 위도. null이면 제거."""
  centerLat: String
  """중심 경도. null이면 제거."""
  centerLng: String
}
