"""
ID 키셋 커서 기반 목록 조회 공통 입력. 관리자 목록 API가 공유한다.

정렬은 각 목록이 정하며(대부분 최신순), 커서는 그 정렬을 전제로 한 불투명 토큰이다.
정렬 기준이 바뀌면 이전에 받은 커서는 무효가 된다.
"""
input AdminCursorInput {
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: ID
}

extend type Mutation {
  """
  관리자 이미지 업로드용 Presigned URL을 발급한다. ADMIN 권한 필수.

  발급받은 `uploadUrl`로 파일을 PUT한 뒤, 저장 뮤테이션(배너 생성·수정, 매장 기본정보 수정)에
  `publicUrl`을 그대로 넘긴다. 저장 시 발급 계정과 용도가 대조되므로 외부 URL은 거절된다.
  """
  adminCreateUploadUrl(input: AdminCreateUploadUrlInput!): UploadUrl!
}

"""
관리자가 올릴 수 있는 이미지 용도.

용도마다 저장 경로와 허용 크기가 다르고, 저장 시 이 용도로 발급된 URL인지 대조한다.
"""
enum AdminUploadPurpose {
  """홈·검색 배너 이미지. 최대 10MB."""
  BANNER_IMAGE
  """매장 프로필 이미지. 최대 5MB."""
  STORE_IMAGE
}

"""관리자 이미지 업로드 URL 발급 입력."""
input AdminCreateUploadUrlInput {
  """업로드 용도. 저장 경로와 크기 제한을 결정한다."""
  purpose: AdminUploadPurpose!
  """업로드할 파일의 MIME 타입(예: image/jpeg)."""
  contentType: String!
  """업로드할 파일 크기(바이트)."""
  contentLength: Int!
}
