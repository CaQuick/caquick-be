extend type Query {
  """플랫폼 배너 목록을 최신 등록순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminBanners(input: AdminBannerListInput): AdminBannerConnection!
  """배너 1건을 조회한다. 없거나 삭제됐으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminBanner(bannerId: ID!): AdminBanner!
}

extend type Mutation {
  """
  배너를 등록한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  저장 시점에 구매자 조회가 뽑을 수 있는 상태인지 검증한다:
  linkType에 맞는 링크 필드만 보내야 하며 무관한 필드가 섞이면 BAD_USER_INPUT,
  링크 대상(상품·매장·카테고리)이 없거나 비활성·삭제 상태면 NOT_FOUND(상품은 소속 매장까지),
  CATEGORY 지면은 EVENT 카테고리 링크가 필수, startsAt은 endsAt보다 앞서야 한다(BAD_USER_INPUT).
  """
  adminCreateBanner(input: AdminCreateBannerInput!): AdminBanner!
  """
  배너를 수정한다. 전달한 필드만 바뀌며, 검증은 현재 값과 병합한 최종 상태로 한다(규칙은 adminCreateBanner와 동일).
  linkType을 바꾸면 이전 타입의 링크 필드는 null로 정리된다. 배너가 없으면 NOT_FOUND.
  placement·imageUrl·linkType·sortOrder·isActive는 null을 보낼 수 없다(BAD_USER_INPUT) — 생략만 가능.
  """
  adminUpdateBanner(input: AdminUpdateBannerInput!): AdminBanner!
  """배너를 삭제(soft-delete)한다. 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN."""
  adminDeleteBanner(bannerId: ID!): Boolean!
}

"""
플랫폼 배너. 홈·검색 등 앱 전체 지면에 노출되며 매장에 속하지 않는다.
linkType이 어느 링크 필드를 읽어야 할지 정한다 — 관리자 조회는 저장된 값을 그대로 내린다.
"""
type AdminBanner {
  id: ID!
  """노출 슬롯."""
  placement: BannerPlacement!
  """배너 문구. 미입력 시 null."""
  title: String
  """배너 이미지 URL."""
  imageUrl: String!
  """이동 대상 타입. 읽어야 할 링크 필드를 가리킨다."""
  linkType: BannerLinkType!
  """이동할 URL. linkType이 URL일 때 쓰는 값."""
  linkUrl: String
  """이동할 상품 ID. linkType이 PRODUCT일 때 쓰는 값."""
  linkProductId: ID
  """이동할 매장 ID. linkType이 STORE일 때 쓰는 값."""
  linkStoreId: ID
  """이동할 카테고리 ID. linkType이 CATEGORY일 때 쓰는 값."""
  linkCategoryId: ID
  """노출 시작 일시. null이면 시작 제한 없음."""
  startsAt: DateTime
  """노출 종료 일시. null이면 종료 제한 없음."""
  endsAt: DateTime
  """같은 슬롯 안에서의 노출 순서. 구매자 노출은 오름차순(같으면 id 오름차순)으로 1건만 뽑는다."""
  sortOrder: Int!
  """노출 여부. false면 기간 안이어도 나오지 않는다."""
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""배너 목록 페이지. 최신 등록이 먼저 온다."""
type AdminBannerConnection {
  """배너. 최신 등록이 먼저 온다."""
  items: [AdminBanner!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: ID
}

"""배너 목록 조회 조건."""
input AdminBannerListInput {
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
  """이전 응답의 nextCursor. 첫 페이지는 생략한다."""
  cursor: ID
  """노출 슬롯 필터. 미지정 시 전체."""
  placement: BannerPlacement
  """노출 여부 필터. 미지정 시 전체."""
  isActive: Boolean
}

"""배너 등록 입력. linkType에 맞는 링크 필드를 함께 보내야 한다."""
input AdminCreateBannerInput {
  """노출 슬롯."""
  placement: BannerPlacement!
  """배너 문구."""
  title: String
  """배너 이미지 URL. adminCreateUploadUrl(BANNER_IMAGE)로 이 계정에 발급된 publicUrl만 허용, 아니면 BAD_USER_INPUT."""
  imageUrl: String!
  """이동 대상 타입. 기본 NONE(이동 없음)."""
  linkType: BannerLinkType = NONE
  """linkType이 URL일 때 쓸 이동 URL."""
  linkUrl: String
  """linkType이 PRODUCT일 때 쓸 상품 ID."""
  linkProductId: ID
  """linkType이 STORE일 때 쓸 매장 ID."""
  linkStoreId: ID
  """linkType이 CATEGORY일 때 쓸 카테고리 ID."""
  linkCategoryId: ID
  """노출 시작 일시. 생략 시 시작 제한 없음."""
  startsAt: DateTime
  """노출 종료 일시. 생략 시 종료 제한 없음."""
  endsAt: DateTime
  """같은 슬롯 안에서의 노출 순서. 미지정 시 0."""
  sortOrder: Int
  """노출 여부. 기본 true."""
  isActive: Boolean = true
}

"""배너 수정 입력. 전달한 필드만 변경된다(부분 수정)."""
input AdminUpdateBannerInput {
  bannerId: ID!
  """노출 슬롯."""
  placement: BannerPlacement
  """배너 문구."""
  title: String
  """배너 이미지 URL. adminCreateUploadUrl(BANNER_IMAGE)로 이 계정에 발급된 publicUrl만 허용, 아니면 BAD_USER_INPUT."""
  imageUrl: String
  """이동 대상 타입."""
  linkType: BannerLinkType
  """linkType이 URL일 때 쓸 이동 URL."""
  linkUrl: String
  """linkType이 PRODUCT일 때 쓸 상품 ID."""
  linkProductId: ID
  """linkType이 STORE일 때 쓸 매장 ID."""
  linkStoreId: ID
  """linkType이 CATEGORY일 때 쓸 카테고리 ID."""
  linkCategoryId: ID
  """노출 시작 일시."""
  startsAt: DateTime
  """노출 종료 일시."""
  endsAt: DateTime
  """같은 슬롯 안에서의 노출 순서."""
  sortOrder: Int
  """노출 여부."""
  isActive: Boolean
}
